name: Apply indigo palette

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-indigo-palette.yml

permissions:
  contents: write

jobs:
  apply-indigo-palette:
    if: ${{ !contains(github.event.head_commit.message, '[skip indigo palette]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore indigo visual system
        run: |
          node <<'NODE'
          const fs = require('fs');

          let html = fs.readFileSync('index.html', 'utf8');
          const replacements = [
            ['/* ---- NOVA theme ---- */', '/* ---- ORBIT INDIGO theme ---- */'],
            ['--bg:#07090f; --surface:#101722; --surface2:#152131; --surface3:#1d2b3d;', '--bg:#0d0e16; --surface:#161826; --surface2:#1e2133; --surface3:#282c44;'],
            ['--border:#233249; --border2:#34506a;', '--border:#2a2e45; --border2:#383d5a;'],
            ['--text:#f3f7fb; --muted:#95a3b7; --muted2:#65748c;', '--text:#eef0f7; --muted:#9095ad; --muted2:#646a86;'],
            ['--accent:#45e6ff; --accent-dim:#2ca9ff; --accent-deep:#6f5bff; --accent-ink:#061018;', '--accent:#a5b4fc; --accent-dim:#818cf8; --accent-deep:#5b5eea; --accent-ink:#ffffff;'],
            ['--good:#72f6ae; --warn:#ffd166; --bad:#ff5c8a; --info:#91b7ff;', '--good:#5ddca5; --warn:#ffb454; --bad:#ff6b9a; --info:#7aa2ff;'],
            ['--glow:rgba(69,230,255,.3); --hot:#ff5cdb;', '--glow:rgba(129,140,248,.34); --hot:#c084fc;'],
            ['body{background:#03050a;', 'body{background:#060712;'],
            ['background:linear-gradient(180deg,#090d15 0%,#0b111a 42%,#06080e 100%);', 'background:linear-gradient(180deg,#111321 0%,#0d0e18 44%,#080913 100%);'],
            ['rgba(7,9,15', 'rgba(13,14,22'],
            ['rgba(7,10,17', 'rgba(13,14,22'],
            ['rgba(69,230,255', 'rgba(129,140,248'],
            ['rgba(111,91,255', 'rgba(91,94,234'],
            ['rgba(255,92,219', 'rgba(192,132,252'],
            ['rgba(21,33,49', 'rgba(30,33,51'],
            ['rgba(16,23,34', 'rgba(22,24,38'],
            ['rgba(29,43,61', 'rgba(40,44,68']
          ];
          for (const [from, to] of replacements) html = html.split(from).join(to);
          if (/45e6ff|2ca9ff|6f5bff|69,230,255|111,91,255|255,92,219|07090f|101722|152131|1d2b3d|NOVA/.test(html)) {
            throw new Error('Cyan/NOVA palette leftovers remain.');
          }
          fs.writeFileSync('index.html', html);

          let sw = fs.readFileSync('service-worker.js', 'utf8');
          sw = sw.replace(/const CACHE_VERSION = 'ironlog-v\d+';/, "const CACHE_VERSION = 'ironlog-v21';");
          fs.writeFileSync('service-worker.js', sw);
          NODE

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit indigo palette
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js index-v2.html app.bundle.js app-loader.js app-chunks/
          if git diff --cached --quiet; then
            echo "No palette changes to commit."
          else
            git commit -m "Restore indigo palette [skip v2 build] [skip indigo palette]"
            git push
          fi
