name: Codex routine flow repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-flow-repair-20260609.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble and apply repair
        run: |
          cat .github/scripts/flow-repair-parts/part*.txt > .github/scripts/codex-flow-repair-20260609.js
          node .github/scripts/codex-flow-repair-20260609.js
          rm -rf .github/scripts/flow-repair-parts
      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build compiled shell
        run: npm run build:v2
      - name: Run smoke checks
        run: npm run check
      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html index-v2.html app-loader.js app.bundle.js app-chunks service-worker.js tests/smoke-check.js ironlog-reorder-patch.js .github/scripts .github/workflows/codex-flow-repair-20260609.yml
          if git diff --cached --quiet; then
            echo "No repaired app changes to commit."
            exit 0
          fi
          git commit -m "Repair routine workout flow [skip v2 build]"
          git push
