name: Codex quick display repair

on:
  push:
    paths:
      - '.github/workflows/codex-quick-display-repair-20260607.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply display repair
        run: |
          node <<'NODE'
          const fs = require('fs');

          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, content) => fs.writeFileSync(file, content);

          function mustReplace(source, needle, replacement, label) {
            if (!source.includes(needle)) throw new Error(`Missing ${label}`);
            return source.replace(needle, replacement);
          }

          function replaceIfPresent(source, needle, replacement) {
            return source.includes(needle) ? source.replace(needle, replacement) : source;
          }

          let html = read('index.html');

          if (!html.includes('function cleanLogs(logs)')) {
            html = mustReplace(
              html,
              "const todayISO = () => new Date().toISOString().slice(0,10);\n",
              `const todayISO = () => new Date().toISOString().slice(0,10);

          function asArray(value){ return Array.isArray(value) ? value : []; }
          function safeNumber(value, fallback=0){
            const n = Number(value);
            return Number.isFinite(n) ? n : fallback;
          }
          function cleanSet(set){
            const s = (set && typeof set === 'object') ? set : {};
            const cleaned = {
              done: !!s.done,
              weight: s.weight == null || s.weight === '' ? '' : safeNumber(s.weight),
              reps: s.reps == null || s.reps === '' ? '' : safeNumber(s.reps),
              time: s.time == null || s.time === '' ? '' : safeNumber(s.time),
              dist: s.dist == null || s.dist === '' ? '' : safeNumber(s.dist)
            };
            ['weight','reps','time','dist'].forEach(f=>{
              const k=targetKey(f);
              cleaned[k] = s[k] == null || s[k] === '' ? '' : safeNumber(s[k]);
            });
            return cleaned;
          }
          function cleanEntries(entries){
            return asArray(entries).map(en=>({
              exerciseId: String(en && en.exerciseId || ''),
              note: String(en && en.note || ''),
              sets: asArray(en && en.sets).map(cleanSet).filter(s=>
                s.weight!=='' || s.reps!=='' || s.time!=='' || s.dist!=='' || s.done ||
                s.targetWeight!=='' || s.targetReps!=='' || s.targetTime!=='' || s.targetDist!=='')
            })).filter(en=>en.exerciseId);
          }
          function cleanWorkout(item){
            if(!item || typeof item !== 'object') return null;
            return {
              id: String(item.id || uid()),
              date: String(item.date || todayISO()).slice(0,10),
              startedAt: item.startedAt == null ? null : safeNumber(item.startedAt, Date.now()),
              endedAt: item.endedAt ? safeNumber(item.endedAt, Date.now()) : undefined,
              routineId: item.routineId || null,
              dayId: item.dayId || null,
              mode: item.mode === 'guided' ? 'guided' : 'open',
              currentEntryIndex: Math.max(0, Math.floor(safeNumber(item.currentEntryIndex, 0))),
              name: String(item.name || 'Workout'),
              note: String(item.note || ''),
              entries: cleanEntries(item.entries)
            };
          }
          function cleanLogs(logs){
            return asArray(logs).map(cleanWorkout).filter(w=>w && (w.entries.length || w.note));
          }
          function cleanMeasurements(measurements){
            return asArray(measurements).map(m=>({
              ...(m && typeof m === 'object' ? m : {}),
              id: String(m && m.id || uid()),
              date: String(m && m.date || todayISO()).slice(0,10)
            })).filter(m=>m.date);
          }
          function cleanActive(active){
            const workout = cleanWorkout(active);
            return workout && workout.entries ? workout : null;
          }
          `,
              'saved-data cleaners'
            );
          }

          if (!html.includes('function repairStoredIronLog()')) {
            html = mustReplace(
              html,
              "const Pill = ({children, color}) => <span className=\"pill\" style={{background:tint(color,.18), color}}>{children}</span>;\n\n",
              `const Pill = ({children, color}) => <span className="pill" style={{background:tint(color,.18), color}}>{children}</span>;

          function repairStoredIronLog(){
            try{
              store.set('exercises', migrateExercises(store.get('exercises', null)));
              store.set('routines', migrateRoutines(store.get('routines', [])));
              store.set('logs', cleanLogs(store.get('logs', [])));
              store.set('measurements', cleanMeasurements(store.get('measurements', [])));
              store.set('active', cleanActive(store.get('active', null)));
            }catch(e){}
            location.reload();
          }

          `,
              'repair function anchor'
            );
          }

          html = replaceIfPresent(
            html,
            '<p>The app is still safe. Refresh once to reload the screen.</p>',
            '<p>The app is still safe. Repair saved workout data and reload the screen.</p>'
          );
          html = replaceIfPresent(
            html,
            '<button className="btn btn-accent" onClick={()=>location.reload()}>{I.refresh}Reload IronLog</button>',
            '<button className="btn btn-accent" onClick={repairStoredIronLog}>{I.refresh}Repair and reload</button>\\n              <button className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={()=>location.reload()}>{I.refresh}Reload only</button>'
          );

          html = replaceIfPresent(
            html,
            'const normalizedSaved = saved.map(e=>normalizeExerciseVariant(e));',
            "const normalizedSaved = saved.map(e=>normalizeExerciseVariant({id:(e&&e.id)||uid(), media:'', ...e})).filter(e=>e&&e.name);"
          );

          html = replaceIfPresent(html, "const [tab, setTab] = useState(()=>store.get('active', null) ? 'train' : 'today');", "const [tab, setTab] = useState(()=>cleanActive(store.get('active', null)) ? 'train' : 'today');");
          html = replaceIfPresent(html, "const [logs, setLogs] = useState(()=>store.get('logs', []));", "const [logs, setLogs] = useState(()=>cleanLogs(store.get('logs', [])));");
          html = replaceIfPresent(html, "const [measurements, setMeasurements] = useState(()=>store.get('measurements', []));", "const [measurements, setMeasurements] = useState(()=>cleanMeasurements(store.get('measurements', [])));");
          html = replaceIfPresent(html, "const [active, setActive] = useState(()=>store.get('active', null));", "const [active, setActive] = useState(()=>cleanActive(store.get('active', null)));");
          html = replaceIfPresent(html, 'setLogs(row.data.logs||[]);', 'setLogs(cleanLogs(row.data.logs||[]));');
          html = replaceIfPresent(
            html,
            'setMeasurements(row.data.measurements||[]);',
            "setMeasurements(cleanMeasurements(row.data.measurements||[]));\n            if(Object.prototype.hasOwnProperty.call(row.data,'active')) setActive(cleanActive(row.data.active));"
          );

          html = replaceIfPresent(
            html,
            "for(const s of logs){ const en=s.entries.find(e=>e.exerciseId===exId); if(en&&en.sets&&en.sets.length) return en.sets.map(st=>{",
            "for(const s of asArray(logs)){ const en=asArray(s&&s.entries).find(e=>e.exerciseId===exId); if(en&&asArray(en.sets).length) return asArray(en.sets).map(st=>{"
          );

          html = replaceIfPresent(
            html,
            "const tk=trackOf(ex);\n  const variantOptions=sideOptionsFor(ex).filter(s=>s!==sideOf(ex)); const fields=TRACK[tk].fields;\n        const cols=",
            "const tk=trackOf(ex); const fields=TRACK[tk].fields;\n        const demo=demoFor(ex);\n        const sets=asArray(en.sets);\n        const cols="
          );
          html = replaceIfPresent(
            html,
            "const demo=demoFor(ex);\n        const cols=",
            "const demo=demoFor(ex);\n        const sets=asArray(en.sets);\n        const cols="
          );
          html = replaceIfPresent(html, '{en.sets.map((s,si)=>', '{sets.map((s,si)=>');
          html = replaceIfPresent(html, "en.sets.length>1", "sets.length>1");
          html = replaceIfPresent(html, "tk==='ws' && en.sets.some", "tk==='ws' && sets.some");
          html = replaceIfPresent(html, "Math.max(...en.sets.map(s=>epley(s.weight,s.reps)))", "Math.max(...sets.map(s=>epley(s.weight,s.reps)))");

          if (!html.includes('const safeLogs=asArray(logs)')) {
            html = replaceIfPresent(
              html,
              "function TodayView({active, routines, logs, measurements, exById, unit, restDefault, onStartDay, onResume, onNewRoutine, onGoRoutines, onGoLibrary, onGoRecords, onGoCalendar, onMeasure}){\n  const target=nextTrainingTarget(routines, logs);",
              "function TodayView({active, routines, logs, measurements, exById, unit, restDefault, onStartDay, onResume, onNewRoutine, onGoRoutines, onGoLibrary, onGoRecords, onGoCalendar, onMeasure}){\n  const safeLogs=asArray(logs);\n  const target=nextTrainingTarget(routines, safeLogs);"
            );
          }

          write('index.html', html);

          let sw = read('service-worker.js');
          sw = sw.replace(/ironlog-v\d+/, 'ironlog-v30');
          write('service-worker.js', sw);

          let smoke = read('tests/smoke-check.js');
          if (!smoke.includes('saved data is sanitized before render')) {
            smoke = smoke.replace(
              "check('exercise picker and detail resist black screens', index.includes('class AppErrorBoundary') && index.includes('<AppErrorBoundary><App/></AppErrorBoundary>') && index.includes('key={detailEx.id}') && index.includes('const safeSessions=rec && Array.isArray(rec.sessions)') && index.includes('const safeExercises=asArray(exercises)') && index.includes('if(!active){ setPickerFor(null); return; }'));",
              "check('exercise picker and detail resist black screens', index.includes('class AppErrorBoundary') && index.includes('<AppErrorBoundary><App/></AppErrorBoundary>') && index.includes('key={detailEx.id}') && index.includes('const safeSessions=rec && Array.isArray(rec.sessions)') && index.includes('const safeExercises=asArray(exercises)') && index.includes('if(!active){ setPickerFor(null); return; }'));\ncheck('saved data is sanitized before render', index.includes('repairStoredIronLog') && index.includes(\"cleanLogs(store.get('logs', []))\") && index.includes(\"cleanMeasurements(store.get('measurements', []))\") && index.includes(\"cleanActive(store.get('active', null))\") && index.includes('const safeLogs=asArray(logs)') && index.includes('const sets=asArray(en.sets)'));"
            );
          }
          write('tests/smoke-check.js', smoke);

          console.log('Quick display repair applied.');
          NODE
      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build production app
        run: npm run build:v2
      - name: Run smoke checks
        run: npm run check
      - name: Commit rebuilt app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-v2.html app-loader.js app.bundle.js app-chunks service-worker.js tests/smoke-check.js
          if git diff --cached --quiet; then
            echo "No app changes to commit."
          else
            git commit -m "Repair saved workout display crash"
            git push
          fi
