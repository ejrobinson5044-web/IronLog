name: Apply UX polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ux-polish.yml

permissions:
  contents: write

jobs:
  apply-ux-polish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ux polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore patch script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const payload = '';
          fs.writeFileSync('tools/apply-ux-polish.js', zlib.gunzipSync(Buffer.from(payload, 'base64')));
          NODE

      - name: Apply UX polish
        run: node tools/apply-ux-polish.js

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit polished app
        run: |
          rm -f tools/apply-ux-polish.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js tests/smoke-check.js tools/build-v2.js index-v2.html app.bundle.js app-loader.js app-chunks/
          if git diff --cached --quiet; then
            echo "No polished changes to commit."
          else
            git commit -m "Apply Today UX polish [skip v2 build] [skip ux polish]"
            git push
          fi
