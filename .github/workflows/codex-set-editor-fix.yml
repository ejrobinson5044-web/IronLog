          set -euo pipefail
          printf '%s\n' "$PATCH_B64" | base64 --decode --ignore-garbage | gzip -d > /tmp/codex-set-editor.patch
          git apply --whitespace=nowarn /tmp/codex-set-editor.patch
          rm -f .github/workflows/codex-set-editor-fix.yml

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit deployed set editor fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js tests/smoke-check.js index-v2.html app.bundle.js app-loader.js app-chunks/ .github/workflows/codex-set-editor-fix.yml
          if git diff --cached --quiet; then
            echo "No set editor changes to commit."
          else
            git commit -m "Fix set editing controls [codex set editor applied] [skip v2 build]"
            git push
          fi
