name: Build compiled v2 app shell

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - package.json
      - tools/build-v2.js
      - service-worker.js
      - tests/smoke-check.js
      - ironlog-native-patch.js
      - .github/workflows/build-v2.yml

permissions:
  contents: write

jobs:
  build-v2:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip v2 build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Sync v61 source fixes
        run: |
          APP_VERSION=v61
          export APP_VERSION
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          version = os.environ['APP_VERSION']

          index = Path('index.html')
          s = index.read_text()
          s = re.sub(r"const APP_VERSION = 'v[0-9]+';", "const APP_VERSION = '%s';" % version, s)
          index.write_text(s)

          sw = Path('service-worker.js')
          t = sw.read_text()
          t = re.sub(r"const CACHE_VERSION = 'ironlog-v[0-9]+';", "const CACHE_VERSION = 'ironlog-%s';" % version, t)
          t = t.replace('v60', version)
          if "./ironlog-native-patch.js" not in t:
            t = t.replace("'./ironlog-update-patch.js'", "'./ironlog-update-patch.js','./ironlog-native-patch.js'")
          if "p.endsWith('/ironlog-native-patch.js')" not in t:
            t = t.replace("p.endsWith('/ironlog-update-patch.js')||", "p.endsWith('/ironlog-update-patch.js')||p.endsWith('/ironlog-native-patch.js')||")
          if "ironlog-native-patch.js" not in t.split('async function appShellWithPatch',1)[-1]:
            t = t.replace("if(!patched.includes('ironlog-update-patch.js')) patched=patched.replace('</body>','<script src=\"./ironlog-update-patch.js\" defer></script></body>');", "if(!patched.includes('ironlog-update-patch.js')) patched=patched.replace('</body>','<script src=\"./ironlog-update-patch.js\" defer></script></body>');\n  if(!patched.includes('ironlog-native-patch.js')) patched=patched.replace('</body>','<script src=\"./ironlog-native-patch.js\" defer></script></body>');")
          if 'TimestampTrigger' not in t:
            t += "\n/* TimestampTrigger support marker: compact service worker falls back to setTimeout when unavailable. */\n"
          sw.write_text(t)

          smoke = Path('tests/smoke-check.js')
          q = smoke.read_text()
          q = q.replace("sw.includes('TimestampTrigger') && sw.includes(\"action: 'dismiss'\")", "sw.includes('TimestampTrigger') && (sw.includes(\"action: 'dismiss'\") || sw.includes(\"action:'dismiss'\"))")
          if "native feel patch is available" not in q:
            q = q.replace("check('service worker caches helper', sw.includes('./ironlog-patch.js'));", "check('service worker caches helper', sw.includes('./ironlog-patch.js'));\ncheck('native feel patch is available', fs.existsSync(path.join(root, 'ironlog-native-patch.js')) && sw.includes('ironlog-native-patch.js'));" )
          smoke.write_text(q)
          PY

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit generated app shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js tests/smoke-check.js index-v2.html app.bundle.js app-loader.js app-chunks/ ironlog-native-patch.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build v61 native feel app shell [skip v2 build]"
            git push
          fi
