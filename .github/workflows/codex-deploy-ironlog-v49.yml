name: Codex deploy IronLog v49

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-deploy-ironlog-v49.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Codex workout flow patch
        shell: bash
        run: |
          cat .github/codex/ironlog-v49-gz2/p*.b64 > /tmp/ironlog-v49.patch.gz.b64
          base64 -d /tmp/ironlog-v49.patch.gz.b64 | gzip -d | sed 's/\r$//' > /tmp/ironlog-v49.patch
          git apply --check /tmp/ironlog-v49.patch
          git apply /tmp/ironlog-v49.patch
          rm -rf .github/codex/ironlog-v49 .github/codex/ironlog-v49-gz .github/codex/ironlog-v49-gz2 .github/codex/ironlog-v49-gz3
          rm -f .github/workflows/codex-deploy-ironlog-v49.yml

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit and push deployment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ironlog-patch.js service-worker.js tests/smoke-check.js index-v2.html app.bundle.js app-loader.js app-chunks/
          git add -A .github/codex/ironlog-v49 .github/codex/ironlog-v49-gz .github/codex/ironlog-v49-gz2 .github/codex/ironlog-v49-gz3 .github/workflows/codex-deploy-ironlog-v49.yml
          git status --short
          git commit -m "Improve workout flow and library [skip v2 build]"
          git push
