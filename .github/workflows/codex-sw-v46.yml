name: Codex PWA cache v46 deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-sw-v46.yml'

permissions:
  contents: write

jobs:
  bump-sw-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump service worker cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'service-worker.js': ("ironlog-v45", "ironlog-v46"),
              'tests/smoke-check.js': ("ironlog-v45", "ironlog-v46"),
          }
          for file, (old, new) in replacements.items():
              path = Path(file)
              text = path.read_text(encoding='utf-8')
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'Could not find {old} in {file}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Run checks
        run: npm run check

      - name: Commit and push cache bump
        shell: bash
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          rm -f .github/workflows/codex-sw-v46.yml
          git add service-worker.js tests/smoke-check.js .github/workflows/codex-sw-v46.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump PWA cache for live routine save [codex sw v46] [skip v2 build]"
          git push
