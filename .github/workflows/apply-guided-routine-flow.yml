name: Apply guided routine flow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-guided-routine-flow.yml

permissions:
  contents: write

jobs:
  apply-guided-routine-flow:
    if: ${{ !contains(github.event.head_commit.message, '[skip guided flow]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare guided patch script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = '.github/apply-guided-routine-flow.js';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes("if (html.includes('function cleanSet'))")) {
            s = s.replace("regex(\n  /function cleanSet", "if (html.includes('function cleanSet')) {\n  regex(\n    /function cleanSet");
            s = s.replace("  'clean workout data'\n);\n\nregex(\n  /  const lastSetsFor", "    'clean workout data'\n  );\n}\n\nregex(\n  /  const lastSetsFor");
          }
          fs.writeFileSync(p, s);
          NODE

      - name: Apply guided routine UX fixes
        run: node .github/apply-guided-routine-flow.js

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit guided routine flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/smoke-check.js service-worker.js index-v2.html app.bundle.js app-loader.js app-chunks/
          if git diff --cached --quiet; then
            echo "No guided routine changes to commit."
          else
            git commit -m "Improve guided routine workout flow [skip guided flow]"
            git push
          fi
