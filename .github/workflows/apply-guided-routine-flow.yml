name: Apply guided routine flow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-guided-routine-flow.yml

permissions:
  contents: write

jobs:
  apply-guided-routine-flow:
    if: ${{ !contains(github.event.head_commit.message, '[skip guided flow]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guided routine UX fixes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const must = (ok, msg) => { if (!ok) throw new Error(msg); };
          let html = fs.readFileSync('index.html', 'utf8');
          const text = (from, to, label) => {
            must(html.includes(from), 'Missing text marker: ' + label);
            html = html.replace(from, to);
          };
          const regex = (re, to, label) => {
            must(re.test(html), 'Missing regex marker: ' + label);
            html = html.replace(re, to);
          };

          if (!html.includes('.guided-head{')) {
            text(`  .wb-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}\n\n  /* ---- REST TIMER bar ---- */`, `  .wb-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .guided-head{background:rgba(13,9,20,.82);border:1px solid rgba(168,85,247,.16);border-radius:var(--radius);padding:13px 14px;margin-bottom:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .guided-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .guided-title{font-family:var(--display);font-size:16px;font-weight:800}
  .guided-meta{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
  .guided-track{height:7px;background:rgba(36,22,49,.92);border-radius:999px;overflow:hidden;border:1px solid rgba(168,85,247,.14)}
  .guided-fill{height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent),var(--hot));box-shadow:0 0 18px rgba(168,85,247,.32);transition:width .2s ease}
  .guided-controls{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:8px;margin-top:11px}
  .mini-btn{height:34px;border-radius:9px;background:rgba(36,22,49,.82);border:1px solid rgba(168,85,247,.14);color:var(--text);font-size:12px;font-weight:800;font-family:var(--display)}
  .mini-btn:disabled{opacity:.35}
  .guided-count{text-align:center;font-size:12px;color:var(--muted);font-weight:800}
  .guided-done{background:linear-gradient(135deg,rgba(99,230,190,.12),rgba(168,85,247,.1));border:1px solid rgba(99,230,190,.22);border-radius:var(--radius);padding:13px 14px;margin-bottom:13px;color:var(--text);font-weight:800;text-align:center}

  /* ---- REST TIMER bar ---- */`, 'guided CSS');
          }

          if (!html.includes('const targetKey = (f)=>')) {
            text(`const fieldMode = (f)=> f==='reps' ? 'numeric' : 'decimal';\nfunction setHasData(track, s){`, `const fieldMode = (f)=> f==='reps' ? 'numeric' : 'decimal';
const targetKey = (f)=> 'target'+f.charAt(0).toUpperCase()+f.slice(1);
function setHasData(track, s){`, 'targetKey helper');
          }

          regex(/function cleanSet\(set\)\{[\s\S]*?\n\}\nfunction cleanEntries\(entries\)\{[\s\S]*?\n\}\nfunction cleanWorkout\(item\)\{[\s\S]*?\n\}\nfunction cleanLogs/, `function cleanSet(set){
  const s = (set && typeof set === 'object') ? set : {};
  const cleaned = {
    done: !!s.done,
    weight: s.weight == null || s.weight === '' ? '' : safeNumber(s.weight),
    reps: s.reps == null || s.reps === '' ? '' : safeNumber(s.reps),
    time: s.time == null || s.time === '' ? '' : safeNumber(s.time),
    dist: s.dist == null || s.dist === '' ? '' : safeNumber(s.dist)
  };
  ['weight','reps','time','dist'].forEach(f=>{
    const k=targetKey(f);
    cleaned[k] = s[k] == null || s[k] === '' ? '' : safeNumber(s[k]);
  });
  return cleaned;
}
function cleanEntries(entries){
  return asArray(entries).map(en=>({
    exerciseId: String(en && en.exerciseId || ''),
    note: String(en && en.note || ''),
    sets: asArray(en && en.sets).map(cleanSet).filter(s=>
      s.weight!=='' || s.reps!=='' || s.time!=='' || s.dist!=='' || s.done ||
      s.targetWeight!=='' || s.targetReps!=='' || s.targetTime!=='' || s.targetDist!=='')
  })).filter(en=>en.exerciseId);
}
function cleanWorkout(item){
  if(!item || typeof item !== 'object') return null;
  return {
    id: String(item.id || uid()),
    date: String(item.date || todayISO()).slice(0,10),
    startedAt: safeNumber(item.startedAt, Date.now()),
    endedAt: item.endedAt ? safeNumber(item.endedAt, Date.now()) : undefined,
    routineId: item.routineId || null,
    dayId: item.dayId || null,
    mode: item.mode === 'guided' ? 'guided' : 'open',
    currentEntryIndex: Math.max(0, Math.floor(safeNumber(item.currentEntryIndex, 0))),
    name: String(item.name || 'Workout'),
    note: String(item.note || ''),
    entries: cleanEntries(item.entries)
  };
}
function cleanLogs`, 'clean workout data');

          regex(/  const lastSetsFor = \(exId\)=>\{[\s\S]*?  const startDay = \(day, program, label\)=>\{[\s\S]*?    setTab\('train'\);\n  \};/, `  const lastSetsFor = (exId)=>{
    for(const s of logs){ const en=s.entries.find(e=>e.exerciseId===exId); if(en&&en.sets&&en.sets.length) return en.sets.map(st=>{
      const next={weight:'', reps:'', time:'', dist:'', done:false};
      ['weight','reps','time','dist'].forEach(f=>{ if(st[f]!==undefined && st[f]!==null && st[f] !== '') next[targetKey(f)] = st[f]; });
      return next;
    }); }
    return null;
  };
  const lastNoteFor = (exId)=>{
    for(const s of logs){ const en=s.entries.find(e=>e.exerciseId===exId); if(en&&en.note) return en.note; }
    return '';
  };
  const blankSets = (count)=> Array.from({length:count}, ()=>({weight:'', reps:'', time:'', dist:'', done:false}));
  const newEntry = (id, planned=false)=>({ exerciseId:id, sets: lastSetsFor(id) || blankSets(planned?3:1), note: lastNoteFor(id) });

  const startDay = (day, program, label)=>{
    setActive({ id:uid(), date:todayISO(), startedAt:Date.now(), note:'',
      routineId: program?program.id:null, dayId: day?day.id:null,
      mode: day ? 'guided' : 'open', currentEntryIndex: 0,
      name: day ? (label || day.name || 'Workout') : 'Quick Workout',
      entries:(day?day.exerciseIds:[]).map(id=>newEntry(id, !!day)) });
    setTab('train');
  };`, 'start day flow');

          html = html.replace('<div style={{flex:1,minWidth:0}} onClick={()=>onEdit(r)}>', '<div style={{flex:1,minWidth:0}}>');
          html = html.replace('<div key={d.id} className="day-row" onClick={()=>onEdit(r)}>', '<div key={d.id} className="day-row" onClick={()=>{ if(d.exerciseIds.length) onStartDay(d, r, dayLabel(d, i, r.labelMode||\'num\')); }}>');

          regex(/  const fmt=s=>`\$\{Math\.floor\(s\/60\)\}:\$\{String\(s%60\)\.padStart\(2,'0'\)\}`;[\s\S]*?  const updSessionNote=\(v\)=>\{ setActive\(\{\.\.\.active, note:v\}\); \};/, `  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const totalSets=active.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  const totalVol=active.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).reduce((v,s)=>v+(+s.weight||0)*(+s.reps||0),0),0);
  const entryComplete=(en)=>{
    const ex=exById[en.exerciseId]; const tk=trackOf(ex);
    return en.sets.length>0 && en.sets.every(s=>s.done && setHasData(tk,s));
  };
  const guided=(active.mode==='guided'||!!active.routineId) && active.entries.length>0;
  const completeExercises=active.entries.filter(entryComplete).length;
  const allExercisesDone=active.entries.length>0 && completeExercises===active.entries.length;
  const firstOpen=active.entries.findIndex(en=>!entryComplete(en));
  const storedIndex=Math.max(0, Math.min(active.entries.length-1, Math.floor(+active.currentEntryIndex||0)));
  const currentIndex=guided ? (firstOpen===-1 ? storedIndex : (entryComplete(active.entries[storedIndex]) ? firstOpen : storedIndex)) : -1;
  const progressPct=active.entries.length ? (completeExercises/active.entries.length)*100 : 0;

  const setFocusIndex=(idx)=>{
    if(!guided) return;
    const next=Math.max(0, Math.min(active.entries.length-1, idx));
    setActive({...active, currentEntryIndex:next});
  };
  const advanceAfterSet=(e,ei,label)=>{
    if(!guided){ setActive(e); startRest(label||'Rest'); return; }
    if(!entryComplete(e.entries[ei])){ setActive(e); startRest(label||'Rest'); return; }
    const next=e.entries.findIndex((en,idx)=>idx>ei && !entryComplete(en));
    if(next>=0){
      e.currentEntryIndex=next;
      setActive(e);
      const nx=exById[e.entries[next].exerciseId];
      startRest(nx ? 'Next: '+nx.name : 'Next exercise');
      return;
    }
    const anyOpen=e.entries.findIndex(en=>!entryComplete(en));
    if(anyOpen>=0){
      e.currentEntryIndex=anyOpen;
      setActive(e);
      startRest(label||'Rest');
      return;
    }
    e.currentEntryIndex=ei;
    setActive(e);
  };
  const finishSet=(ei,si,eOverride)=>{
    const e=eOverride||clone(active); const entry=e.entries[ei]; if(!entry) return;
    const ex=exById[entry.exerciseId]; const tk=trackOf(ex); const set=entry.sets[si]; if(!set) return;
    if(!setHasData(tk,set)){ set.done=false; setActive(e); return; }
    const was=set.done; set.done=true;
    if(!was) advanceAfterSet(e,ei,ex?ex.name:'Rest'); else setActive(e);
  };
  const upd=(ei,si,f,v)=>{
    const e=clone(active); const entry=e.entries[ei]; if(!entry) return;
    const ex=exById[entry.exerciseId]; const tk=trackOf(ex); const set=entry.sets[si]; if(!set) return;
    const wasDone=set.done;
    set[f]=v;
    if(wasDone && !setHasData(tk,set)){ set.done=false; setActive(e); return; }
    if(!wasDone && setHasData(tk,set)){ finishSet(ei,si,e); return; }
    setActive(e);
  };
  const toggleDone=(ei,si)=>{
    const e=clone(active); const set=e.entries[ei]&&e.entries[ei].sets[si]; if(!set) return;
    if(set.done){ set.done=false; setActive(e); return; }
    finishSet(ei,si,e);
  };
  const addSet=(ei)=>{ const e=clone(active); const last=e.entries[ei].sets[e.entries[ei].sets.length-1]; e.entries[ei].sets.push(last?{...last,weight:'',reps:'',time:'',dist:'',done:false}:{weight:'',reps:'',time:'',dist:'',done:false}); setActive(e); };
  const delSet=(ei,si)=>{ const e=clone(active); e.entries[ei].sets.splice(si,1); if(!e.entries[ei].sets.length) e.entries[ei].sets.push({done:false}); setActive(e); };
  const removeEx=(ei)=>{ const e=clone(active); e.entries.splice(ei,1); setActive(e); };
  const updNote=(ei,v)=>{ const e=clone(active); e.entries[ei].note=v; setActive(e); };
  const updSessionNote=(v)=>{ setActive({...active, note:v}); };`, 'train flow logic');

          if (!html.includes('Routine flow')) {
            text(`      </div>\n      <textarea className="session-note"`, `      </div>
      {guided &&
        <div className="guided-head">
          <div className="guided-top">
            <div>
              <div className="guided-meta">Routine flow</div>
              <div className="guided-title">{allExercisesDone?'All exercises complete':'Exercise '+(currentIndex+1)+' of '+active.entries.length}</div>
            </div>
            <div className="guided-meta">{completeExercises}/{active.entries.length}</div>
          </div>
          <div className="guided-track"><div className="guided-fill" style={{width:progressPct+'%'}}></div></div>
          <div className="guided-controls">
            <button className="mini-btn" disabled={currentIndex<=0} onClick={()=>setFocusIndex(currentIndex-1)}>Prev</button>
            <div className="guided-count">{allExercisesDone?'Ready to finish':'Current lift'}</div>
            <button className="mini-btn" disabled={currentIndex>=active.entries.length-1} onClick={()=>setFocusIndex(currentIndex+1)}>Next</button>
          </div>
        </div>}
      {guided && allExercisesDone && <div className="guided-done">Routine day complete. Finish when notes look right.</div>}
      <textarea className="session-note"`, 'guided workout header');
          }

          html = html.replace('{active.entries.map((en,ei)=>{\n        const ex=exById[en.exerciseId]; if(!ex) return null;', `{active.entries.map((en,ei)=>{
        if(guided && ei!==currentIndex) return null;
        const ex=exById[en.exerciseId]; if(!ex) return null;`);
          regex(/\{fields\.map\(f=><input key=\{f\} type="number" inputMode=\{fieldMode\(f\)\} placeholder="[^"]*" value=\{s\[f\]\|\|''\} onChange=\{e=>upd\(ei,si,f,e\.target\.value\)\} \/>\)\}/, `{fields.map(f=><input key={f} type="number" inputMode={fieldMode(f)}
                    placeholder={s[targetKey(f)]!==undefined && s[targetKey(f)]!=='' ? String(s[targetKey(f)]) : '—'}
                    value={s[f]||''} onChange={e=>upd(ei,si,f,e.target.value)} />)}`, 'target placeholders');
          html = html.replace('const add=ids.filter(id=>!ex.includes(id)).map(id=>newEntry(id));', "const add=ids.filter(id=>!ex.includes(id)).map(id=>newEntry(id, active&&(active.mode==='guided'||!!active.routineId)));");
          html = html.replace('Auto-starts when you check off a set. You can also tap', 'Auto-starts when a set is completed. You can still tap');

          must(html.includes("mode: day ? 'guided' : 'open'"), 'guided mode missing');
          must(html.includes('advanceAfterSet'), 'set advance logic missing');
          must(html.includes('Routine flow'), 'guided UI missing');
          fs.writeFileSync('index.html', html);

          let tests = fs.readFileSync('tests/smoke-check.js', 'utf8');
          if (!tests.includes('routine day tap starts training')) {
            tests = tests.replace(
              "check('progress keeps calendar access', index.includes('onOpenCalendar') && index.includes('Calendar</button>'));",
              "check('progress keeps calendar access', index.includes('onOpenCalendar') && index.includes('Calendar</button>'));\ncheck('routine day tap starts training', index.includes('className=\"day-row\" onClick={()=>{ if(d.exerciseIds.length) onStartDay') && index.includes('button className=\"rc-edit\"'));\ncheck('planned routines use guided flow', index.includes(\"mode: day ? 'guided' : 'open'\") && index.includes('currentEntryIndex') && index.includes('className=\"guided-head\"'));\ncheck('set entry auto-completes and advances', index.includes('function TrainView') && index.includes('advanceAfterSet') && index.includes('setHasData(tk,set)') && index.includes(\"'Next: '+nx.name\"));"
            );
          }
          fs.writeFileSync('tests/smoke-check.js', tests);

          let sw = fs.readFileSync('service-worker.js', 'utf8');
          sw = sw.replace(/const CACHE_VERSION = 'ironlog-v\d+';/, "const CACHE_VERSION = 'ironlog-v23';");
          fs.writeFileSync('service-worker.js', sw);
          NODE

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit guided routine flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/smoke-check.js service-worker.js index-v2.html app.bundle.js app-loader.js app-chunks/
          if git diff --cached --quiet; then
            echo "No guided routine changes to commit."
          else
            git commit -m "Improve guided routine workout flow [skip guided flow]"
            git push
          fi
