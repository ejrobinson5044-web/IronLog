name: Codex UX polish deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-ux-polish.yml

permissions:
  contents: write

jobs:
  apply-ux-polish:
    if: ${{ !contains(github.event.head_commit.message, '[codex ux applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Codex UX source patch
        shell: bash
        run: |
          cat > /tmp/codex-ux-source.patch.gz.b64 <<'B64'

B64
          base64 -d /tmp/codex-ux-source.patch.gz.b64 | gzip -d > /tmp/codex-ux-source.patch
          git apply --whitespace=nowarn /tmp/codex-ux-source.patch
          rm -f .github/workflows/codex-ux-polish.yml

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit deployed UX pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js tests/smoke-check.js index-v2.html app.bundle.js app-loader.js app-chunks/ .github/workflows/codex-ux-polish.yml
          if git diff --cached --quiet; then
            echo "No UX changes to commit."
          else
            git commit -m "Improve routine UX and workout flow [skip v2 build]"
            git push
          fi
