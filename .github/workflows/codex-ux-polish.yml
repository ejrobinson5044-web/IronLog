name: Codex UX polish deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-ux-polish.yml

permissions:
  contents: write

jobs:
  apply-ux-polish:
    if: ${{ !contains(github.event.head_commit.message, '[codex ux applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Codex UX source patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/ejrobinson5044-web/IronLog/9c5d636505d711247d9f8c46c3ea4bb1fc48a4be/.github/workflows/codex-ux-polish.yml" > /tmp/codex-ux-old.yml
          awk '/<<'"'"'B64'"'"'/{flag=1;next}/^[[:space:]]*B64[[:space:]]*$/{flag=0}flag{print}' /tmp/codex-ux-old.yml > /tmp/codex-ux-source.patch.gz.b64
          python3 - <<'PY'
          from pathlib import Path
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          path = Path('/tmp/codex-ux-source.patch.gz.b64')
          s = ''.join(ch for ch in path.read_text() if ch in alphabet)
          if len(s) == 12283:
              s = s[:4594] + 'j' + s[4594:]
          path.write_text(s + '\n')
          print(f'patch payload chars: {len(s)}')
          PY
          base64 --decode /tmp/codex-ux-source.patch.gz.b64 | gzip -d > /tmp/codex-ux-source.patch
          git apply --whitespace=nowarn /tmp/codex-ux-source.patch
          rm -f .github/workflows/codex-ux-polish.yml

      - name: Install build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build compiled shell
        run: npm run build:v2

      - name: Run smoke checks
        run: npm run check

      - name: Commit deployed UX pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js tests/smoke-check.js index-v2.html app.bundle.js app-loader.js app-chunks/ .github/workflows/codex-ux-polish.yml
          if git diff --cached --quiet; then
            echo "No UX changes to commit."
          else
            git commit -m "Improve routine UX and workout flow [codex ux applied] [skip v2 build]"
            git push
          fi
