name: Codex plan preview runner

on:
  push:
    paths:
      - '.github/workflows/codex-plan-preview-runner-20260607.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply plan preview patch
        run: |
          node - <<'NODE'
          (async()=>{
            const fs = require('fs');
            const url = 'https://raw.githubusercontent.com/ejrobinson5044-web/IronLog/main/.github/workflows/codex-plan-preview-20260607.yml?cb=' + Date.now();
            const text = await fetch(url).then(r => {
              if (!r.ok) throw new Error('Could not fetch patch workflow: ' + r.status);
              return r.text();
            });
            const match = text.match(/CODEX_PATCH_B64: '([^']+)'/);
            if (!match) throw new Error('Missing embedded patch');
            const script = Buffer.from(match[1], 'base64').toString('utf8').replaceAll('Patch.includes', 'patch.includes');
            fs.writeFileSync('.codex-plan-preview-20260607.js', script);
            require('./.codex-plan-preview-20260607.js');
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE
      - name: Install build tools
        run: npm install --no-package-lock
      - name: Build production app
        run: npm run build:v2
      - name: Run smoke checks
        run: npm run check
      - name: Commit rebuilt app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-v2.html app-loader.js app.bundle.js app-chunks ironlog-patch.js service-worker.js tests/smoke-check.js
          if git diff --cached --quiet; then
            echo "No app changes to commit."
          else
            git commit -m "Improve plan day preview flow"
            git push
          fi
