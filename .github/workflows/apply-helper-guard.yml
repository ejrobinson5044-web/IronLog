name: Apply helper safety guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-helper-guard.yml

permissions:
  contents: write

jobs:
  apply-helper-guard:
    if: ${{ !contains(github.event.head_commit.message, '[skip helper guard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply import safety guard
        run: |
          node <<'NODE'
          const fs = require('fs');

          let patch = fs.readFileSync('ironlog-patch.js', 'utf8');
          if (!patch.includes('ironlogSnapshotGuard')) {
            const lines = patch.split(/\r?\n/);
            const start = lines.findIndex((line) => line === '  function ensureRestoreButton(general) {');
            if (start === -1) throw new Error('Could not find ensureRestoreButton.');
            const insertAfter = lines.findIndex((line, index) => index > start && line === '    const snapshot = readJson(SAFETY_SNAPSHOT_KEY, null);');
            if (insertAfter === -1) throw new Error('Could not find ensureRestoreButton snapshot line.');
            lines.splice(insertAfter + 1, 0,
              '    const fileInput = general.querySelector(\'input[type="file"]\');',
              '    if (fileInput && fileInput.dataset.ironlogSnapshotGuard !== \'1\') {',
              '      fileInput.dataset.ironlogSnapshotGuard = \'1\';',
              '      fileInput.addEventListener(\'change\', () => {',
              '        if (fileInput.files && fileInput.files[0]) saveSafetySnapshot(\'before import\');',
              '      }, true);',
              '    }'
            );
            patch = lines.join('\n');
            fs.writeFileSync('ironlog-patch.js', patch.endsWith('\n') ? patch : patch + '\n');
          }

          let sw = fs.readFileSync('service-worker.js', 'utf8');
          sw = sw.replace(/const CACHE_VERSION = 'ironlog-v\d+';/, "const CACHE_VERSION = 'ironlog-v19';");
          fs.writeFileSync('service-worker.js', sw);
          NODE

      - name: Run smoke checks
        run: node tests/smoke-check.js

      - name: Commit helper update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ironlog-patch.js service-worker.js
          if git diff --cached --quiet; then
            echo "No helper changes to commit."
          else
            git commit -m "Add import safety guard [skip helper guard]"
            git push
          fi
