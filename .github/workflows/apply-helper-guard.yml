name: Apply helper safety guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-helper-guard.yml

permissions:
  contents: write

jobs:
  apply-helper-guard:
    if: ${{ !contains(github.event.head_commit.message, '[skip helper guard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply import safety guard
        run: |
          node <<'NODE'
          const fs = require('fs');

          let patch = fs.readFileSync('ironlog-patch.js', 'utf8');
          const lines = patch.split(/\r?\n/);

          if (!patch.includes('function ensureRestoreButton')) {
            const backupReturn = lines.findIndex((line) =>
              line.includes("labels.includes('Backup')") &&
              line.includes('Export') &&
              line.includes('Import') &&
              line.trim().endsWith('return;')
            );
            if (backupReturn === -1) throw new Error('Could not find existing Backup UI return.');
            lines.splice(backupReturn, 1,
              "    if (labels.includes('Backup') && /\\bExport\\b/.test(general.textContent || '') && /\\bImport\\b/.test(general.textContent || '')) {",
              '      ensureRestoreButton(general);',
              '      return;',
              '    }'
            );

            const resetIndex = lines.findIndex((line) => line === '  function ensureResetGuard() {');
            if (resetIndex === -1) throw new Error('Could not find ensureResetGuard insertion point.');
            const helper = [
              '',
              '  function ensureRestoreButton(general) {',
              '    const snapshot = readJson(SAFETY_SNAPSHOT_KEY, null);',
              '    const fileInput = general.querySelector(\'input[type="file"]\');',
              '    if (fileInput && fileInput.dataset.ironlogSnapshotGuard !== \'1\') {',
              '      fileInput.dataset.ironlogSnapshotGuard = \'1\';',
              '      fileInput.addEventListener(\'change\', () => {',
              '        if (fileInput.files && fileInput.files[0]) saveSafetySnapshot(\'before import\');',
              '      }, true);',
              '    }',
              "    if (!snapshot || general.querySelector('[data-restore-snapshot]')) return;",
              "    const actions = general.querySelector('.backup-actions');",
              '    if (!actions) return;',
              "    const button = document.createElement('button');",
              "    button.className = 'btn btn-ghost btn-sm';",
              "    button.type = 'button';",
              "    button.dataset.restoreSnapshot = '1';",
              "    button.textContent = 'Restore';",
              "    button.addEventListener('click', restoreSafetySnapshot);",
              '    actions.appendChild(button);',
              "    if (!general.querySelector('[data-snapshot-meta]') && snapshot.exportedAt) {",
              "      const meta = document.createElement('div');",
              "      meta.className = 'backup-meta';",
              "      meta.dataset.snapshotMeta = '1';",
              '      meta.textContent = `Safety snapshot: ${new Date(snapshot.exportedAt).toLocaleString()}`;',
              "      actions.insertAdjacentElement('afterend', meta);",
              '    }',
              '  }'
            ];
            lines.splice(resetIndex, 0, ...helper);
            patch = lines.join('\n');
            fs.writeFileSync('ironlog-patch.js', patch.endsWith('\n') ? patch : patch + '\n');
          }
          if (!patch.includes('ironlogSnapshotGuard')) throw new Error('Import snapshot guard was not applied.');

          let sw = fs.readFileSync('service-worker.js', 'utf8');
          sw = sw.replace(/const CACHE_VERSION = 'ironlog-v\d+';/, "const CACHE_VERSION = 'ironlog-v19';");
          fs.writeFileSync('service-worker.js', sw);
          NODE

      - name: Run smoke checks
        run: node tests/smoke-check.js

      - name: Commit helper update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ironlog-patch.js service-worker.js
          if git diff --cached --quiet; then
            echo "No helper changes to commit."
          else
            git commit -m "Add import safety guard [skip helper guard]"
            git push
          fi
