name: Codex training flow polish deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-training-flow-polish.yml'

permissions:
  contents: write

jobs:
  apply-training-flow-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply training flow polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Could not find {label}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label):
              next_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1 and repl not in text:
                  raise SystemExit(f'Could not replace {label}')
              return next_text

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          css_insert = """  .reorder-sheet{max-height:min(94vh,720px) !important}
            .reorder-sheet .sheet-body{padding-bottom:calc(92px + env(safe-area-inset-bottom));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
            .reorder-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
            .reorder-summary b{color:var(--accent);font-family:var(--display)}
            .reorder-savebar{position:sticky;bottom:0;margin:14px -18px calc(-92px - env(safe-area-inset-bottom));padding:14px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(13,9,20,.64),var(--surface) 34%);border-top:1px solid var(--border);backdrop-filter:blur(14px);z-index:3}
          """
          if '.reorder-sheet{' not in index:
              index = replace_once(index,
                  "  .workout-actions .btn{padding:11px 10px;font-size:13px}\n  .set-entry-hint",
                  "  .workout-actions .btn{padding:11px 10px;font-size:13px}\n" + css_insert + "  .set-entry-hint",
                  'reorder scroll CSS')

          live_repl = """// For a LIVE workout: keep targets as placeholders/goals. Actual fields stay
            // blank until the lifter records what happened, so goals never auto-log a set.
            const liveEntry = (id, planned=false, day=null)=>{
              return newEntry(id, planned, day);
            };"""
          if 'goals never auto-log a set' not in index:
              index = sub_once(index,
                  r"// For a LIVE workout: prefill[\s\S]*?const liveEntry = \(id, planned=false, day=null\)=>\{[\s\S]*?\n  \};",
                  live_repl,
                  'live targets as placeholders')

          index = index.replace("sets.length+' planned set'", "sets.length+' goal set'")

          fields_repl = """const fieldsTouched=(set, fields)=>{
              const touched=asArray(set&&set._touchedFields);
              return fields.every(f=>touched.includes(f));
            };"""
          if 'return fields.every(f=>touched.includes(f));' not in index:
              index = sub_once(index,
                  r"const fieldsTouched=\(set, fields\)=>\{[\s\S]*?\n  \};",
                  fields_repl,
                  'strict touched fields')

          index = index.replace("    applyTargetDefaults(tk,set);\n", "")

          index = replace_once(index,
              "      if(value!==undefined && value!==null && value!==''){ next[f]=value; next[k]=value; }",
              "      if(value!==undefined && value!==null && value!=='') next[k]=value;",
              'add set target-only copy')

          helper = """  const clearUntouchedGoalValues=(set, fields)=>{
              const touched=asArray(set&&set._touchedFields);
              fields.forEach(f=>{
                const k=targetKey(f);
                const target=set&&set[k];
                if(!touched.includes(f) && target!==undefined && target!==null && target!=='' && String(set[f])===String(target)) set[f]='';
              });
            };
          """
          if 'clearUntouchedGoalValues' not in index:
              index = replace_once(index,
                  "  const markTouched=(set, field)=>{\n    const touched=new Set(asArray(set._touchedFields));\n    touched.add(field);\n    set._touchedFields=[...touched];\n  };\n",
                  "  const markTouched=(set, field)=>{\n    const touched=new Set(asArray(set._touchedFields));\n    touched.add(field);\n    set._touchedFields=[...touched];\n  };\n" + helper,
                  'clear untouched goal helper')

          if 'clearUntouchedGoalValues(set, fields);' not in index:
              index = replace_once(index,
                  "    set[f]=v;\n    markTouched(set,f);\n    // Auto-complete only after every required field has been touched.",
                  "    set[f]=v;\n    markTouched(set,f);\n    clearUntouchedGoalValues(set, fields);\n    // Auto-complete only after every required field has been touched.",
                  'clear untouched goals on edit')

          index = replace_once(index,
              "      <div className=\"sheet\" onClick={e=>e.stopPropagation()} style={{maxHeight:'82vh'}}>",
              "      <div className=\"sheet reorder-sheet\" onClick={e=>e.stopPropagation()}>",
              'reorder sheet class')

          index = replace_once(index,
              "          <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:12}}>Drag the grip to move. Tap <b style={{color:'var(--accent)'}}>Done</b> to apply. Trash removes an exercise from this workout.</div>",
              "          <div className=\"reorder-summary\"><span>Drag the grip to move exercises.</span><b>{ids.length} lift{ids.length!==1?'s':''}</b></div>",
              'reorder summary')

          if 'className="reorder-savebar"' not in index:
              index = replace_once(index,
                  "          })}\n        </div>\n      </div>\n    </div>\n  );\n}\n\n/* strip equipment words",
                  "          })}\n          <div className=\"reorder-savebar\">\n            <button className=\"btn btn-accent\" disabled={!ids.length} style={{opacity:ids.length?1:.45}} onClick={()=>ids.length&&onApply(ids)}>{I.check}Save order</button>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}\n\n/* strip equipment words",
                  'reorder sticky savebar')

          index = index.replace('Auto rest after set', 'Enter actuals to start rest')

          index_path.write_text(index, encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"ironlog-v\d+", "ironlog-v48", sw, count=1)
          sw_path.write_text(sw, encoding='utf-8')

          smoke_path = Path('tests/smoke-check.js')
          smoke = smoke_path.read_text(encoding='utf-8')
          smoke = re.sub(r"sw\.includes\('ironlog-v\d+'\)", "sw.includes('ironlog-v48')", smoke)
          smoke = sub_once(smoke,
              r"check\('set completion can auto-advance after touched fields',[\s\S]*?\);",
              "check('set completion can auto-advance after touched fields', index.includes('function TrainView') && index.includes('advanceAfterSet') && index.includes(\"'Next: '+nx.name\") && index.includes('return fields.every(f=>touched.includes(f));') && index.includes('clearUntouchedGoalValues') && index.includes('Auto-complete only after every required field has been touched') && !index.includes('applyTargetDefaults(tk,set)') && !index.includes('typing never auto-completes a set'));",
              'set completion smoke')
          smoke = sub_once(smoke,
              r"check\('live workouts can be reordered mid-session',[\s\S]*?\);",
              "check('live workouts can be reordered mid-session', index.includes('function WorkoutReorderSheet') && index.includes('onApply={applyReorder}') && index.includes('workout-actions') && index.includes('setShowReorder(true)') && index.includes('reorder-sheet') && index.includes('reorder-savebar'));",
              'reorder smoke')
          smoke = sub_once(smoke,
              r"check\('targets (?:prefill as editable values|stay placeholders until actuals are entered)',[\s\S]*?\);",
              "check('targets stay placeholders until actuals are entered', index.includes('goals never auto-log a set') && index.includes('return newEntry(id, planned, day);') && index.includes('placeholder={s[targetKey(f)]') && index.includes('Enter actuals to start rest') && !index.includes('en.sets=asArray(en.sets).map(s=>applyTargetDefaults'));",
              'target placeholder smoke')
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build app
        run: npm run build:v2

      - name: Run checks
        run: npm run check

      - name: Commit and push applied update
        shell: bash
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          rm -f .github/workflows/codex-training-flow-polish.yml
          git add index.html service-worker.js tests/smoke-check.js app.bundle.js index-v2.html app-loader.js app-chunks/ .github/workflows/codex-training-flow-polish.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Polish training reorder and goal entry flow [codex training polish] [skip v2 build]"
          git push
