<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>IronLog — Workout Tracker</title>

<!-- ============ PWA (installable app) ============ -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#050407" />
<!-- iOS standalone-app behavior (iOS ignores manifest display mode) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IronLog" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<!-- =============================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- ROYAL VOID theme ---- */
    --bg:#050407; --surface:#0d0914; --surface2:#171021; --surface3:#241631;
    --border:#2f1d45; --border2:#55306f;
    --text:#f7f1ff; --muted:#aa9bbd; --muted2:#756482;
    --accent:#c084fc; --accent-dim:#a855f7; --accent-deep:#6d28d9; --accent-ink:#ffffff;
    --good:#63e6be; --warn:#f5c16c; --bad:#ff6b9a; --info:#a78bfa;
    --glow:rgba(168,85,247,.38); --hot:#e879f9;
    --radius:12px; --radius-sm:9px; --radius-lg:18px;
    --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --display:'Archivo',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#020104;color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #root{height:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  ::-webkit-scrollbar{width:0;height:0}

  .app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#09060d 0%,#050407 44%,#030205 100%);
    position:relative;border-left:1px solid rgba(168,85,247,.12);border-right:1px solid rgba(168,85,247,.12);
    box-shadow:0 0 80px rgba(0,0,0,.72);overflow:hidden}
  .app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      linear-gradient(180deg,rgba(168,85,247,.08),transparent 28%,rgba(109,40,217,.06) 68%,transparent),
      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px),
      repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 34px);
    opacity:.34;mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.58) 42%,transparent 100%)}
  .app>*{position:relative;z-index:1}
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 12px;
    background:linear-gradient(180deg,rgba(5,4,7,.96),rgba(5,4,7,.72));backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:9px}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:grid;place-items:center;
    color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:16px;transform:rotate(-4deg);box-shadow:0 0 22px var(--glow)}
  .brand h1{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em}
  .brand h1 span{color:var(--accent)}
  .top-right{display:flex;align-items:center;gap:10px}
  .unit-toggle{display:flex;background:rgba(23,16,33,.82);border-radius:999px;padding:3px;border:1px solid rgba(168,85,247,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .unit-toggle button{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
  .unit-toggle button.on{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:var(--accent-ink);box-shadow:0 0 16px rgba(168,85,247,.22)}
  .gear{width:36px;height:36px;border-radius:999px;background:rgba(23,16,33,.82);border:1px solid rgba(168,85,247,.16);
    display:grid;place-items:center;color:var(--muted);position:relative}
  .gear svg{width:19px;height:19px}
  .sync-dot{position:absolute;top:-1px;right:-1px;width:10px;height:10px;border-radius:999px;border:2px solid var(--bg)}

  .scroll{flex:1;overflow-y:auto;padding:4px 16px calc(150px + env(safe-area-inset-bottom));scroll-behavior:smooth}
  .section-h{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:22px 2px 12px;display:flex;align-items:center;justify-content:space-between}
  .section-h:first-child{margin-top:8px}

  .nav{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(5,4,7,0.9);backdrop-filter:blur(18px);
    border-top:1px solid rgba(168,85,247,.14);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -18px 42px rgba(0,0,0,.45)}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:11px;
    color:var(--muted2);font-size:10.5px;font-weight:700;transition:.15s;min-width:0}
  .nav button.on{color:var(--accent);background:linear-gradient(180deg,rgba(168,85,247,.16),rgba(109,40,217,.08));box-shadow:inset 0 0 0 1px rgba(168,85,247,.16)}
  .nav svg{width:23px;height:23px}

  .card{background:linear-gradient(180deg,rgba(13,9,20,.94),rgba(12,18,28,.92));border:1px solid rgba(168,85,247,.12);border-radius:var(--radius);padding:16px;transition:.15s;box-shadow:0 12px 28px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.04)}
  .today-hero{position:relative;overflow:hidden;border:1px solid rgba(168,85,247,.2);border-radius:var(--radius-lg);
    padding:18px;margin:8px 0 14px;background:
      linear-gradient(135deg,rgba(168,85,247,.18),rgba(109,40,217,.12) 46%,rgba(232,121,249,.08)),
      linear-gradient(180deg,rgba(13,9,20,.98),rgba(8,12,20,.94));
    box-shadow:0 18px 48px rgba(0,0,0,.38),0 0 34px rgba(168,85,247,.12),inset 0 1px 0 rgba(255,255,255,.08)}
  .today-hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(110deg,transparent 0 35%,rgba(255,255,255,.12) 45%,transparent 58%),
      repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,transparent 1px 8px);
    opacity:.35;transform:translateX(-18%)}
  .today-hero>*{position:relative}
  .today-date{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin-bottom:8px}
  .today-title{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.02;letter-spacing:0;margin-bottom:7px}
  .today-sub{color:var(--muted);font-size:13px;line-height:1.45;max-width:360px}
  .today-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
  .today-actions .btn{padding:12px 10px}
  .dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 4px}
  .dash-card{background:rgba(13,9,20,.78);border:1px solid rgba(168,85,247,.12);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .dash-card .v{font-family:var(--display);font-size:23px;font-weight:800;color:var(--text);line-height:1}
  .dash-card .l{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-top:5px}
  .focus-panel{display:grid;gap:10px}
  .focus-row{display:flex;align-items:center;gap:12px;background:rgba(13,9,20,.72);border:1px solid rgba(168,85,247,.12);
    border-radius:var(--radius);padding:13px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .focus-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
    background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(109,40,217,.16));color:var(--accent);border:1px solid rgba(168,85,247,.18)}
  .focus-icon svg{width:22px;height:22px}
  .focus-main{flex:1;min-width:0}
  .focus-kicker{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:2px}
  .focus-title{font-family:var(--display);font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .focus-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .quick-tile{display:flex;align-items:center;gap:10px;background:rgba(13,9,20,.64);border:1px solid rgba(168,85,247,.1);
    border-radius:var(--radius-sm);padding:12px;color:var(--text);font-weight:800;font-size:13px}
  .quick-tile svg{width:19px;height:19px;color:var(--accent);flex-shrink:0}
  .routine-card{margin-bottom:12px}
  .routine-card .rc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .rc-name{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em}
  .rc-meta{color:var(--muted);font-size:13px;margin-top:3px}
  .rc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .rc-edit{background:rgba(36,22,49,.82);border:1px solid rgba(168,85,247,.12);color:var(--muted);font-size:12px;font-weight:700;
    font-family:var(--display);padding:6px 15px;border-radius:999px;flex-shrink:0}
  .rc-edit:active{background:var(--surface2)}
  .day-list{display:flex;flex-direction:column;gap:7px;margin-top:13px}
  .day-row{display:flex;align-items:center;gap:10px;background:rgba(23,16,33,.74);border:1px solid rgba(168,85,247,.1);
    border-radius:11px;padding:11px 12px;cursor:pointer;transition:.12s}
  .day-row:active{background:rgba(36,22,49,.86);border-color:var(--accent-dim)}
  .day-info{flex:1;min-width:0}
  .day-name{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em}
  .day-meta{color:var(--muted);font-size:12px;margin-top:2px}
  .day-tags{display:flex;gap:5px;margin-top:7px}
  .day-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .day-start{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:var(--accent-ink);font-family:var(--display);
    font-weight:800;font-size:13px;padding:9px 18px;border-radius:999px;flex-shrink:0;box-shadow:0 0 20px rgba(168,85,247,.22)}
  .day-start:active{transform:scale(.96)}
  .day-start:disabled{background:var(--surface3);color:var(--muted2);box-shadow:none}
  .day-edit{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
  .day-edit-top{display:flex;align-items:center;gap:8px}
  .day-name-input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 12px;
    color:var(--text);font-family:var(--display);font-weight:700;font-size:14.5px;outline:none;transition:.12s}
  .day-name-input:focus{border-color:var(--accent);background:var(--surface3)}
  .day-pos{flex-shrink:0;font-family:var(--display);font-weight:700;font-size:12px;color:var(--accent);background:var(--surface3);
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:56px;text-align:center;letter-spacing:.01em}
  .day-edit-meta{color:var(--muted);font-size:12px;margin:9px 0 9px 2px}
  .start-btn{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:9px 16px;
    border-radius:999px;white-space:nowrap;font-family:var(--display)}
  .start-btn:active{background:var(--accent-dim)}
  .pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}

  .ex-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);
    background:rgba(13,9,20,.82);border:1px solid rgba(168,85,247,.1);margin-bottom:8px;transition:.12s;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
  .ex-row.tap:active{background:rgba(23,16,33,.92)}
  .reorder-row{position:relative;user-select:none;touch-action:pan-y}
  .reorder-row.ordering{background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(13,9,20,.94));border-color:rgba(168,85,247,.48);box-shadow:0 0 28px rgba(168,85,247,.22),inset 0 1px 0 rgba(255,255,255,.07);transform:translateY(-1px)}
  .reorder-handle{width:28px;height:46px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:var(--muted2);background:rgba(36,22,49,.45);border:1px solid transparent;touch-action:none;cursor:grab}
  .reorder-row.ordering .reorder-handle{color:var(--accent);background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.25)}
  .reorder-handle svg{width:18px;height:18px}
  .reorder-row.dragging{z-index:5;border-color:var(--accent);background:var(--surface3);box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 1px rgba(168,85,247,.35);transform:scale(1.02)}
  .reorder-row.dragging .reorder-handle{color:var(--accent);background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.25);cursor:grabbing}
  .reorder-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .reorder-actions button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(36,22,49,.88);border:1px solid rgba(168,85,247,.22);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .reorder-actions button:disabled{opacity:.35;color:var(--muted2)}
  .reorder-actions button svg{width:17px;height:17px}
  .reorder-actions .reorder-done{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:var(--accent-ink);border-color:transparent}
  .ex-thumb{width:46px;height:46px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;
    background:var(--surface2);border:1px solid var(--border)}
  .ex-thumb svg{width:26px;height:26px}
  .ex-thumb.photo{background:#eef0f3;border-color:var(--border2)}
  .ex-thumb img{width:100%;height:100%;object-fit:cover}
  .ex-info{flex:1;min-width:0}
  .ex-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:6px;align-items:center}
  .ex-sub b{color:var(--accent);font-weight:700}
  .chevron{color:var(--muted2);flex-shrink:0}

  .search-wrap{position:relative;margin:8px 0 4px}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted2)}
  .search{width:100%;background:rgba(13,9,20,.86);border:1px solid rgba(168,85,247,.12);border-radius:999px;
    padding:11px 16px 11px 40px;color:var(--text);outline:none;transition:.15s}
  .search:focus{border-color:var(--accent);background:rgba(23,16,33,.94);box-shadow:0 0 0 3px rgba(168,85,247,.1)}
  .filter-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;margin:0 -16px}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:999px;background:rgba(13,9,20,.78);border:1px solid rgba(168,85,247,.1);
    font-size:12.5px;font-weight:700;color:var(--muted);transition:.12s;white-space:nowrap}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:var(--accent-ink);border-color:transparent;box-shadow:0 0 18px rgba(168,85,247,.18)}

  .btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:var(--radius);
    font-weight:800;font-size:15px;font-family:var(--display);transition:.12s}
  .btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:var(--accent-ink);box-shadow:0 0 22px rgba(168,85,247,.18)}
  .btn-accent:active{background:var(--accent-dim)}
  .btn-ghost{background:rgba(23,16,33,.78);color:var(--text);border:1px solid rgba(168,85,247,.12)}
  .btn-ghost:active{background:rgba(36,22,49,.92)}
  .btn-danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,107,.3)}
  .btn svg{width:19px;height:19px}
  .btn-sm{padding:10px;font-size:13px;border-radius:var(--radius-sm)}
  .btn[disabled]{cursor:not-allowed}

  .fab{position:absolute;right:18px;bottom:calc(90px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 12px 30px rgba(168,85,247,.24);z-index:35;transition:.12s}
  .fab:active{transform:scale(.92)}
  .fab svg{width:28px;height:28px}
  .create-ex-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:10px 0 4px;padding:11px;
    background:rgba(168,85,247,.08);border:1.5px dashed var(--accent-dim);border-radius:11px;color:var(--accent);
    font-family:var(--display);font-weight:700;font-size:13px}
  .create-ex-btn:active{background:rgba(168,85,247,.16)}
  .create-ex-btn svg{width:18px;height:18px}

  .empty{text-align:center;padding:50px 24px;color:var(--muted)}
  .empty .ic{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--border);
    display:grid;place-items:center;margin:0 auto 18px}
  .empty .ic svg{width:30px;height:30px;color:var(--muted2)}
  .empty h3{font-family:var(--display);font-size:18px;color:var(--text);margin-bottom:6px;font-weight:700}
  .empty p{font-size:13.5px;line-height:1.55;max-width:270px;margin:0 auto}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:480px;max-height:92vh;background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    border:1px solid var(--border);border-bottom:none;display:flex;flex-direction:column;animation:slideup .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-grip{width:38px;height:4px;border-radius:999px;background:var(--border2);margin:10px auto 4px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px;border-bottom:1px solid var(--border)}
  .sheet-head h2{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em}
  .sheet-body{overflow-y:auto;padding:18px;flex:1}
  .x-btn{width:32px;height:32px;border-radius:999px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
  .x-btn svg{width:18px;height:18px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
  .field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);outline:none;transition:.15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface3)}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{padding:9px 13px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);
    font-size:13px;font-weight:700;color:var(--muted);transition:.12s}
  .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  .log-ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .superset-wrap{border:1px solid var(--accent-dim);border-radius:var(--radius);margin-bottom:14px;padding:0 0 2px;background:linear-gradient(180deg,rgba(168,85,247,.08),transparent 80px)}
  .superset-wrap .log-ex{margin:0 8px 8px;border-color:var(--border2)}
  .superset-wrap .log-ex:first-of-type{margin-top:8px}

/* ---- storage with safe in-memory fallback ---- */
const store = (() => {
  let mem = {}; let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){ ok = false; }
  return {
    ok,
    get(k, d){ try{ if(ok){ const v=localStorage.getItem(k); return v?JSON.parse(v):d; } return (k in mem)?mem[k]:d; }catch(e){ return d; } },
    set(k, v){ try{ if(ok){ localStorage.setItem(k, JSON.stringify(v)); } else { mem[k]=v; } }catch(e){ mem[k]=v; } }
  };
})();

const epley = (w, r) => { w=+w; r=+r; if(!w||!r||r<1) return 0; return r===1 ? Math.round(w) : Math.round(w*(1+r/30)); };

/* ---- how an exercise is tracked (what fields you log) ---- */
const TRACK = {
  ws: {label:'Weight & reps', fields:['weight','reps']},
  r:  {label:'Reps only',     fields:['reps']},
  t:  {label:'Time',          fields:['time']},
  dt: {label:'Distance & time',fields:['dist','time']},
  d:  {label:'Distance',      fields:['dist']},
  wt: {label:'Weight & time', fields:['weight','time']},
};
const SIDE_OPTIONS = {
  arm:{label:'One Arm', per:'arm'},
  leg:{label:'One Leg', per:'leg'}
};
const sideOf = (ex)=> ex && (ex.side==='arm'||ex.side==='leg') ? ex.side : '';
const sideLabel = (ex)=> sideOf(ex) ? SIDE_OPTIONS[sideOf(ex)].label : '';
const sideRepLabel = (ex)=> sideOf(ex) ? 'Reps / '+SIDE_OPTIONS[sideOf(ex)].per : 'Reps';
const sideFromName = (name)=>{
  if(/(?:single|one)[-\s]+arm/i.test(name||'')) return 'arm';
  if(/(?:single|one)[-\s]+leg/i.test(name||'')) return 'leg';
  return '';
};
function stripSidePrefix(name, eq){
  let base=String(name||'Exercise').trim().replace(/\s+/g,' ');
  const eqName=String(eq||'').trim();
  if(eqName && base.toLowerCase().startsWith(eqName.toLowerCase()+' ')) base=base.slice(eqName.length).trim();
  return base.replace(/^(?:single|one)[-\s]+(?:arm|leg)\s+/i,'').trim() || 'Exercise';
}
function formatExerciseName(name, eq, side){
  const cleanSide = side==='arm'||side==='leg' ? side : '';
  const raw = String(name||'Exercise').trim().replace(/\s+/g,' ');
  if(!cleanSide) return raw || 'Exercise';
  const base = stripSidePrefix(raw, eq);
  const prefix = String(eq||'Other').trim() || 'Other';
  return prefix+' '+SIDE_OPTIONS[cleanSide].label+' '+base;
}
function normalizeExerciseVariant(ex){
  const side = sideOf(ex) || sideFromName(ex&&ex.name);
  return side ? {...ex, side, name:formatExerciseName(ex.name, ex.eq, side)} : {...ex, side:''};
}
function baseExerciseName(ex){
  return sideOf(ex) ? (String(ex.eq||'Other').trim()||'Other')+' '+stripSidePrefix(ex.name, ex.eq) : (ex&&ex.name);
}
const ARM_SIDE_MUSCLES = new Set(['Chest','Back','Front Delts','Side Delts','Rear Delts','Biceps','Triceps','Forearms']);
const LEG_SIDE_MUSCLES = new Set(['Quads','Hamstrings','Glutes','Calves']);
function sideOptionsFor(ex){
  const name=String(ex&&ex.name||'').toLowerCase();
  const opts=[];
  if(ARM_SIDE_MUSCLES.has(ex&&ex.m) || /\b(press|row|curl|raise|fly|extension|pushdown|pulldown|shrug|snatch|swing|windmill|carry|get-up)\b/.test(name)) opts.push('arm');
  if(LEG_SIDE_MUSCLES.has(ex&&ex.m) || /\b(squat|lunge|step|leg|glute|calf|kickback|deadlift|thrust|march)\b/.test(name)) opts.push('leg');
  return [...new Set(opts)];
}
const trackOf = (ex)=> (ex && TRACK[ex.track]) ? ex.track : 'ws';
const distUnit = (unit)=> unit==='lb' ? 'mi' : 'km';
const fieldLabel = (f, unit, ex)=> f==='weight' ? ('Weight ('+unit+')') : f==='reps' ? sideRepLabel(ex) : f==='time' ? 'Time (min)' : ('Dist ('+distUnit(unit)+')');
const fieldMode = (f)=> f==='reps' ? 'numeric' : 'decimal';
const targetKey = (f)=> 'target'+f.charAt(0).toUpperCase()+f.slice(1);
function setHasData(track, s){
  const w=+s.weight>0, r=+s.reps>0, t=+s.time>0, d=+s.dist>0;
  switch(track){ case 'r':return r; case 't':return t; case 'd':return d; case 'dt':return d; case 'wt':return w&&t; default:return w&&r; }
}
function applyTargetDefaults(track,set){
  const fields=TRACK[track]?TRACK[track].fields:[];
  fields.forEach(f=>{
    const k=targetKey(f);
    if((set[f]===undefined || set[f]===null || set[f]==='') && set[k]!==undefined && set[k]!==null && set[k] !== '') set[f]=set[k];
  });
  return set;
}
function defaultSetFor(ex, planned=false){
  const set={weight:'', reps:'', time:'', dist:'', done:false};
  const tk=trackOf(ex);
  if(planned && TRACK[tk] && TRACK[tk].fields.includes('reps')) set.targetReps=8;
  return set;
}
function metricInfo(track, unit){
  const du=distUnit(unit);
  switch(track){
    case 'r':  return {label:'Max reps', suffix:'', volLabel:'total reps', volSuffix:''};
    case 't':  return {label:'Best time', suffix:' min', volLabel:'total', volSuffix:' min'};
    case 'd':  return {label:'Best distance', suffix:' '+du, volLabel:'total', volSuffix:' '+du};
    case 'dt': return {label:'Best distance', suffix:' '+du, volLabel:'total', volSuffix:' '+du};
    case 'wt': return {label:'Top weight', suffix:' '+unit, volLabel:'volume', volSuffix:' '+unit};
    default:   return {label:'Est. 1RM', suffix:' '+unit, volLabel:'volume', volSuffix:' '+unit};
  }
}

  {k:'thighL',label:'Left thigh',u:'c'},{k:'thighR',label:'Right thigh',u:'c'},
  {k:'calfL',label:'Left calf',u:'c'},{k:'calfR',label:'Right calf',u:'c'},

const uid = () => Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString().slice(0,10);

function asArray(value){ return Array.isArray(value) ? value : []; }
function safeNumber(value, fallback=0){
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}
function cleanSet(set){
  const s = (set && typeof set === 'object') ? set : {};
  const cleaned = {
    done: !!s.done,
    weight: s.weight == null || s.weight === '' ? '' : safeNumber(s.weight),
    reps: s.reps == null || s.reps === '' ? '' : safeNumber(s.reps),
    time: s.time == null || s.time === '' ? '' : safeNumber(s.time),
    dist: s.dist == null || s.dist === '' ? '' : safeNumber(s.dist)
  };
  ['weight','reps','time','dist'].forEach(f=>{
    const k=targetKey(f);
    cleaned[k] = s[k] == null || s[k] === '' ? '' : safeNumber(s[k]);
  });
  return cleaned;
}
function cleanEntries(entries){
  return asArray(entries).map(en=>({
    exerciseId: String(en && en.exerciseId || ''),
    note: String(en && en.note || ''),
    sets: asArray(en && en.sets).map(cleanSet).filter(s=>
      s.weight!=='' || s.reps!=='' || s.time!=='' || s.dist!=='' || s.done ||
      s.targetWeight!=='' || s.targetReps!=='' || s.targetTime!=='' || s.targetDist!=='')
  })).filter(en=>en.exerciseId);
}
function cleanWorkout(item){
  if(!item || typeof item !== 'object') return null;
  return {
    id: String(item.id || uid()),
    date: String(item.date || todayISO()).slice(0,10),
    startedAt: item.startedAt == null ? null : safeNumber(item.startedAt, Date.now()),
    endedAt: item.endedAt ? safeNumber(item.endedAt, Date.now()) : undefined,
    routineId: item.routineId || null,
    dayId: item.dayId || null,
    mode: item.mode === 'guided' ? 'guided' : 'open',
    currentEntryIndex: Math.max(0, Math.floor(safeNumber(item.currentEntryIndex, 0))),
    name: String(item.name || 'Workout'),
    note: String(item.note || ''),
    entries: cleanEntries(item.entries)
  };
}
function cleanLogs(logs){
  return asArray(logs).map(cleanWorkout).filter(w=>w && (w.entries.length || w.note));
}
function cleanMeasurements(measurements){
  return asArray(measurements).map(m=>({
    ...(m && typeof m === 'object' ? m : {}),
    id: String(m && m.id || uid()),
    date: String(m && m.date || todayISO()).slice(0,10)
  })).filter(m=>m.date);
}
function cleanActive(active){
  const workout = cleanWorkout(active);
  return workout && workout.entries ? workout : null;
}

// resolve a demo for any exercise: custom media wins, else CC0 frames, else none
function demoFor(ex){
  if(!ex) return null;
  if(ex.media){
    if(/\.(mp4|webm)$/i.test(ex.media)) return {type:'video', src:ex.media};
    return {type:'frames', frames:[ex.media]};
  }
  const f = GIFS[ex.name] || GIFS[baseExerciseName(ex)];
  if(f && f.length) return {type:'frames', frames:f.map(p=>GIF_BASE+p)};
  return null;
}

/* Merge library updates (new exercises, re-tagged muscles) into a user's saved data.
   Preserves existing ids (so routines/logs still resolve) and keeps custom exercises. */
function migrateExercises(saved){
  if(!Array.isArray(saved) || saved.length===0) return SEED;
  const normalizedSaved = saved.map(e=>normalizeExerciseVariant({id:(e&&e.id)||uid(), media:'', ...e})).filter(e=>e&&e.name);
  const savedByName = new Map(normalizedSaved.map(e=>[e.name, e]));
  // current SEED, reusing the prior id when this exercise already existed
  const merged = SEED.map(s=>{
    const prev = savedByName.get(s.name);
    if(prev && prev.edited) return normalizeExerciseVariant(prev); // keep the user's edited version, but normalize unilateral naming
    return prev ? { ...s, id: prev.id, media: prev.media || s.media || '' } : s;
  });
  // keep any user-created customs (saved names that aren't part of SEED)
  const seedNames = new Set(SEED.map(s=>s.name));
  normalizedSaved.forEach(e=>{ if(!seedNames.has(e.name)) merged.push(e); });
  return merged;
}

/* Routines are now PROGRAMS that contain days. Wrap any old flat routine (exerciseIds) into one day. */
function migrateRoutines(saved){
  if(!Array.isArray(saved)) return [];
  const fixDay=(d)=>({ id:d.id||uid(), name: isAutoName(d.name)?'':(d.name||''), exerciseIds:Array.isArray(d.exerciseIds)?d.exerciseIds:[] });
  return saved.map(r=>{
    if(Array.isArray(r.days)) return { labelMode:'num', ...r, days:r.days.map(fixDay) };
    return { id:r.id||uid(), name:r.name||'Routine', note:r.note||'', labelMode:'num',
      days:[{id:uid(), name:'', exerciseIds:Array.isArray(r.exerciseIds)?r.exerciseIds:[]}] };
  });
}

/* ---- animated demo (crossfade two frames) ---- */
function AnimatedDemo({demo}){
  if(!demo) return null;
  const isVideo=demo.type==='video';
  const frames=Array.isArray(demo.frames) ? demo.frames.filter(Boolean) : [];
  const [i,setI]=useState(0);
  const [bad,setBad]=useState(false);
  useEffect(()=>{
    if(isVideo || frames.length<2) return;
    const t=setInterval(()=>setI(p=>(p+1)%frames.length), 950);
    return ()=>clearInterval(t);
  },[isVideo,frames]);
  if(isVideo) return (
    <video src={demo.src} autoPlay loop muted playsInline
      style={{width:'100%',borderRadius:'var(--radius)',marginBottom:14,background:'#0f0a18'}} />
  );
  if(bad || !frames.length) return null;
  return (
    <div className="demo-hero">
      {frames.map((src,idx)=>
        <img key={idx} src={src} alt="" onError={()=>setBad(true)}
          style={{opacity: idx===i?1:0}} />)}
      <span className="demo-cap">{I.timer}{frames.length>1?'Animated demo':'Demo'}</span>
    </div>
  );
}

  if(!ex) return null;

  if(!tiers){ tiers=[]; if(ex.m) tiers.push([ex.m,ex.m]); if(ex.sec) tiers.push([ex.sec,ex.sec]); }
  if(!tiers.length) return null;
  const labels=['Primary','Secondary','Tertiary'];
  return (
    <div className="mtiers">
      {tiers.slice(0,3).map((t,i)=>(
        <div key={i} className="mtier">
          <span className="mt-dot" style={{background:MUSCLE[t[1]]||'#888'}}></span>
          <span className="mt-label">{labels[i]}</span>
          <span className="mt-mus">{t[0]}</span>
        </div>
      ))}
    </div>
  );
}

/* ---- shade a muscle region by how hard it's worked (0..1) ---- */
function shade(t){
  if(!t || t<=0) return '#262a3d';
  const a = (0.30 + 0.70*Math.min(1,t));
  return 'rgba(168,85,247,'+a.toFixed(3)+')';
}

/* ---- routine muscle breakdown: aggregate MUS across exercises -> heatmap + % ---- */
function MuscleBreakdown({exerciseIds, exById}){
  const sums={};
  (exerciseIds||[]).forEach(id=>{
    const ex=exById[id]; if(!ex) return;
    let tiers = MUS[ex.name] || MUS[baseExerciseName(ex)];
    if(!tiers){ tiers=[]; if(ex.m) tiers.push([ex.m,ex.m]); if(ex.sec) tiers.push([ex.sec,ex.sec]); }
    tiers.slice(0,3).forEach((t,idx)=>{ const region=t[1]; const w=[3,2,1][idx]||1; sums[region]=(sums[region]||0)+w; });
  });
  const entries=Object.entries(sums);
  const total=entries.reduce((a,b)=>a+b[1],0);
  if(!total) return <div style={{color:'var(--muted)',fontSize:13,padding:'4px 2px'}}>Add exercises to see the muscle breakdown.</div>;
  const max=Math.max.apply(null, entries.map(e=>e[1]));
  const intensity={}; entries.forEach(e=>{ intensity[e[0]]=e[1]/max; });
  const list=entries.map(e=>({m:e[0], pct:Math.round(e[1]/total*100)})).sort((a,b)=>b.pct-a.pct);
  return (
    <div>
      <BodyHeatmap intensity={intensity} />
      <div className="mb-list">
        {list.map(r=>(
          <div key={r.m} className="mb-row">
            <span className="mb-name" style={{color:MUSCLE[r.m]||'#fff'}}>{r.m}</span>
            <div className="mb-bar"><div style={{width:r.pct+'%', background:MUSCLE[r.m]||'var(--accent)'}}></div></div>
            <span className="mb-pct">{r.pct}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Spark({data, color}){
  if(data.length < 2) return null;
  const w=300, h=54, pad=4;
  const max=Math.max(...data), min=Math.min(...data); const rng=(max-min)||1;
  const pts=data.map((v,i)=>{ const x=pad+(i/(data.length-1))*(w-pad*2); const y=h-pad-((v-min)/rng)*(h-pad*2); return [x,y]; });
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${pts[pts.length-1][0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z`;
  return (
    <svg className="spark" width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <path d={area} fill={tint(color,.14)}/>
      <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>)}
    </svg>
  );
}

/* ---- beep + vibrate when rest ends ---- */
let _actx;
function beep(){
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended') _actx.resume();
    [0,0.26,0.52].forEach((t,i)=>{
      const o=_actx.createOscillator(), g=_actx.createGain();
      o.type='sine'; o.frequency.value = i<2?880:1320;
      o.connect(g); g.connect(_actx.destination);
      const s=_actx.currentTime+t;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.35,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+0.2);
      o.start(s); o.stop(s+0.22);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([220,90,220]); }catch(e){}
}
function primeAudio(){ try{ _actx = _actx || new (window.AudioContext||window.webkitAudioContext)(); if(_actx.state==='suspended') _actx.resume(); }catch(e){} }

/* ============================================================
   REST TIMER bar
   ============================================================ */
function RestBar({rest, onAdjust, onSkip, onDone}){
  const [now,setNow]=useState(Date.now());
  const firedRef=useRef(false);
  useEffect(()=>{ firedRef.current=false; },[rest.endsAt, rest.startedAt]);
  useEffect(()=>{
    const t=setInterval(()=>setNow(Date.now()),250);
    return ()=>clearInterval(t);
  },[]);
  const remainMs=Math.max(0, rest.endsAt-now);
  const remain=Math.ceil(remainMs/1000);
  useEffect(()=>{
    if(remainMs<=0 && !firedRef.current){ firedRef.current=true; beep(); setTimeout(onDone, 900); }
  });
  const mm=Math.floor(remain/60), ss=remain%60;
  const pct=Math.max(0, Math.min(100, (remainMs/(rest.total*1000))*100));
  const done = remainMs<=0;
  return (
    <div className="rest-bar" style={done?{background:'var(--good)'}:{}}>
      <div className="rest-prog" style={{width:pct+'%'}}></div>
      <div className="rest-count">{done?'Go!':`${mm}:${String(ss).padStart(2,'0')}`}</div>
      <div className="rest-mid">
        <div className="rest-lbl">{done?'Rest complete':'Rest'}</div>
        <div className="rest-ex">{rest.label}</div>
      </div>
      {!done &&
        <div className="rest-btns">
          <button onClick={()=>onAdjust(-15)}>-15</button>
          <button onClick={()=>onAdjust(15)}>+15</button>
          <button className="rest-skip" onClick={onSkip}>Skip</button>
        </div>}
      {done && <div className="rest-btns"><button className="rest-skip" onClick={onSkip}>Done</button></div>}
    </div>
  );
}

function App(){

  const [measurements, setMeasurements] = useState(()=>cleanMeasurements(store.get('measurements', [])));
  const [active, setActive] = useState(()=>cleanActive(store.get('active', null)));
  const [rest, setRest] = useState(null); // {endsAt,total,label,startedAt}
  const [toast, setToast] = useState(null);

  // modals
  const [detailEx, setDetailEx] = useState(null);
  const [newExOpen, setNewExOpen] = useState(false);
  const [editEx, setEditEx] = useState(null);
  const [measSheet, setMeasSheet] = useState(null);
  const [editRoutine, setEditRoutine] = useState(undefined);
  const [previewDay, setPreviewDay] = useState(null);
  const [pickerFor, setPickerFor] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);

  // sync
  const [sbUrl, setSbUrl] = useState(()=>store.get('sb_url', SUPABASE_URL||''));
  const [sbKey, setSbKey] = useState(()=>store.get('sb_key', SUPABASE_ANON_KEY||''));
  const [session, setSession] = useState(null);
  const [syncStatus, setSyncStatus] = useState('');
  const [lastSync, setLastSync] = useState(null);
  const clientRef = useRef(null);
  const applyingRemote = useRef(false);
  const loadedRef = useRef(false);

  useEffect(()=>store.set('unit',unit),[unit]);
  useEffect(()=>store.set('restDefault',restDefault),[restDefault]);
  useEffect(()=>store.set('exercises',exercises),[exercises]);
  useEffect(()=>store.set('routines',routines),[routines]);
  useEffect(()=>store.set('logs',logs),[logs]);
  useEffect(()=>store.set('measurements',measurements),[measurements]);
  useEffect(()=>store.set('active',active),[active]);

  const exById = useMemo(()=>Object.fromEntries(exercises.map(e=>[e.id,e])),[exercises]);
  const flash = (msg)=>{ setToast(msg); setTimeout(()=>setToast(null), 1900); };

  /* ----- Supabase client lifecycle ----- */
  useEffect(()=>{
    if(sbUrl && sbKey && typeof supabase!=='undefined' && supabase.createClient){
      try{
        const c = supabase.createClient(sbUrl, sbKey);
        clientRef.current = c;
        c.auth.getSession().then(({data})=>setSession(data.session||null));
        const { data:sub } = c.auth.onAuthStateChange((_e,s)=>setSession(s));
        return ()=>{ try{ sub.subscription.unsubscribe(); }catch(e){} };
      }catch(e){ setSyncStatus('Could not connect — check the URL & key.'); }
    } else {
      clientRef.current = null;
    }
  },[sbUrl,sbKey]);

  const payload = ()=>({v:2, exercises, routines, logs, measurements, unit, restDefault});

  const doPull = async ()=>{
    const c=clientRef.current; if(!c) return null;
    const { data:{ user } } = await c.auth.getUser(); if(!user) return null;
    const { data, error } = await c.from('ironlog_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
    if(error) throw error; return data;
  };
  const doPush = async ()=>{
    const c=clientRef.current; if(!c) return;
    const { data:{ user } } = await c.auth.getUser(); if(!user) return;
    const { error } = await c.from('ironlog_data').upsert({ user_id:user.id, data:payload(), updated_at:new Date().toISOString() });
    if(error) throw error;
    setLastSync(Date.now());
  };

  // on login -> pull (or seed cloud)
  useEffect(()=>{
    if(session && clientRef.current && !loadedRef.current){
      loadedRef.current=true;
      (async()=>{
        try{
          setSyncStatus('Syncing…');
          const row = await doPull();
          if(row && row.data && (row.data.logs||row.data.routines)){
            applyingRemote.current=true;
            setExercises(migrateExercises(row.data.exercises));
            setRoutines(migrateRoutines(row.data.routines||[]));
            setLogs(cleanLogs(row.data.logs||[]));
            setMeasurements(cleanMeasurements(row.data.measurements||[]));
            if(Object.prototype.hasOwnProperty.call(row.data,'active')) setActive(cleanActive(row.data.active));
            if(row.data.unit) setUnit(row.data.unit);
            if(row.data.restDefault) setRestDefault(row.data.restDefault);
            setTimeout(()=>{ applyingRemote.current=false; },150);
            setLastSync(Date.now());
            setSyncStatus(''); flash('Synced from cloud ☁');
          } else {
            await doPush();
            setSyncStatus(''); flash('Cloud backup created ☁');
          }
        }catch(e){ setSyncStatus('Sync error: '+(e.message||e)); }
      })();
    }
    if(!session) loadedRef.current=false;
  },[session]);

  // debounced auto-push on data changes while logged in
  useEffect(()=>{
    if(!session || !clientRef.current || applyingRemote.current) return;
    const t=setTimeout(()=>{ doPush().catch(e=>setSyncStatus('Sync error: '+(e.message||e))); }, 1600);
    return ()=>clearTimeout(t);
  },[exercises, routines, logs, measurements, unit, restDefault, session]);

  /* ----- rest timer controls ----- */
  const startRest = (label)=>{
    primeAudio();
    setRest({ endsAt: Date.now()+restDefault*1000, total: restDefault, label: label||'Rest', startedAt: Date.now() });
  };
  const adjustRest = (sec)=> setRest(r=> r ? {...r, endsAt: Math.max(Date.now(), r.endsAt+sec*1000), total: Math.max(5, r.total+sec)} : r);

  /* ----- workout ----- */
  // pull the most recent logged sets / note for an exercise (newest log first)
  const lastSetsFor = (exId)=>{
    for(const s of asArray(logs)){ const en=asArray(s&&s.entries).find(e=>e.exerciseId===exId); if(en&&asArray(en.sets).length) return asArray(en.sets).map(st=>{
      const next={weight:'', reps:'', time:'', dist:'', done:false};
      ['weight','reps','time','dist'].forEach(f=>{ if(st[f]!==undefined && st[f]!==null && st[f] !== '') next[targetKey(f)] = st[f]; });
      return next;
    }); }
    return null;
  };
  const lastNoteFor = (exId)=>{
    for(const s of logs){ const en=s.entries.find(e=>e.exerciseId===exId); if(en&&en.note) return en.note; }
    return '';
  };
  const blankSet = (ex, planned=false)=>{
    return defaultSetFor(ex, planned);
  };
  const blankSets = (count, ex, planned=false)=> Array.from({length:count}, ()=>blankSet(ex, planned));
  const newEntry = (id, planned=false)=>{
    const ex=exById[id];
    return { exerciseId:id, sets: lastSetsFor(id) || blankSets(planned?3:1, ex, planned), note: lastNoteFor(id) };
  };
  // For a LIVE workout: prefill each set's target into the actual editable field,
  // so the number (last weight, 8 reps, etc.) is sitting in the box ready to tweak.
  const liveEntry = (id, planned=false)=>{
    const en=newEntry(id, planned);
    const tk=trackOf(exById[id]);
    en.sets=asArray(en.sets).map(s=>applyTargetDefaults(tk, {...s}));
    return en;
  };
  const startDay = (day, program, label, focusIndex=0)=>{
    const dayIds=asArray(day&&day.exerciseIds).filter(id=>exById[id]);
    const entries=dayIds.map(id=>liveEntry(id, !!day));
    const currentEntryIndex=Math.max(0, Math.min(entries.length-1, Math.floor(+focusIndex||0)));
    setActive({ id:uid(), date:todayISO(), startedAt:null, note:'',
      routineId: program?program.id:null, dayId: day?day.id:null,
      mode: day ? 'guided' : 'open', currentEntryIndex,
      name: day ? (label || day.name || 'Workout') : 'Quick Workout',
      entries });
    setTab('train');
  };
  const openDayPreview = (day, program, label)=>{
    const dayIds=asArray(day&&day.exerciseIds);
    if(!day || !dayIds.length) return;
    setPreviewDay({day, program, label, entries:dayIds.map(id=>newEntry(id, true))});
  };
  const reorderPreviewDay = (nextIds)=>{
    const p=previewDay;
    if(!p || !p.day || !p.program) return;
    const ids=asArray(nextIds);
    const updateDays=days=>asArray(days).map(d=>d&&d.id===p.day.id?{...d, exerciseIds:ids}:d);
    setRoutines(curr=>asArray(curr).map(r=>r&&r.id===p.program.id?{...r, days:updateDays(r.days)}:r));
    setPreviewDay(curr=>{
      if(!curr || !curr.day || curr.day.id!==p.day.id) return curr;
      return {
        ...curr,
        day:{...curr.day, exerciseIds:ids},
        program:curr.program?{...curr.program, days:updateDays(curr.program.days)}:curr.program,
        entries:ids.map(id=>newEntry(id, true))
      };
    });
  };
  const finishWorkout = ()=>{
    // with pre-filled presets, the checkmark means "I actually did this set".
    // If any set is checked, save only checked sets; otherwise fall back to whatever was typed.
    const anyDone = active.entries.some(en=>en.sets.some(s=>s.done));
    const c = {...active, startedAt: active.startedAt || Date.now(), endedAt: Date.now(), entries: active.entries.map(en=>{
      const tk = trackOf(exById[en.exerciseId]);
      const keep = anyDone ? (s=>s.done && setHasData(tk,s)) : (s=>setHasData(tk,s));
      return {...en, sets: en.sets.filter(keep)};
    }).filter(en=>en.sets.length>0)};
    if(c.entries.length){ setLogs([c, ...logs]); flash('Workout saved 🔥'); }
    else flash('Nothing logged — discarded');
    // If this workout came from a routine day, write any exercise-order/swap
    // changes back to that day so Plan stays in sync.
    if(active.routineId && active.dayId){
      const liveIds=asArray(active.entries).map(en=>en.exerciseId).filter(Boolean);
      if(liveIds.length){
        setRoutines(curr=>asArray(curr).map(r=>{
          if(!r || r.id!==active.routineId) return r;
          return {...r, days:asArray(r.days).map(d=>{
            if(!d || d.id!==active.dayId) return d;
            return {...d, exerciseIds:liveIds};
          })};
        }));
      }
    }
    setActive(null); setRest(null); setTab('records');
  };
  const discardWorkout = ()=>{ setActive(null); setRest(null); setTab('today'); };

  const saveRoutine = (r)=>{
    if(routines.find(x=>x.id===r.id)) setRoutines(routines.map(x=>x.id===r.id?r:x));

  const deleteExercise = (id)=>{ setExercises(exercises.filter(e=>e.id!==id)); setRoutines(routines.map(r=>({...r, days:(r.days||[]).map(d=>({...d, exerciseIds:d.exerciseIds.filter(x=>x!==id)}))}))); setDetailEx(null); flash('Exercise deleted'); };

  const records = useMemo(()=>{
    const r = {};

      session.entries.forEach(en=>{
        const tk = trackOf(exById[en.exerciseId]);
        const valid = en.sets.filter(s=>setHasData(tk,s)); if(!valid.length) return;
        if(!r[en.exerciseId]) r[en.exerciseId]={track:tk,best:0,maxW:0,bestVol:0,sessions:[],count:0};
        const rec=r[en.exerciseId]; rec.track=tk;
        let val=0,vol=0,top='',tw=0,tr=0,mw=0;
        if(tk==='ws'||tk==='wt'){
          valid.forEach(s=>{ const w=+s.weight, sec= tk==='ws'?+s.reps:+s.time; const e= tk==='ws'?epley(w,sec):w;
            if(e>val){val=e; top= tk==='ws'?`${w}×${sec}`:`${w}×${sec}min`; tw=w; tr=sec;} if(w>mw)mw=w; vol+= tk==='ws'? w*sec : w; });
        } else if(tk==='r'){
          valid.forEach(s=>{ const rr=+s.reps; if(rr>val){val=rr;top=`${rr} reps`;tr=rr;} vol+=rr; });
        } else if(tk==='t'){
          valid.forEach(s=>{ const t=+s.time; if(t>val){val=t;top=`${t} min`;} vol+=t; });
        } else {
          valid.forEach(s=>{ const d=+s.dist; if(d>val){val=d; top= tk==='dt'?`${d} · ${+s.time||0}m`:`${d}`;} vol+=d; });
        }
        rec.best=Math.max(rec.best,val); rec.maxW=Math.max(rec.maxW,mw); rec.bestVol=Math.max(rec.bestVol,vol); rec.count++;
        rec.sessions.push({date:session.date, top, val, vol, topW:tw, topR:tr, note:en.note||'', snote:session.note||'',
          sets:valid.map(s=>({w:+s.weight||0,r:+s.reps||0,t:+s.time||0,d:+s.dist||0}))});

/* ============================================================
   ROUTINES
   ============================================================ */
/* estimate how long a routine takes: per exercise = sets*(work + rest) + setup */
function lastSetCount(logs, exId){
  for(const s of (logs||[])){ const en=s.entries.find(e=>e.exerciseId===exId); if(en&&en.sets&&en.sets.length) return en.sets.length; }
  return null;
}
function estimateMinutes(ids, logs, restDefault){
  if(!ids||!ids.length) return 0;
  let sec=0;
  ids.forEach(id=>{ const sets=lastSetCount(logs,id)||3; sec += sets*(45 + (restDefault||90)) + 60; });
  return Math.max(5, Math.round(sec/60/5)*5);
}

function latestLog(logs){
  return (logs||[]).slice().sort((a,b)=>{
    const at=(b.startedAt||0)-(a.startedAt||0);
    return at || String(b.date||'').localeCompare(String(a.date||''));
  })[0] || null;
}
function weekWorkouts(logs){
  const weekAgo=new Date(Date.now()-6*864e5).toISOString().slice(0,10);
  return (logs||[]).filter(l=>l.date>=weekAgo).length;
}
function trainingStreak(logs){
  const dates=new Set((logs||[]).map(l=>l.date).filter(Boolean));
  let d=new Date();
  if(!dates.has(todayISO())) d.setDate(d.getDate()-1);
  let count=0;
  for(let i=0;i<90;i++){
    const key=d.toISOString().slice(0,10);
    if(!dates.has(key)) break;
    count++;
    d.setDate(d.getDate()-1);
  }
  return count;
}
function targetSummary(entry, ex, unit){
  const sets=(entry&&entry.sets)||[];
  if(!ex) return sets.length+' set'+(sets.length!==1?'s':'');
  const fields=TRACK[trackOf(ex)].fields;
  const parts=fields.map(f=>{
    const vals=[...new Set(sets.map(s=>s[targetKey(f)]).filter(v=>v!==''&&v!==undefined&&v!==null))];
    if(!vals.length) return null;
    const label=f==='weight'?unit:f==='reps'?'reps':f==='time'?'min':distUnit(unit);
    return vals.length===1 ? vals[0]+' '+label : vals.join('/')+' '+label;
  }).filter(Boolean);
  return sets.length+' planned set'+(sets.length!==1?'s':'')+(parts.length?' \u00b7 '+parts.join(' \u00b7 '):'');
}

function nextTrainingTarget(routines, logs){
  const plans=(routines||[]).filter(r=>(r.days||[]).some(d=>d.exerciseIds&&d.exerciseIds.length));
  if(!plans.length) return null;
  const recent=latestLog(logs);
  if(recent && recent.routineId && recent.dayId){
    const routine=plans.find(r=>r.id===recent.routineId);
    if(routine){
      const days=routine.days||[];
      const idx=days.findIndex(d=>d.id===recent.dayId);
      for(let step=1;step<=days.length;step++){
        const day=days[(idx+step+days.length)%days.length];
        if(day && day.exerciseIds && day.exerciseIds.length) return {routine,day,label:dayLabel(day,(idx+step+days.length)%days.length,routine.labelMode||'num')};
      }
    }
  }
  const routine=plans[0];
  const idx=(routine.days||[]).findIndex(d=>d.exerciseIds&&d.exerciseIds.length);
  const day=routine.days[idx];
  return {routine,day,label:dayLabel(day,idx,routine.labelMode||'num')};
}

/* ============================================================
   DRAG TO REORDER (shared)
   Grab the grip to drag instantly, or press-and-hold anywhere on
   the row (~0.3s) to lift it, then slide up/down. Rows swap live
   as the finger crosses their midpoints. Works with touch + mouse.
   ============================================================ */
function useDragReorder({ids, onMove, onDrop, holdMs=300}){
  const [dragId,setDragId]=useState(null);
  const dragRef=useRef(null);          // {id, pointerId, lastY}
  const rowEls=useRef({});             // id -> element
  const holdTimer=useRef(null);
  const holdStart=useRef(null);        // {x,y,id,pointerId}
  const scrollRaf=useRef(null);
  const suppressClick=useRef(false);
  const idsRef=useRef(ids); idsRef.current=ids;
  const cbRef=useRef({onMove,onDrop}); cbRef.current={onMove,onDrop};

  const clearHold=()=>{ if(holdTimer.current){clearTimeout(holdTimer.current); holdTimer.current=null;} holdStart.current=null; };

  const begin=(id, clientY, pointerId)=>{
    if(dragRef.current) return;
    dragRef.current={id, pointerId, lastY:clientY};
    setDragId(id);
    suppressClick.current=true;
    if(typeof navigator!=='undefined' && navigator.vibrate){ try{navigator.vibrate(12);}catch(_){} }
  };

  const maybeSwap=(clientY)=>{
    const d=dragRef.current; if(!d) return;
    const list=idsRef.current; const i=list.indexOf(d.id); if(i<0) return;
    if(i>0){ const el=rowEls.current[list[i-1]];
      if(el){ const r=el.getBoundingClientRect(); if(clientY < r.top + r.height/2){ cbRef.current.onMove(i,i-1); return; } } }
    if(i<list.length-1){ const el=rowEls.current[list[i+1]];
      if(el){ const r=el.getBoundingClientRect(); if(clientY > r.top + r.height/2){ cbRef.current.onMove(i,i+1); } } }
  };

  // window listeners + scroll lock + edge auto-scroll, active only while dragging
  useEffect(()=>{
    if(!dragId) return;
    const move=(e)=>{ const d=dragRef.current; if(!d) return; d.lastY=e.clientY; maybeSwap(e.clientY); };
    const end=()=>{ endDrag(); };
    const blockScroll=(e)=>{ if(dragRef.current) e.preventDefault(); };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',end);
    window.addEventListener('pointercancel',end);
    window.addEventListener('touchmove',blockScroll,{passive:false});
    // edge auto-scroll: keep swapping while the finger parks near the top/bottom
    const tick=()=>{
      const d=dragRef.current; if(!d) return;
      const el=rowEls.current[d.id];
      const sc=el && (el.closest('.sheet-body')||el.closest('.scroll'));
      if(sc){ const r=sc.getBoundingClientRect();
        if(d.lastY < r.top+60) sc.scrollTop-=9;
        else if(d.lastY > r.bottom-60) sc.scrollTop+=9;
        maybeSwap(d.lastY); }
      scrollRaf.current=requestAnimationFrame(tick);
    };
    scrollRaf.current=requestAnimationFrame(tick);
    return ()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',end);
      window.removeEventListener('pointercancel',end);
      window.removeEventListener('touchmove',blockScroll);
      if(scrollRaf.current) cancelAnimationFrame(scrollRaf.current);
    };
  },[dragId]);

  const endDrag=()=>{
    if(!dragRef.current) return;
    dragRef.current=null;
    setDragId(null);
    if(scrollRaf.current){ cancelAnimationFrame(scrollRaf.current); scrollRaf.current=null; }
    if(cbRef.current.onDrop) cbRef.current.onDrop(idsRef.current);
    setTimeout(()=>{ suppressClick.current=false; },350);
  };

  /* grip handle: drag starts the moment you touch it */
  const handleProps=(id)=>({
    onPointerDown:(e)=>{ if(e.pointerType==='mouse' && e.button!==0) return;
      e.stopPropagation(); clearHold(); begin(id, e.clientY, e.pointerId); }
  });

  /* row body: press-and-hold to lift, small movement cancels into a normal scroll/tap */
  const rowProps=(id)=>({
    ref:(el)=>{ if(el) rowEls.current[id]=el; else delete rowEls.current[id]; },
    onPointerDown:(e)=>{ if(e.pointerType==='mouse' && e.button!==0) return;
      if(dragRef.current) return;
      holdStart.current={x:e.clientX, y:e.clientY, id, pointerId:e.pointerId};
      if(holdTimer.current) clearTimeout(holdTimer.current);
      holdTimer.current=setTimeout(()=>{ holdTimer.current=null; const h=holdStart.current; holdStart.current=null; if(h) begin(h.id, h.y, h.pointerId); }, holdMs);
    },
    onPointerMove:(e)=>{ const h=holdStart.current; if(h && (Math.abs(e.clientX-h.x)>10 || Math.abs(e.clientY-h.y)>10)) clearHold(); },
    onPointerUp:clearHold,
    onPointerCancel:clearHold,
    onClickCapture:(e)=>{ if(suppressClick.current){ e.preventDefault(); e.stopPropagation(); suppressClick.current=false; } }
  });

  return {dragId, handleProps, rowProps};
}
const reorderMove=(setIds)=>(from,to)=>setIds(a=>{ const b=[...a]; const [x]=b.splice(from,1); b.splice(to,0,x); return b; });

function DayPreviewSheet({preview, exById, unit, logs, restDefault, onClose, onStart, onReorder}){
  const day=preview.day||{};
  const entries=asArray(preview.entries);
  const label=preview.label || day.name || 'Routine day';
  const dayIds=asArray(day.exerciseIds);
  const [ids,setIds]=useState(()=>dayIds);
  const [selectedId,setSelectedId]=useState(null);
  useEffect(()=>{ setIds(dayIds); setSelectedId(null); },[day.id, dayIds.join('|')]);
  const entryById=useMemo(()=>{
    const map={};
    dayIds.forEach((id,i)=>{ map[id]=entries[i]; });
    return map;
  },[dayIds.join('|'), entries]);
  const {dragId, handleProps, rowProps}=useDragReorder({
    ids, onMove:reorderMove(setIds),
    onDrop:(next)=>{ if(onReorder) onReorder(next); }
  });
  const selectPreviewExercise=(id)=>{
    if(dragId) return;
    setSelectedId(curr=>curr===id?null:id);
  };
  const availableCount=ids.filter(id=>exById[id]).length;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'90vh'}}>
        <div className="sheet-grip"></div>
        <div className="sheet-head"><h2>Plan Day</h2><button className="x-btn" onClick={onClose}>{I.x}</button></div>
        <div className="sheet-body">
          <div className="plan-day-head">
            <div className="guided-meta">{preview.program?preview.program.name:'Routine'}</div>
            <div className="plan-day-title">{label}</div>
            <div className="plan-day-meta">{availableCount} exercise{availableCount!==1?'s':''} · ~{estimateMinutes(ids, logs, restDefault)} min</div>
          </div>
          {ids.map((id,i)=>{
            const ex=exById[id];
            if(!ex) return (
              <div key={id} className="ex-row reorder-row" style={{opacity:.78,marginBottom:8}} {...rowProps(id)}>
                <div className="reorder-handle" aria-hidden="true" {...handleProps(id)}>{I.grip}</div>
                <div className="ex-info">
                  <div className="ex-name">Missing exercise</div>
                  <div className="ex-sub">This saved slot points to an exercise that no longer exists. Edit the day to replace it.</div>
                </div>
              </div>
            );
            const entry=entryById[id]||{sets:[]};
            const dragging=dragId===id;
            const selected=selectedId===id;
            const demo=selected?demoFor(ex):null;
            const startIndex=ids.slice(0,i).filter(x=>exById[x]).length;
            return (
              <div key={id}>
              <div className={'ex-row tap reorder-row'+(dragging?' dragging':'')+(selected?' selected':'')}
                onClick={()=>selectPreviewExercise(id)} {...rowProps(id)}>
                <div className="reorder-handle" title="Drag to reorder" aria-hidden="true" {...handleProps(id)}>{I.grip}</div>
                <Thumb ex={ex} />
                <div className="ex-info">
                  <div className="ex-name">{ex.name}</div>
                  <div className="ex-sub"><span style={{color:EQUIP[ex.eq]?EQUIP[ex.eq].c:'#888'}}>{ex.eq}</span>·<span style={{color:MUSCLE[ex.m]||'#888'}}>{ex.m}</span>{sideOf(ex)&&<span style={{color:'var(--accent)'}}>· {sideLabel(ex)}</span>}</div>
                  <div className="target-line"><b>{i+1}</b> · {targetSummary(entry, ex, unit)}</div>
                </div>
                <span className="chevron">{selected?I.down:I.chevron}</span>
              </div>
              {selected &&
                <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:12,margin:'-4px 0 10px 40px'}}>
                  {demo ? <div className="workout-demo" style={{margin:'0 0 10px'}}><AnimatedDemo demo={demo} /></div> :
                    <div className="target-line" style={{marginBottom:8}}>No demo image saved for this exercise yet.</div>}
                  <div className="target-line" style={{marginBottom:10}}>Planned: {targetSummary(entry, ex, unit)}</div>
                  <button className="btn btn-ghost btn-sm" onClick={e=>{e.stopPropagation();onStart(startIndex);}}>Start from this exercise</button>
                </div>}
              </div>
            );
          })}
          <button className="btn btn-accent" disabled={!availableCount} style={{marginTop:10,opacity:availableCount?1:.45}} onClick={()=>onStart(0)}>{I.flame}Start workout</button>
        </div>
      </div>
    </div>
  );
}

      <div className="section-h"><span>Next Session</span></div>
      <div className="focus-panel">
        <div className="focus-row">

          <div className="focus-main">
            <div className="focus-kicker">{active?'In progress':target?'Queued':'Open slot'}</div>
            <div className="focus-title">{active?active.name:(target?target.label:'Quick Workout')}</div>
            <div className="focus-meta">{active?`${active.entries.length} lift${active.entries.length!==1?'s':''}`:(target?`${target.routine.name} · ${target.day.exerciseIds.length} ex · ~${estimateMinutes(target.day.exerciseIds, logs, restDefault)} min`:'No plan selected')}</div>
          </div>
          <button className="day-start" onClick={active?onResume:(target?()=>onStartDay(target.day,target.routine,target.label):()=>onStartDay(null,null))}>{active?'Resume':'Start'}</button>
        </div>
        <div className="focus-row">
          <div className="focus-icon">{I.trophy}</div>
          <div className="focus-main">
            <div className="focus-kicker">Last session</div>
            <div className="focus-title">{lastName}</div>
            <div className="focus-meta">{lastMeta}{last&&last.date?` · ${new Date(last.date+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}`:''}</div>
          </div>
          <button className="rc-edit" onClick={onGoRecords}>View</button>
        </div>
      </div>

      <div className="section-h"><span>Quick Access</span></div>
      <div className="quick-grid">
        <button className="quick-tile" onClick={onGoRoutines}>{I.list}<span>Routines</span></button>
        <button className="quick-tile" onClick={onGoLibrary}>{I.dumbbell}<span>Exercises</span></button>

        <button className="quick-tile" onClick={onMeasure}>{I.ruler}<span>Measure</span></button>

    </div>
  );
}

/* strip equipment words so "Smith Machine Bench Press" and "Bench Press" match on movement */
const _EQ_STRIP=['smith machine','smith','machine','barbell','dumbbell','cable','kettlebell','resistance band','band','bodyweight','weight plate','landmine','leverage','pit shark','one arm','one leg','single-arm','single-leg','single arm','single leg'];
function movementName(name){
  let n=' '+String(name||'').toLowerCase()+' ';
  _EQ_STRIP.forEach(w=>{ n=n.split(w).join(' '); });
  return n.replace(/\s+/g,' ').trim();
}
function rankAlternates(cur, exercises){
  if(!cur) return [];
  const curMove=movementName(cur.name); const curTrack=trackOf(cur);
  return asArray(exercises).filter(e=>e&&e.id&&e.name&&e.id!==cur.id).map(e=>{
    let score=0;
    if(movementName(e.name)===curMove && curMove) score+=200;     // same movement, different gear
    if(e.m===cur.m) score+=100;                                    // same primary muscle
    if(trackOf(e)===curTrack) score+=40;                           // logs the same way
    if(e.sec && (e.sec===cur.sec || e.sec===cur.m || e.m===cur.sec)) score+=15;
    if(e.eq!==cur.eq) score+=8;                                    // prefer a different machine/bench
    return {e,score};
  }).filter(x=>x.score>=40).sort((a,b)=>b.score-a.score);
}
function SwapSheet({current, exercises, onClose, onSwap}){
  const [q,setQ]=useState('');
  const ranked=useMemo(()=>rankAlternates(current, exercises),[current, exercises]);
  const ql=q.trim().toLowerCase();
  const list = ql
    ? asArray(exercises).filter(e=>e&&e.id&&e.name&&e.id!==(current&&current.id)&&e.name.toLowerCase().includes(ql)).slice(0,40)
    : ranked.map(r=>r.e).slice(0,12);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'82vh'}}>
        <div className="sheet-grip"></div>
        <div className="sheet-head"><h2>Swap exercise</h2><button className="x-btn" onClick={onClose}>{I.x}</button></div>
        <div className="sheet-body">
          <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:10}}>
            {current ? <span>Bench taken? Rotate <b style={{color:'var(--text)'}}>{current.name}</b> for a similar move — your sets carry over.</span> : 'Pick a replacement.'}
          </div>
          <div className="field" style={{marginBottom:12}}>
            <input placeholder="Search all exercises…" value={q} onChange={e=>setQ(e.target.value)} />
          </div>
          {!ql && <div className="section-h" style={{margin:'2px 0 8px'}}>Similar exercises</div>}
          {list.length===0 && <div style={{textAlign:'center',padding:'20px',color:'var(--muted)',fontSize:13}}>No matches{ql?' for that search':''}.</div>}
          {list.map(e=>(
            <div key={e.id} className="ex-row tap" onClick={()=>onSwap(e.id)} style={{marginBottom:8}}>
              <Thumb ex={e} />
              <div className="ex-info">
                <div className="ex-name">{e.name}</div>
                <div className="ex-sub"><span style={{color:EQUIP[e.eq]?EQUIP[e.eq].c:'#888'}}>{e.eq}</span>·<span style={{color:MUSCLE[e.m]||'#888'}}>{e.m}</span>{!ql && current && trackOf(e)===trackOf(current) && <span style={{color:'var(--good)'}}>· logs the same</span>}</div>
              </div>
              <span className="chevron">{I.swap}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TrainView({active, exById, unit, records, setActive, onFinish, onDiscard, onStartQuick, onAddExercise, startRest, exercises}){
  const [elapsed,setElapsed]=useState(0);
  const [showReorder,setShowReorder]=useState(false);
  const [swapFor,setSwapFor]=useState(null);
  const cardRefs=useRef({});
  useEffect(()=>{
    if(!active) return;
    if(!active.startedAt){ setElapsed(0); return; }
    const t=setInterval(()=>setElapsed(Math.floor((Date.now()-active.startedAt)/1000)),1000);
    setElapsed(Math.floor((Date.now()-active.startedAt)/1000));
    return ()=>clearInterval(t);
  },[active&&active.startedAt]);

  if(!active) return (
    <div className="empty" style={{paddingTop:70}}><div className="ic">{I.flame}</div><h3>No active workout</h3>
      <p>Start a routine from the Routines tab, or kick off a quick empty session and add lifts as you go.</p>
      <div style={{marginTop:20}}><button className="btn btn-accent" onClick={onStartQuick}>{I.flame}Start empty workout</button></div></div>
  );

  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const entries=Array.isArray(active.entries) ? active.entries : [];
  const validEntries=entries.filter(en=>exById[en&&en.exerciseId]);
  const totalSets=entries.reduce((n,e)=>n+asArray(e&&e.sets).filter(s=>s.done).length,0);
  const totalVol=entries.reduce((n,e)=>n+asArray(e&&e.sets).filter(s=>s.done).reduce((v,s)=>v+(+s.weight||0)*(+s.reps||0),0),0);
  const entryComplete=(en)=>{
    if(!en || !Array.isArray(en.sets)) return false;
    const ex=exById[en.exerciseId]; const tk=trackOf(ex);
    if(!ex) return false;
    return en.sets.length>0 && en.sets.every(s=>s.done && setHasData(tk,s));
  };
  const guided=(active.mode==='guided'||!!active.routineId) && entries.length>0;
  const completeExercises=entries.filter(entryComplete).length;
  const allExercisesDone=entries.length>0 && completeExercises===entries.length;
  const storedIndex=Math.max(0, Math.min(entries.length-1, Math.floor(+active.currentEntryIndex||0)));
  const currentIndex=guided ? storedIndex : -1;
  const progressPct=entries.length ? (completeExercises/entries.length)*100 : 0;
  const applyReorder=(ids)=>{
    const byId={}; entries.forEach(en=>{ if(en&&en.exerciseId) byId[en.exerciseId]=en; });
    const next=asArray(ids).map(id=>byId[id]).filter(Boolean);
    if(!next.length){ setShowReorder(false); return; }
    const curEntry=guided ? entries[currentIndex] : null;
    const ni=curEntry ? Math.max(0, next.findIndex(en=>en.exerciseId===curEntry.exerciseId)) : Math.max(0, Math.min(next.length-1, storedIndex));
    setActive({...active, entries:next, currentEntryIndex:ni});
    setShowReorder(false);
  };

  /* ---- supersets: adjacent entries sharing a group id ---- */
  const groupsOf=(ens)=>{
    const arr=asArray(ens); const out=[]; let i=0;
    while(i<arr.length){
      const g=arr[i] && arr[i].group;
      if(g){ const grp=[i]; let j=i+1; while(j<arr.length && arr[j] && arr[j].group===g){ grp.push(j); j++; } out.push(grp); i=j; }
      else { out.push([i]); i++; }
    }
    return out;
  };
  const groups=groupsOf(entries);
  const groupOf=(ei)=>groups.find(g=>g.indexOf(ei)>=0) || [ei];
  const groupComplete=(grp)=>grp.length>0 && grp.every(idx=>entryComplete(entries[idx]));
  const currentGroup=guided ? groupOf(currentIndex) : [];
  const curGroupPos=groups.findIndex(g=>g.indexOf(currentIndex)>=0);
  const gotoGroup=(pos)=>{ const p=Math.max(0,Math.min(groups.length-1,pos)); setActive({...active, currentEntryIndex:groups[p][0]}); };
  // label map: A1/A2, B1/B2 for multi-exercise groups
  const ssLabel={}; let _L=0;
  groups.forEach(g=>{ if(g.length>1){ const L=String.fromCharCode(65+_L); _L++; g.forEach((idx,k)=>{ ssLabel[idx]={tag:L+(k+1), first:k===0, last:k===g.length-1, count:g.length}; }); } });
  const linkWithNext=(ei)=>{
    const e=clone(active); const ens=asArray(e.entries);
    if(ei<0 || ei>=ens.length-1) return;
    const gid=ens[ei].group || ens[ei+1].group || ('ss'+uid());
    ens[ei].group=gid; ens[ei+1].group=gid;
    setActive(e);
  };
  const unlinkGroup=(ei)=>{
    const e=clone(active); const ens=asArray(e.entries);
    const g=ens[ei] && ens[ei].group; if(!g) return;
    ens.forEach(en=>{ if(en && en.group===g) delete en.group; });
    setActive(e);
  };
  const doSwap=(ei,newId)=>{ const e=clone(active); const en=asArray(e.entries)[ei]; if(!en || !exById[newId]) return; en.exerciseId=newId; setActive(e); };

  const setFocusIndex=(idx)=>{
    if(!guided) return;
    const next=Math.max(0, Math.min(entries.length-1, idx));
    setActive({...active, currentEntryIndex:next});
  };
  const advanceAfterSet=(e,ei,label)=>{
    if(!guided){
      setActive(e); startRest(label||'Rest');
      if(entryComplete(e.entries[ei])){
        const next=asArray(e.entries).findIndex((en,idx)=>idx>ei && !entryComplete(en));
        if(next>=0) setTimeout(()=>{ const el=cardRefs.current[next]; if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'}); },180);
      }
      return;
    }
    if(!entryComplete(e.entries[ei])){ setActive(e); startRest(label||'Rest'); return; }
    const eg=groupsOf(e.entries);
    const myGroup=eg.find(g=>g.indexOf(ei)>=0) || [ei];
    const groupDone=myGroup.every(idx=>entryComplete(e.entries[idx]));
    if(!groupDone){
      const nextInGroup=myGroup.find(idx=>!entryComplete(e.entries[idx]));
      if(nextInGroup!==undefined){ e.currentEntryIndex=nextInGroup; setActive(e); const nx=exById[e.entries[nextInGroup].exerciseId]; startRest(nx?'Superset: '+nx.name:'Next in superset'); return; }
    }
    const myPos=eg.findIndex(g=>g.indexOf(ei)>=0);
    for(let p=myPos+1;p<eg.length;p++){
      const tgt=eg[p].find(idx=>!entryComplete(e.entries[idx]));
      if(tgt!==undefined){ e.currentEntryIndex=tgt; setActive(e); const nx=exById[e.entries[tgt].exerciseId]; startRest(nx?'Next: '+nx.name:'Next exercise'); return; }
    }
    const anyOpen=asArray(e.entries).findIndex(en=>!entryComplete(en));
    if(anyOpen>=0){
      e.currentEntryIndex=anyOpen;
      setActive(e);
      startRest(label||'Rest');
      return;
    }
    e.currentEntryIndex=ei;
    setActive(e);
  };
  const finishSet=(ei,si,eOverride)=>{
    const e=eOverride||clone(active); const entry=asArray(e.entries)[ei]; if(!entry) return;
    const ex=exById[entry.exerciseId]; const tk=trackOf(ex); const set=entry.sets[si]; if(!set) return;
    applyTargetDefaults(tk,set);
    if(!setHasData(tk,set)){ set.done=false; setActive(e); return; }
    if(!e.startedAt) e.startedAt=Date.now();
    const was=set.done; set.done=true;
    if(!was) advanceAfterSet(e,ei,ex?ex.name:'Rest'); else setActive(e);
  };
  const upd=(ei,si,f,v)=>{
    const e=clone(active); const entry=asArray(e.entries)[ei]; if(!entry) return;
    const ex=exById[entry.exerciseId]; const tk=trackOf(ex); const set=entry.sets[si]; if(!set) return;
    set[f]=v;
    // typing never auto-completes a set — the checkmark is the only "I did this" signal.
    // The one exception: a checked set that loses its data flips back to unchecked.
    if(set.done && !setHasData(tk,set)) set.done=false;
    setActive(e);
  };
  const toggleDone=(ei,si)=>{
    const e=clone(active); const set=asArray(e.entries)[ei]&&asArray(e.entries[ei].sets)[si]; if(!set) return;
    if(set.done){ set.done=false; setActive(e); return; }
    finishSet(ei,si,e);
  };
  const addSet=(ei)=>{ const e=clone(active); const entry=asArray(e.entries)[ei]; if(!entry) return; entry.sets=asArray(entry.sets); const last=entry.sets[entry.sets.length-1]; entry.sets.push(last?{...last,done:false}:defaultSetFor(exById[entry.exerciseId])); setActive(e); };
  const delSet=(ei,si)=>{ const e=clone(active); const entry=asArray(e.entries)[ei]; if(!entry) return; entry.sets=asArray(entry.sets); entry.sets.splice(si,1); if(!entry.sets.length){ const ex=exById[entry.exerciseId]; entry.sets.push(defaultSetFor(ex, true)); } setActive(e); };
  const removeEx=(ei)=>{ const e=clone(active); e.entries=asArray(e.entries); e.entries.splice(ei,1); setActive(e); };
  const updNote=(ei,v)=>{ const e=clone(active); const entry=asArray(e.entries)[ei]; if(!entry) return; entry.note=v; setActive(e); };
  const updSessionNote=(v)=>{ setActive({...active, note:v}); };

  return (
    <div>
      <div className="workout-bar">
        <div><div className="wb-lbl">{active.name}</div><div className="wb-time">{fmt(elapsed)}</div></div>
        <div style={{textAlign:'right'}}><div className="wb-lbl">{totalSets} sets · {Math.round(totalVol).toLocaleString()} {unit}</div>
          <button className="start-btn" style={{marginTop:6}} onClick={onFinish}>Finish ✓</button></div>
      </div>
      {guided &&
        <div className="guided-head">
          <div className="guided-top">
            <div>
              <div className="guided-meta">Routine flow</div>
              <div className="guided-title">{allExercisesDone?'All exercises complete':'Exercise '+(currentIndex+1)+' of '+entries.length}</div>
            </div>
            <div className="guided-meta">{completeExercises}/{entries.length}</div>
          </div>
          <div className="guided-track"><div className="guided-fill" style={{width:progressPct+'%'}}></div></div>
          <div className="guided-controls">
            <button className="mini-btn" disabled={curGroupPos<=0} onClick={()=>gotoGroup(curGroupPos-1)}>Prev</button>
            <button className="mini-btn" onClick={()=>setShowReorder(true)} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5}}>{I.grip}Reorder</button>
            <button className="mini-btn" disabled={curGroupPos>=groups.length-1} onClick={()=>gotoGroup(curGroupPos+1)}>Next</button>
          </div>
        </div>}
      {guided && allExercisesDone && <div className="guided-done">Routine day complete. Finish when notes look right.</div>}
      <textarea className="session-note" rows="2" placeholder="Session notes — how you feel, sleep, bodyweight, energy…" value={active.note||''} onChange={e=>updSessionNote(e.target.value)} />
      {entries.length===0 && <div className="empty" style={{padding:'30px 20px'}}><p>Empty session - add your first exercise below.</p></div>}
      {guided && entries.length>0 && !validEntries.length && <div className="empty" style={{padding:'30px 20px'}}><p>This routine day has exercises that no longer exist. Add them again from the library.</p></div>}
      {groups.map((grp,gi)=>{
        if(guided && grp.indexOf(currentIndex)<0) return null;
        const isSS=grp.length>1;
        return (
        <div key={'g'+gi} className={isSS?'superset-wrap':''}>
          {isSS && <div className="superset-banner">{I.link} Superset · {grp.length} exercises <span className="ss-hint">back-to-back, rest after the round</span></div>}
          {grp.map((ei)=>{
        const en=entries[ei];
        const ex=exById[en.exerciseId];
        if(!ex){
          return (
            <div key={ei} className={'log-ex'+(isSS?' ss-item':'')}>
              <div className="log-ex-head">
                <div style={{flex:1,minWidth:0}}><div className="log-ex-name">{ssLabel[ei]&&<span className="ss-tag">{ssLabel[ei].tag}</span>}Missing exercise</div>
                  <div className="log-prev">This slot's exercise was deleted from your library. Swap it or remove it.</div></div>
                <div className="log-ex-actions">
                  <button className="iconbtn" title="Swap for a similar exercise" onClick={()=>setSwapFor(ei)}>{I.swap}</button>
                  <button className="delset" onClick={()=>removeEx(ei)}>{I.trash}</button>
                </div>
              </div>
            </div>
          );
        }
        const rec=records[en.exerciseId];
        const tk=trackOf(ex); const fields=TRACK[tk].fields;
        const demo=demoFor(ex);
        const sets=asArray(en.sets);
        const cols='34px '+fields.map(()=>'1fr').join(' ')+' 46px';
        return (
          <div key={ei} className={'log-ex'+(isSS?' ss-item':'')} ref={el=>{ if(el) cardRefs.current[ei]=el; else delete cardRefs.current[ei]; }}>
            <div className="log-ex-head">
              <Thumb ex={ex} />
              <div style={{flex:1,minWidth:0}}><div className="log-ex-name">{ssLabel[ei]&&<span className="ss-tag">{ssLabel[ei].tag}</span>}{ex.name}</div>
                <div className="log-prev">{rec?`${metricInfo(rec.track,unit).label} ${rec.best}${metricInfo(rec.track,unit).suffix}`:'No history yet — set the baseline'}</div>
                <div className="target-line">{targetSummary(en, ex, unit)}</div></div>
              <div className="log-ex-actions">
                <button className="iconbtn" title="Swap for a similar exercise" onClick={()=>setSwapFor(ei)}>{I.swap}</button>
