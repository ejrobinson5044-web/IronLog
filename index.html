<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>IronLog — Workout Tracker</title>

<!-- ============ PWA (installable app) ============ -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d0e16" />
<!-- iOS standalone-app behavior (iOS ignores manifest display mode) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IronLog" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<!-- =============================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- INDIGO theme ---- */
    --bg:#0d0e16; --surface:#161826; --surface2:#1e2133; --surface3:#282c44;
    --border:#2a2e45; --border2:#383d5a;
    --text:#eef0f7; --muted:#9095ad; --muted2:#646a86;
    --accent:#818cf8; --accent-dim:#6366f1; --accent-deep:#4f46e5; --accent-ink:#ffffff;
    --good:#5ddca5; --warn:#ffb454; --bad:#ff6b6b; --info:#7aa2ff;
    --radius:14px; --radius-sm:10px; --radius-lg:20px;
    --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --display:'Archivo',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #root{height:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  ::-webkit-scrollbar{width:0;height:0}

  .app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);
    position:relative;border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;
    background:linear-gradient(180deg,var(--bg),rgba(13,14,22,0.6));position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:9px}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;
    color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:16px;transform:rotate(-4deg)}
  .brand h1{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em}
  .brand h1 span{color:var(--accent)}
  .top-right{display:flex;align-items:center;gap:10px}
  .unit-toggle{display:flex;background:var(--surface2);border-radius:999px;padding:3px;border:1px solid var(--border)}
  .unit-toggle button{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
  .unit-toggle button.on{background:var(--accent);color:var(--accent-ink)}
  .gear{width:36px;height:36px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);
    display:grid;place-items:center;color:var(--muted);position:relative}
  .gear svg{width:19px;height:19px}
  .sync-dot{position:absolute;top:-1px;right:-1px;width:10px;height:10px;border-radius:999px;border:2px solid var(--bg)}

  .scroll{flex:1;overflow-y:auto;padding:4px 16px 120px;scroll-behavior:smooth}
  .section-h{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:22px 2px 12px;display:flex;align-items:center;justify-content:space-between}
  .section-h:first-child{margin-top:8px}

  .nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(16,18,28,0.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;
    color:var(--muted2);font-size:10.5px;font-weight:700;transition:.15s}
  .nav button.on{color:var(--accent)}
  .nav svg{width:23px;height:23px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:.15s}
  .routine-card{margin-bottom:12px}
  .routine-card .rc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .rc-name{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em}
  .rc-meta{color:var(--muted);font-size:13px;margin-top:3px}
  .rc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .start-btn{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:9px 16px;
    border-radius:999px;white-space:nowrap;font-family:var(--display)}
  .start-btn:active{background:var(--accent-dim)}
  .pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}

  .ex-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);
    background:var(--surface);border:1px solid var(--border);margin-bottom:8px;transition:.12s}
  .ex-row.tap:active{background:var(--surface2)}
  .ex-thumb{width:46px;height:46px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;
    background:var(--surface2);border:1px solid var(--border)}
  .ex-thumb svg{width:26px;height:26px}
  .ex-thumb.photo{background:#eef0f3;border-color:var(--border2)}
  .ex-thumb img{width:100%;height:100%;object-fit:cover}
  .ex-info{flex:1;min-width:0}
  .ex-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:6px;align-items:center}
  .ex-sub b{color:var(--accent);font-weight:700}
  .chevron{color:var(--muted2);flex-shrink:0}

  .search-wrap{position:relative;margin:8px 0 4px}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted2)}
  .search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:11px 16px 11px 40px;color:var(--text);outline:none;transition:.15s}
  .search:focus{border-color:var(--accent);background:var(--surface2)}
  .filter-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;margin:0 -16px}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);
    font-size:12.5px;font-weight:700;color:var(--muted);transition:.12s;white-space:nowrap}
  .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

  .btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:var(--radius);
    font-weight:800;font-size:15px;font-family:var(--display);transition:.12s}
  .btn-accent{background:var(--accent);color:var(--accent-ink)}
  .btn-accent:active{background:var(--accent-dim)}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-ghost:active{background:var(--surface3)}
  .btn-danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,107,.3)}
  .btn svg{width:19px;height:19px}
  .btn-sm{padding:10px;font-size:13px;border-radius:var(--radius-sm)}
  .btn[disabled]{cursor:not-allowed}

  .fab{position:absolute;right:18px;bottom:84px;width:56px;height:56px;border-radius:18px;background:var(--accent);
    color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 26px rgba(129,140,248,.4);z-index:25;transition:.12s}
  .fab:active{transform:scale(.92)}
  .fab svg{width:28px;height:28px}

  .empty{text-align:center;padding:50px 24px;color:var(--muted)}
  .empty .ic{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--border);
    display:grid;place-items:center;margin:0 auto 18px}
  .empty .ic svg{width:30px;height:30px;color:var(--muted2)}
  .empty h3{font-family:var(--display);font-size:18px;color:var(--text);margin-bottom:6px;font-weight:700}
  .empty p{font-size:13.5px;line-height:1.55;max-width:270px;margin:0 auto}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:480px;max-height:92vh;background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    border:1px solid var(--border);border-bottom:none;display:flex;flex-direction:column;animation:slideup .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-grip{width:38px;height:4px;border-radius:999px;background:var(--border2);margin:10px auto 4px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px;border-bottom:1px solid var(--border)}
  .sheet-head h2{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em}
  .sheet-body{overflow-y:auto;padding:18px;flex:1}
  .x-btn{width:32px;height:32px;border-radius:999px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
  .x-btn svg{width:18px;height:18px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
  .field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);outline:none;transition:.15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface3)}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{padding:9px 13px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);
    font-size:13px;font-weight:700;color:var(--muted);transition:.12s}
  .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  .log-ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .log-ex-head{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--surface2)}
  .log-ex-head .ex-thumb{width:40px;height:40px}
  .log-ex-head .ex-thumb svg{width:22px;height:22px}
  .log-ex-name{flex:1;font-weight:700;font-size:14.5px}
  .log-prev{font-size:11.5px;color:var(--muted);margin-top:1px}
  .set-table{padding:6px 14px 14px}
  .set-hdr,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center}
  .set-hdr{font-size:10.5px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;padding:8px 0 6px}
  .set-hdr div,.set-row .setno{text-align:center}
  .set-row{margin-bottom:7px}
  .setno{font-weight:800;font-size:14px;color:var(--muted);font-family:var(--display)}
  .set-row input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 6px;
    text-align:center;color:var(--text);outline:none;font-weight:600;transition:.12s}
  .set-row input:focus{border-color:var(--accent);background:var(--surface3)}
  .set-row.done input{background:rgba(129,140,248,.1);border-color:rgba(129,140,248,.32)}
  .check{width:32px;height:32px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);
    display:grid;place-items:center;color:var(--muted2);transition:.12s;margin:0 auto}
  .check.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .check svg{width:17px;height:17px}
  .set-foot{display:flex;gap:8px;margin-top:4px}
  .addset{flex:1;padding:9px;border-radius:9px;background:var(--surface2);border:1px dashed var(--border2);color:var(--muted);
    font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px}
  .addset:active{background:var(--surface3)}
  .restbtn{padding:9px 14px;border-radius:9px;background:var(--surface3);border:1px solid var(--border2);color:var(--accent);
    font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px;font-family:var(--display)}
  .restbtn svg{width:15px;height:15px}
  .delset{color:var(--muted2);padding:4px}

  .workout-bar{background:linear-gradient(135deg,var(--surface3),var(--surface));border:1px solid var(--accent);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .wb-time{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
  .wb-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

  /* ---- REST TIMER bar ---- */
  .rest-bar{position:absolute;left:12px;right:12px;bottom:78px;z-index:28;background:var(--accent-deep);
    border-radius:var(--radius);padding:12px 14px;box-shadow:0 10px 30px rgba(79,70,229,.45);
    display:flex;align-items:center;gap:12px;animation:restin .25s cubic-bezier(.2,.8,.2,1);overflow:hidden}
  @keyframes restin{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .rest-prog{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.55);transition:width 1s linear}
  .rest-count{font-family:var(--display);font-size:26px;font-weight:800;color:#fff;letter-spacing:-.02em;min-width:62px}
  .rest-mid{flex:1;min-width:0}
  .rest-lbl{font-size:10.5px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .rest-ex{font-size:13px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rest-btns{display:flex;gap:6px}
  .rest-btns button{background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:12px;padding:8px 10px;
    border-radius:8px;font-family:var(--display);transition:.12s}
  .rest-btns button:active{background:rgba(255,255,255,.3)}
  .rest-skip{background:#fff !important;color:var(--accent-deep) !important}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center}
  .stat-card .v{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em}
  .stat-card .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-top:3px}
  .rec-row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);margin-bottom:8px;transition:.12s}
  .rec-row.tap:active{background:var(--surface2)}
  .rec-1rm{text-align:right;flex-shrink:0}
  .rec-1rm .n{font-family:var(--display);font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
  .rec-1rm .u{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}

  .demo-hero{position:relative;width:100%;height:230px;background:#eef0f3;border-radius:var(--radius);overflow:hidden;
    margin-bottom:14px;border:1px solid var(--border)}
  .demo-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .45s ease}
  .demo-cap{position:absolute;left:10px;bottom:8px;background:rgba(13,14,22,.72);color:#fff;font-size:11px;font-weight:700;
    padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:5px}
  .demo-cap svg{width:13px;height:13px}
  .detail-hero{display:flex;gap:16px;align-items:center;margin-bottom:6px}
  .bodymap{width:118px;height:210px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius)}
  .detail-meta{flex:1}
  .detail-meta .dm-name{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin-bottom:10px}
  .detail-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .cue{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;
    font-size:13.5px;line-height:1.5;color:var(--muted);margin-bottom:14px}
  .cue b{color:var(--text)}
  .demo-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:var(--radius);
    background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:14px;margin-bottom:18px}
  .demo-btn:active{background:var(--surface3)}
  .demo-btn svg{width:19px;height:19px;color:var(--bad)}
  .hist-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
  .hist-row:last-child{border:none}
  .hist-date{font-size:13px;font-weight:700}
  .hist-sets{font-size:12px;color:var(--muted);margin-top:2px}
  .hist-1rm{font-family:var(--display);font-weight:800;color:var(--accent);font-size:15px}
  .spark{margin:6px 0 16px}

  .toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);
    padding:12px 22px;border-radius:999px;font-weight:800;font-size:14px;font-family:var(--display);z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastin .3s;display:flex;align-items:center;gap:8px;max-width:90%}
  @keyframes toastin{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .toast svg{width:18px;height:18px;flex-shrink:0}

  .selected-count{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 18px;margin:0 -18px -18px}
  .added-badge{width:28px;height:28px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
  .added-badge svg{width:16px;height:16px}
  .add-circle{width:28px;height:28px;border-radius:999px;border:1.5px solid var(--border2);color:var(--muted2);display:grid;place-items:center;flex-shrink:0;transition:.12s}
  .divider-note{font-size:11.5px;color:var(--muted2);text-align:center;line-height:1.5;padding:18px 10px 4px}

  /* settings */
  .set-block{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .set-block h3{font-family:var(--display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .set-block h3 svg{width:17px;height:17px}
  .rest-stepper{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .rest-stepper button{width:42px;height:42px;border-radius:11px;background:var(--surface3);border:1px solid var(--border2);
    font-size:22px;font-weight:700;color:var(--text);display:grid;place-items:center}
  .rest-stepper .val{flex:1;text-align:center;font-family:var(--display);font-size:28px;font-weight:800}
  .preset-row{display:flex;gap:8px}
  .preset-row button{flex:1;padding:9px;border-radius:9px;background:var(--surface3);border:1px solid var(--border2);
    font-weight:700;font-size:13px;color:var(--muted)}
  .preset-row button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .auth-row{display:flex;gap:8px;margin-top:10px}
  .auth-row .btn{flex:1}
  .status-msg{font-size:12.5px;margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--surface3);color:var(--muted);line-height:1.45}
  .acct-pill{display:flex;align-items:center;gap:10px;background:var(--surface3);border-radius:11px;padding:11px 13px;margin-bottom:12px}
  .acct-pill .av{width:34px;height:34px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
  details.help{margin-top:10px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface3)}

/* ---- thumbnail (real photo if available, else icon) ---- */
function Thumb({ex, cls}){
  const [bad,setBad]=useState(false);
  const d=demoFor(ex);
  const src=d && d.type==='frames' ? d.frames[0] : null;
  if(src && !bad) return (
    <div className={'ex-thumb photo '+(cls||'')}>
      <img loading="lazy" src={src} alt="" onError={()=>setBad(true)} />
    </div>
  );
  return (
    <div className={'ex-thumb '+(cls||'')} style={{borderColor:tint(MUSCLE[ex.m]||'#888',.4)}}>
      <span style={{color:MUSCLE[ex.m]||'#888'}}>{I.dumbbell}</span>
    </div>
  );
}

/* ---- animated demo (crossfade two frames) ---- */
function AnimatedDemo({demo}){
  const frames=demo.frames;
  const [i,setI]=useState(0);
  const [bad,setBad]=useState(false);
  useEffect(()=>{
    if(frames.length<2) return;
    const t=setInterval(()=>setI(p=>(p+1)%frames.length), 950);
    return ()=>clearInterval(t);
  },[frames]);
  if(demo.type==='video') return (
    <video src={demo.src} autoPlay loop muted playsInline
      style={{width:'100%',borderRadius:'var(--radius)',marginBottom:14,background:'#eef0f3'}} />
  );
  if(bad) return null;
  return (
    <div className="demo-hero">
      {frames.map((src,idx)=>
        <img key={idx} src={src} alt="" onError={()=>setBad(true)}
          style={{opacity: idx===i?1:0}} />)}
      <span className="demo-cap">{I.timer}{frames.length>1?'Animated demo':'Demo'}</span>
    </div>
  );
}

function Spark({data, color}){
  if(data.length < 2) return null;
  const w=300, h=54, pad=4;
  const max=Math.max(...data), min=Math.min(...data); const rng=(max-min)||1;
  const pts=data.map((v,i)=>{ const x=pad+(i/(data.length-1))*(w-pad*2); const y=h-pad-((v-min)/rng)*(h-pad*2); return [x,y]; });
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${pts[pts.length-1][0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z`;
  return (
    <svg className="spark" width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <path d={area} fill={tint(color,.14)}/>
      <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>)}
    </svg>
  );
}

const Pill = ({children, color}) => <span className="pill" style={{background:tint(color,.18), color}}>{children}</span>;

/* ---- beep + vibrate when rest ends ---- */
let _actx;
function beep(){
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended') _actx.resume();
    [0,0.26,0.52].forEach((t,i)=>{
      const o=_actx.createOscillator(), g=_actx.createGain();
      o.type='sine'; o.frequency.value = i<2?880:1320;
      o.connect(g); g.connect(_actx.destination);
      const s=_actx.currentTime+t;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.35,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+0.2);
      o.start(s); o.stop(s+0.22);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([220,90,220]); }catch(e){}
}
function primeAudio(){ try{ _actx = _actx || new (window.AudioContext||window.webkitAudioContext)(); if(_actx.state==='suspended') _actx.resume(); }catch(e){} }

/* ============================================================
   REST TIMER bar
   ============================================================ */
function RestBar({rest, onAdjust, onSkip, onDone}){
  const [now,setNow]=useState(Date.now());
  const firedRef=useRef(false);
  useEffect(()=>{ firedRef.current=false; },[rest.endsAt, rest.startedAt]);
  useEffect(()=>{
    const t=setInterval(()=>setNow(Date.now()),250);
    return ()=>clearInterval(t);
  },[]);
  const remainMs=Math.max(0, rest.endsAt-now);
  const remain=Math.ceil(remainMs/1000);
  useEffect(()=>{
    if(remainMs<=0 && !firedRef.current){ firedRef.current=true; beep(); setTimeout(onDone, 900); }
  });
  const mm=Math.floor(remain/60), ss=remain%60;
  const pct=Math.max(0, Math.min(100, (remainMs/(rest.total*1000))*100));
  const done = remainMs<=0;
  return (
    <div className="rest-bar" style={done?{background:'var(--good)'}:{}}>
      <div className="rest-prog" style={{width:pct+'%'}}></div>
      <div className="rest-count">{done?'Go!':`${mm}:${String(ss).padStart(2,'0')}`}</div>
      <div className="rest-mid">
        <div className="rest-lbl">{done?'Rest complete':'Rest'}</div>
        <div className="rest-ex">{rest.label}</div>
      </div>
      {!done &&
        <div className="rest-btns">
          <button onClick={()=>onAdjust(-15)}>-15</button>
          <button onClick={()=>onAdjust(15)}>+15</button>
          <button className="rest-skip" onClick={onSkip}>Skip</button>
        </div>}
      {done && <div className="rest-btns"><button className="rest-skip" onClick={onSkip}>Done</button></div>}
    </div>
  );
}

function App(){
  const [tab, setTab] = useState('routines');
  const [unit, setUnit] = useState(()=>store.get('unit','lb'));
  const [restDefault, setRestDefault] = useState(()=>store.get('restDefault',90));

  const [routines, setRoutines] = useState(()=>store.get('routines', []));
  const [logs, setLogs] = useState(()=>store.get('logs', []));
  const [active, setActive] = useState(()=>store.get('active', null));
  const [rest, setRest] = useState(null); // {endsAt,total,label,startedAt}
  const [toast, setToast] = useState(null);

  // modals
  const [detailEx, setDetailEx] = useState(null);
  const [newExOpen, setNewExOpen] = useState(false);
  const [editRoutine, setEditRoutine] = useState(undefined);
  const [pickerFor, setPickerFor] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);

  // sync
  const [sbUrl, setSbUrl] = useState(()=>store.get('sb_url', SUPABASE_URL||''));
  const [sbKey, setSbKey] = useState(()=>store.get('sb_key', SUPABASE_ANON_KEY||''));
  const [session, setSession] = useState(null);
  const [syncStatus, setSyncStatus] = useState('');
  const [lastSync, setLastSync] = useState(null);
  const clientRef = useRef(null);
  const applyingRemote = useRef(false);
  const loadedRef = useRef(false);

  useEffect(()=>store.set('unit',unit),[unit]);
  useEffect(()=>store.set('restDefault',restDefault),[restDefault]);
  useEffect(()=>store.set('exercises',exercises),[exercises]);
  useEffect(()=>store.set('routines',routines),[routines]);
  useEffect(()=>store.set('logs',logs),[logs]);
  useEffect(()=>store.set('active',active),[active]);

  const exById = useMemo(()=>Object.fromEntries(exercises.map(e=>[e.id,e])),[exercises]);
  const flash = (msg)=>{ setToast(msg); setTimeout(()=>setToast(null), 1900); };

  /* ----- Supabase client lifecycle ----- */
  useEffect(()=>{
    if(sbUrl && sbKey && typeof supabase!=='undefined' && supabase.createClient){
      try{
        const c = supabase.createClient(sbUrl, sbKey);
        clientRef.current = c;
        c.auth.getSession().then(({data})=>setSession(data.session||null));
        const { data:sub } = c.auth.onAuthStateChange((_e,s)=>setSession(s));
        return ()=>{ try{ sub.subscription.unsubscribe(); }catch(e){} };
      }catch(e){ setSyncStatus('Could not connect — check the URL & key.'); }
    } else {
      clientRef.current = null;
    }
  },[sbUrl,sbKey]);

  const payload = ()=>({v:2, exercises, routines, logs, unit, restDefault});

  const doPull = async ()=>{
    const c=clientRef.current; if(!c) return null;
    const { data:{ user } } = await c.auth.getUser(); if(!user) return null;
    const { data, error } = await c.from('ironlog_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
    if(error) throw error; return data;
  };
  const doPush = async ()=>{
    const c=clientRef.current; if(!c) return;
    const { data:{ user } } = await c.auth.getUser(); if(!user) return;
    const { error } = await c.from('ironlog_data').upsert({ user_id:user.id, data:payload(), updated_at:new Date().toISOString() });
    if(error) throw error;
    setLastSync(Date.now());
  };

  // on login -> pull (or seed cloud)
  useEffect(()=>{
    if(session && clientRef.current && !loadedRef.current){
      loadedRef.current=true;
      (async()=>{
        try{
          setSyncStatus('Syncing…');
          const row = await doPull();
          if(row && row.data && (row.data.logs||row.data.routines)){
            applyingRemote.current=true;
            setExercises(row.data.exercises||SEED);
            setRoutines(row.data.routines||[]);
            setLogs(row.data.logs||[]);
            if(row.data.unit) setUnit(row.data.unit);
            if(row.data.restDefault) setRestDefault(row.data.restDefault);
            setTimeout(()=>{ applyingRemote.current=false; },150);
            setLastSync(Date.now());
            setSyncStatus(''); flash('Synced from cloud ☁');
          } else {
            await doPush();
            setSyncStatus(''); flash('Cloud backup created ☁');
          }
        }catch(e){ setSyncStatus('Sync error: '+(e.message||e)); }
      })();
    }
    if(!session) loadedRef.current=false;
  },[session]);

  // debounced auto-push on data changes while logged in
  useEffect(()=>{
    if(!session || !clientRef.current || applyingRemote.current) return;
    const t=setTimeout(()=>{ doPush().catch(e=>setSyncStatus('Sync error: '+(e.message||e))); }, 1600);
    return ()=>clearTimeout(t);
  },[exercises, routines, logs, unit, restDefault, session]);

  /* ----- rest timer controls ----- */
  const startRest = (label)=>{
    primeAudio();
    setRest({ endsAt: Date.now()+restDefault*1000, total: restDefault, label: label||'Rest', startedAt: Date.now() });
  };
  const adjustRest = (sec)=> setRest(r=> r ? {...r, endsAt: Math.max(Date.now(), r.endsAt+sec*1000), total: Math.max(5, r.total+sec)} : r);

  /* ----- workout ----- */
  const startWorkout = (routine)=>{
    setActive({ id:uid(), date:todayISO(), startedAt:Date.now(),
      routineId: routine?routine.id:null, name: routine?routine.name:'Quick Workout',
      entries:(routine?routine.exerciseIds:[]).map(id=>({exerciseId:id, sets:[{weight:'',reps:'',done:false}]})) });
    setTab('train');
  };
  const finishWorkout = ()=>{
    const c = {...active, entries: active.entries.map(en=>({...en, sets: en.sets.filter(s=>+s.weight>0 && +s.reps>0)})).filter(en=>en.sets.length>0)};
    if(c.entries.length){ setLogs([c, ...logs]); flash('Workout saved 🔥'); }
    else flash('Nothing logged — discarded');
    setActive(null); setRest(null); setTab('records');
  };
  const discardWorkout = ()=>{ setActive(null); setRest(null); setTab('routines'); };

  const saveRoutine = (r)=>{
    if(routines.find(x=>x.id===r.id)) setRoutines(routines.map(x=>x.id===r.id?r:x));
    else setRoutines([r, ...routines]);
    setEditRoutine(undefined); flash('Routine saved');
  };
  const deleteRoutine = (id)=>{ setRoutines(routines.filter(r=>r.id!==id)); setEditRoutine(undefined); flash('Routine deleted'); };

  const addCustomExercise = (e)=>{ const ex={id:uid(), custom:true, media:'', ...e}; setExercises([ex, ...exercises]); setNewExOpen(false); flash('Exercise added'); return ex; };
  const deleteExercise = (id)=>{ setExercises(exercises.filter(e=>e.id!==id)); setRoutines(routines.map(r=>({...r, exerciseIds:r.exerciseIds.filter(x=>x!==id)}))); setDetailEx(null); flash('Exercise deleted'); };

  const records = useMemo(()=>{
    const r = {};
    logs.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(session=>{
      session.entries.forEach(en=>{
        const valid = en.sets.filter(s=>+s.weight>0 && +s.reps>0); if(!valid.length) return;
        if(!r[en.exerciseId]) r[en.exerciseId]={best1rm:0,maxW:0,bestVol:0,sessions:[],count:0};
        const rec=r[en.exerciseId]; let se=0,mw=0,vol=0,top='';
        valid.forEach(s=>{ const e=epley(s.weight,s.reps), v=+s.weight*+s.reps; if(e>se){se=e;top=`${+s.weight}×${+s.reps}`;} if(+s.weight>mw)mw=+s.weight; vol+=v; });
        rec.best1rm=Math.max(rec.best1rm,se); rec.maxW=Math.max(rec.maxW,mw); rec.bestVol=Math.max(rec.bestVol,vol);
        rec.count++; rec.sessions.push({date:session.date, top, e1rm:se, vol});
      });
    });
    return r;
  },[logs]);

  const syncColor = !sbUrl||!sbKey ? 'var(--muted2)' : (session ? 'var(--good)' : 'var(--warn)');

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand"><div className="brand-mark">IL</div><h1>Iron<span>Log</span></h1></div>
        <div className="top-right">
          <div className="unit-toggle">
            <button className={unit==='lb'?'on':''} onClick={()=>setUnit('lb')}>LB</button>
            <button className={unit==='kg'?'on':''} onClick={()=>setUnit('kg')}>KG</button>
          </div>
          <button className="gear" onClick={()=>setSettingsOpen(true)}>
            {I.gear}<span className="sync-dot" style={{background:syncColor}}></span>
          </button>
        </div>
      </div>

      <div className="scroll" key={tab}>
        {tab==='routines' &&
          <RoutinesView routines={routines} exById={exById} active={active}
            onStart={startWorkout} onNew={()=>setEditRoutine(null)} onEdit={setEditRoutine} onResume={()=>setTab('train')} />}
        {tab==='library' &&
          <LibraryView exercises={exercises} onOpen={setDetailEx} onNew={()=>setNewExOpen(true)} />}
        {tab==='train' &&
          <TrainView active={active} exById={exById} unit={unit} records={records}
            setActive={setActive} onFinish={finishWorkout} onDiscard={discardWorkout}
            onStartQuick={()=>startWorkout(null)} onAddExercise={()=>setPickerFor('active')} startRest={startRest} />}
        {tab==='records' &&
          <RecordsView records={records} exById={exById} logs={logs} unit={unit} onOpen={setDetailEx} />}
      </div>

      {tab==='routines' && <button className="fab" onClick={()=>setEditRoutine(null)}>{I.plus}</button>}
      {tab==='library' && <button className="fab" onClick={()=>setNewExOpen(true)}>{I.plus}</button>}

      {rest &&
        <RestBar rest={rest} onAdjust={adjustRest} onSkip={()=>setRest(null)} onDone={()=>setRest(null)} />}

      <nav className="nav">
        <button className={tab==='routines'?'on':''} onClick={()=>setTab('routines')}>{I.list}<span>Routines</span></button>
        <button className={tab==='library'?'on':''} onClick={()=>setTab('library')}>{I.dumbbell}<span>Exercises</span></button>
        <button className={tab==='train'?'on':''} onClick={()=>setTab('train')}>{I.flame}<span>Train</span></button>
        <button className={tab==='records'?'on':''} onClick={()=>setTab('records')}>{I.trophy}<span>Records</span></button>
      </nav>

      {detailEx && <ExerciseDetail ex={detailEx} unit={unit} rec={records[detailEx.id]} onClose={()=>setDetailEx(null)} onDelete={deleteExercise} />}
      {newExOpen && <NewExerciseSheet onClose={()=>setNewExOpen(false)} onSave={addCustomExercise} />}
      {editRoutine!==undefined && <RoutineEditor routine={editRoutine} exById={exById} exercises={exercises} onClose={()=>setEditRoutine(undefined)} onSave={saveRoutine} onDelete={deleteRoutine} />}
      {pickerFor==='active' &&
        <ExercisePicker exercises={exercises} preselected={active?active.entries.map(e=>e.exerciseId):[]}
          onClose={()=>setPickerFor(null)}
          onConfirm={(ids)=>{ const ex=active.entries.map(e=>e.exerciseId);
            const add=ids.filter(id=>!ex.includes(id)).map(id=>({exerciseId:id, sets:[{weight:'',reps:'',done:false}]}));

          clientRef={clientRef}

          onDisconnect={()=>{ store.set('sb_url',''); store.set('sb_key',''); setSbUrl(''); setSbKey(''); setSession(null); }}
          onSyncNow={async()=>{ try{ setSyncStatus('Syncing…'); await doPush(); setSyncStatus('Synced ✓'); flash('Synced ☁'); }catch(e){ setSyncStatus('Sync error: '+(e.message||e)); } }}
          onResetData={()=>{ setExercises(SEED); setRoutines([]); setLogs([]); setActive(null); flash('Local data reset'); }} />}

      {toast && <div className="toast">{I.check}{toast}</div>}
    </div>
  );
}

function TrainView({active, exById, unit, records, setActive, onFinish, onDiscard, onStartQuick, onAddExercise, startRest}){
  const [elapsed,setElapsed]=useState(0);
  useEffect(()=>{
    if(!active) return;
    const t=setInterval(()=>setElapsed(Math.floor((Date.now()-active.startedAt)/1000)),1000);
    setElapsed(Math.floor((Date.now()-active.startedAt)/1000));
    return ()=>clearInterval(t);
  },[active]);

  if(!active) return (
    <div className="empty" style={{paddingTop:70}}><div className="ic">{I.flame}</div><h3>No active workout</h3>
      <p>Start a routine from the Routines tab, or kick off a quick empty session and add lifts as you go.</p>
      <div style={{marginTop:20}}><button className="btn btn-accent" onClick={onStartQuick}>{I.flame}Start empty workout</button></div></div>
  );

  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const totalSets=active.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  const totalVol=active.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).reduce((v,s)=>v+(+s.weight||0)*(+s.reps||0),0),0);

  const upd=(ei,si,f,v)=>{ const e=clone(active); e.entries[ei].sets[si][f]=v; setActive(e); };
  const toggleDone=(ei,si)=>{ const e=clone(active); const was=e.entries[ei].sets[si].done; e.entries[ei].sets[si].done=!was; setActive(e);
    if(!was) startRest(exById[e.entries[ei].exerciseId] ? exById[e.entries[ei].exerciseId].name : 'Rest'); };
  const addSet=(ei)=>{ const e=clone(active); const last=e.entries[ei].sets[e.entries[ei].sets.length-1]; e.entries[ei].sets.push({weight:last?last.weight:'',reps:last?last.reps:'',done:false}); setActive(e); };
  const delSet=(ei,si)=>{ const e=clone(active); e.entries[ei].sets.splice(si,1); if(!e.entries[ei].sets.length) e.entries[ei].sets.push({weight:'',reps:'',done:false}); setActive(e); };
  const removeEx=(ei)=>{ const e=clone(active); e.entries.splice(ei,1); setActive(e); };

  return (
    <div>
      <div className="workout-bar">
        <div><div className="wb-lbl">{active.name}</div><div className="wb-time">{fmt(elapsed)}</div></div>
        <div style={{textAlign:'right'}}><div className="wb-lbl">{totalSets} sets · {Math.round(totalVol).toLocaleString()} {unit}</div>
          <button className="start-btn" style={{marginTop:6}} onClick={onFinish}>Finish ✓</button></div>
      </div>
      {active.entries.length===0 && <div className="empty" style={{padding:'30px 20px'}}><p>Empty session — add your first exercise below.</p></div>}
      {active.entries.map((en,ei)=>{
        const ex=exById[en.exerciseId]; if(!ex) return null;
        const rec=records[en.exerciseId];
        return (
          <div key={ei} className="log-ex">
            <div className="log-ex-head">
              <Thumb ex={ex} />
              <div style={{flex:1,minWidth:0}}><div className="log-ex-name">{ex.name}</div>
                <div className="log-prev">{rec?`Best 1RM ${rec.best1rm} ${unit} · heaviest ${rec.maxW} ${unit}`:'No history yet — set the baseline'}</div></div>
              <button className="delset" onClick={()=>removeEx(ei)}>{I.trash}</button>
            </div>
            <div className="set-table">
              <div className="set-hdr"><div>Set</div><div>{unit==='lb'?'Weight (lb)':'Weight (kg)'}</div><div>Reps</div><div>✓</div></div>
              {en.sets.map((s,si)=>
                <div key={si} className={'set-row'+(s.done?' done':'')}>
                  <div className="setno">{si+1}</div>
                  <input type="number" inputMode="decimal" placeholder="—" value={s.weight} onChange={e=>upd(ei,si,'weight',e.target.value)} />
                  <input type="number" inputMode="numeric" placeholder="—" value={s.reps} onChange={e=>upd(ei,si,'reps',e.target.value)} />
                  <button className={'check'+(s.done?' on':'')} onClick={()=>toggleDone(ei,si)}>
                    {s.done ? I.check : (en.sets.length>1 ? <span onClick={(ev)=>{ev.stopPropagation();delSet(ei,si);}} style={{fontSize:18,lineHeight:1}}>×</span> : '')}
                  </button>
                </div>)}
              <div className="set-foot">
                <button className="addset" onClick={()=>addSet(ei)}>{I.plus}<span>Add set</span></button>
                <button className="restbtn" onClick={()=>startRest(ex.name)}>{I.timer}Rest</button>
              </div>
              {en.sets.some(s=>+s.weight>0&&+s.reps>0) &&
                <div style={{textAlign:'center',fontSize:11.5,color:'var(--muted2)',marginTop:8}}>
                  Top est. 1RM this session: <b style={{color:'var(--accent)'}}>{Math.max(...en.sets.map(s=>epley(s.weight,s.reps)))} {unit}</b></div>}
            </div>
          </div>
        );
      })}
      <button className="btn btn-ghost" onClick={onAddExercise} style={{marginTop:4}}>{I.plus}Add exercise</button>
      <button className="btn btn-danger btn-sm" onClick={onDiscard} style={{marginTop:10}}>{I.trash}Discard workout</button>
    </div>
  );
}

/* ============================================================
   RECORDS
   ============================================================ */
function RecordsView({records, exById, logs, unit, onOpen}){
  const ids=Object.keys(records);
  const totalWorkouts=logs.length;
  const totalVol=logs.reduce((n,s)=>n+s.entries.reduce((v,e)=>v+e.sets.reduce((vv,st)=>vv+(+st.weight||0)*(+st.reps||0),0),0),0);
  const weekAgo=new Date(Date.now()-6*864e5).toISOString().slice(0,10);
  const thisWeek=logs.filter(l=>l.date>=weekAgo).length;
  const lastDate=id=>{const s=records[id].sessions;return s[s.length-1].date;};
  const sorted=ids.sort((a,b)=>lastDate(b).localeCompare(lastDate(a)));
  return (
    <div>
      <div className="section-h" style={{marginTop:8}}>Overview</div>
      <div className="stat-grid">
        <div className="stat-card"><div className="v">{totalWorkouts}</div><div className="l">Workouts</div></div>
        <div className="stat-card"><div className="v">{thisWeek}</div><div className="l">This week</div></div>
        <div className="stat-card"><div className="v">{(totalVol/1000).toFixed(1)}k</div><div className="l">{unit} lifted</div></div>
      </div>
      <div className="section-h">Personal Records</div>
      {ids.length===0 ?
        <div className="empty"><div className="ic">{I.trophy}</div><h3>No records yet</h3>
          <p>Log a workout and your estimated 1RMs, heaviest sets, and volume PRs show up here automatically.</p></div>
        :
        sorted.map(id=>{ const ex=exById[id]; if(!ex) return null; const rec=records[id];
          return (
            <div key={id} className="rec-row tap" onClick={()=>onOpen(ex)}>
              <Thumb ex={ex} />
              <div style={{flex:1,minWidth:0}}><div className="ex-name">{ex.name}</div>

          ); })}
    </div>
  );
}

/* ============================================================
   EXERCISE PICKER
   ============================================================ */
function ExercisePicker({exercises, preselected, onClose, onConfirm}){
  const [q,setQ]=useState(''); const [eq,setEq]=useState('All'); const [mus,setMus]=useState('All');
  const [sel,setSel]=useState(()=>new Set(preselected));
  const toggle=id=>{const s=new Set(sel);s.has(id)?s.delete(id):s.add(id);setSel(s);};
  const filtered=exercises.filter(e=>{
    if(q && !e.name.toLowerCase().includes(q.toLowerCase())) return false;
    if(eq!=='All' && e.eq!==eq) return false;
    if(mus!=='All' && e.m!==mus) return false;
    return true;
  });
  const addedCount=[...sel].filter(id=>!preselected.includes(id)).length;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'90vh'}}>
        <div className="sheet-grip"></div>
        <div className="sheet-head"><h2>Add Exercises</h2><button className="x-btn" onClick={onClose}>{I.x}</button></div>
        <div className="sheet-body" style={{paddingTop:12}}>
          <div className="search-wrap" style={{marginTop:0}}>{I.search}<input className="search" placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)} /></div>
          <div className="filter-scroll">{['All',...Object.keys(EQUIP)].map(x=><button key={x} className={'chip'+(eq===x?' on':'')} onClick={()=>setEq(x)}>{x}</button>)}</div>
          <div className="filter-scroll" style={{paddingTop:0,marginBottom:6}}>{['All',...Object.keys(MUSCLE)].map(x=><button key={x} className={'chip'+(mus===x?' on':'')} onClick={()=>setMus(x)} style={mus===x?{}:{color:MUSCLE[x]||'var(--muted)'}}>{x}</button>)}</div>
          {filtered.map(e=>{ const on=sel.has(e.id), already=preselected.includes(e.id);
            return (
              <div key={e.id} className="ex-row tap" onClick={()=>toggle(e.id)} style={on?{borderColor:'var(--accent)',background:'rgba(129,140,248,.07)'}:{}}>
                <Thumb ex={e} />
                <div className="ex-info"><div className="ex-name">{e.name}</div>
                  <div className="ex-sub"><span style={{color:EQUIP[e.eq]?EQUIP[e.eq].c:'#888'}}>{e.eq}</span>·<span style={{color:MUSCLE[e.m]||'#888'}}>{e.m}</span>{already&&on?<span style={{color:'var(--muted2)'}}>· in routine</span>:''}</div></div>
                {on ? <div className="added-badge">{I.check}</div> : <div className="add-circle">{I.plus}</div>}
              </div>
            ); })}
          <div className="selected-count">
            <button className="btn btn-accent" onClick={()=>onConfirm([...sel])}>{I.check}Add {addedCount>0?addedCount+' ':''}exercise{addedCount!==1?'s':''}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

create policy "own row insert" on ironlog_data for insert with check (auth.uid() = user_id);

                :
                <div>
                  <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:10,lineHeight:1.5}}>Connected. Sign in, or create an account to back up & sync your data.</div>
                  <div className="field" style={{marginBottom:10}}><label>Email</label><input type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)} /></div>
                  <div className="field" style={{marginBottom:6}}><label>Password</label><input type="password" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)} /></div>
                  <div className="auth-row">
                    <button className="btn btn-accent btn-sm" disabled={!email.trim()||pw.length<6} style={{opacity:email.trim()&&pw.length>=6?1:.45}} onClick={signIn}>Sign in</button>
                    <button className="btn btn-ghost btn-sm" disabled={!email.trim()||pw.length<6} style={{opacity:email.trim()&&pw.length>=6?1:.45}} onClick={signUp}>Create account</button>
                  </div>
                  <button onClick={onDisconnect} style={{display:'block',margin:'12px auto 0',color:'var(--muted2)',fontSize:12,textDecoration:'underline'}}>Disconnect this project</button>
                </div>}
            {syncStatus && <div className="status-msg">{syncStatus}</div>}
          </div>

          {/* UNITS + DATA */}
          <div className="set-block">
            <h3>{I.gear}General</h3>
            <label style={{display:'block',fontSize:12,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>Weight unit</label>
            <div className="preset-row" style={{marginBottom:16}}>
              <button className={unit==='lb'?'on':''} onClick={()=>setUnit('lb')}>Pounds (lb)</button>
              <button className={unit==='kg'?'on':''} onClick={()=>setUnit('kg')}>Kilograms (kg)</button>
            </div>
            <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm('Reset all local data? This clears your routines and logged history on this device. If you\u2019re signed in to cloud sync, this also overwrites your cloud copy on next sync.')) onResetData(); }}>{I.trash}Reset all data</button>
          </div>

          <div className="attrib">IronLog · data stored locally + optional Supabase sync · exercise media: free-exercise-db (CC0)</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- ============ Register the service worker (enables offline + install) ============ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js')
        .then(function (reg) { console.log('IronLog SW registered:', reg.scope); })
        .catch(function (err) { console.log('IronLog SW registration failed:', err); });
    });
  }
</script>
</body>
</html>
