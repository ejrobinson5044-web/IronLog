            {guided && demo && <div className="workout-demo"><AnimatedDemo demo={demo} /></div>}
            {(tk==='ws'||tk==='r') && (()=>{ const last=rec&&rec.sessions&&rec.sessions.length?rec.sessions[rec.sessions.length-1]:null;
              if(!last||!last.sets||!last.sets.length) return null; const inc=unit==='kg'?2.5:5;
              const work=last.sets; const allHit=work.every(s=>s.r>=8);
              if(tk==='r'){ const mx=Math.max(...work.map(s=>s.r));
                return <div className="po-hint">🎯 Last best <b>{mx} reps</b> — {allHit?'all sets hit 8+, add resistance or progress the movement':'push every set to 8+ reps'}</div>; }
              const w=last.topW;
              return <div className="po-hint">🎯 {allHit
                ? <span>All sets hit 8+ — <b>add weight: {w+inc}×8</b></span>
                : <span>Build every set to <b>8 reps</b> at <b>{w} {unit}</b>, then add weight</span>}</div>; })()}
            <div className="set-table">
              <div className="set-hdr" style={{gridTemplateColumns:cols}}><div>Set</div>{fields.map(f=><div key={f}>{fieldLabel(f,unit)}</div>)}<div>✓</div></div>
              {sets.map((s,si)=>
                <div key={si} className={'set-row'+(s.done?' done':'')} style={{gridTemplateColumns:cols}}>
                  <div className="setno">{si+1}</div>
                  {fields.map(f=><input key={f} type="number" inputMode={fieldMode(f)}
                    placeholder={s[targetKey(f)]!==undefined && s[targetKey(f)]!=='' ? String(s[targetKey(f)]) : '-'}
                    value={s[f]||''} onChange={e=>upd(ei,si,f,e.target.value)} />)}
                  <button className={'check'+(s.done?' on':'')} onClick={()=>toggleDone(ei,si)}>
                    {s.done ? I.check : (sets.length>1 ? <span onClick={(ev)=>{ev.stopPropagation();delSet(ei,si);}} style={{fontSize:18,lineHeight:1}}>×</span> : '')}
                  </button>
                </div>)}
              <div className="set-foot">
                <button className="addset" onClick={()=>addSet(ei)}>{I.plus}<span>Add set</span></button>
                <button className="restbtn" onClick={()=>startRest(ex.name)}>{I.timer}Rest</button>
              </div>
              {tk==='ws' && sets.some(s=>+s.weight>0&&+s.reps>0) &&
                <div style={{textAlign:'center',fontSize:11.5,color:'var(--muted2)',marginTop:8}}>
                  Top est. 1RM this session: <b style={{color:'var(--accent)'}}>{Math.max(...sets.map(s=>epley(s.weight,s.reps)))} {unit}</b></div>}
              <input className="ex-note" placeholder="Notes — seat height, pin, grip, how it felt…" value={en.note||''} onChange={e=>updNote(ei,e.target.value)} />
            </div>
          </div>
        );
          })}
        </div>
        );
      })}
      {!guided && entries.length>1 &&
        <button className="btn btn-ghost" onClick={()=>setShowReorder(true)} style={{marginTop:4}}>{I.grip}Reorder exercises</button>}
      <button className="btn btn-ghost" onClick={onAddExercise} style={{marginTop:4}}>{I.plus}Add exercise</button>
      <button className="btn btn-danger btn-sm" onClick={onDiscard} style={{marginTop:10}}>{I.trash}Discard workout</button>
      {showReorder && <WorkoutReorderSheet entries={entries} exById={exById}
        onClose={()=>setShowReorder(false)} onApply={applyReorder} />}
      {swapFor!=null && <SwapSheet current={exById[(entries[swapFor]||{}).exerciseId]} exercises={exercises}
        onClose={()=>setSwapFor(null)} onSwap={(id)=>{ doSwap(swapFor,id); setSwapFor(null); }} />}
    </div>
  );
}

function CalendarView({logs, measurements, exById, unit, onOpenMeasure}){
  const today=todayISO();
  const [view,setView]=useState(()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; });
  const [sel,setSel]=useState(today);
  const workoutDates=useMemo(()=>{ const s={}; logs.forEach(l=>{ s[l.date]=(s[l.date]||0)+1; }); return s; },[logs]);
  const measByDate=useMemo(()=>{ const s={}; measurements.forEach(m=>{ s[m.date]=m; }); return s; },[measurements]);
  const first=new Date(view.y, view.m, 1);
  const startDow=first.getDay();
  const daysIn=new Date(view.y, view.m+1, 0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++) cells.push(null); for(let d=1;d<=daysIn;d++) cells.push(d);
  const pad=n=>String(n).padStart(2,'0');
  const dstr=d=>`${view.y}-${pad(view.m+1)}-${pad(d)}`;
  const monthLabel=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const prev=()=>setView(v=>{ const m=v.m-1; return m<0?{y:v.y-1,m:11}:{y:v.y,m}; });
  const next=()=>setView(v=>{ const m=v.m+1; return m>11?{y:v.y+1,m:0}:{y:v.y,m}; });
  const selWorkouts=logs.filter(l=>l.date===sel);
  const selMeas=measByDate[sel];
  return (
    <div>
      <div className="cal-head">
        <button onClick={prev} className="cal-nav">‹</button>
        <div className="cal-title">{monthLabel}</div>
        <button onClick={next} className="cal-nav">›</button>
      </div>
      <div className="cal-dow">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d}>{d}</div>)}</div>
      <div className="cal-grid">
        {cells.map((d,i)=>{ if(d===null) return <div key={'b'+i} className="cal-cell empty"></div>;
          const ds=dstr(d); const hasW=workoutDates[ds]; const hasM=measByDate[ds];
          return (
            <button key={ds} className={'cal-cell'+(ds===sel?' sel':'')+(ds===today?' today':'')} onClick={()=>setSel(ds)}>
              <span className="cal-num">{d}</span>
              <span className="cal-dots">{hasW?<span className="cal-dot w"></span>:null}{hasM?<span className="cal-dot m"></span>:null}</span>
            </button>
          ); })}
      </div>
      <div className="cal-legend"><span><span className="cal-dot w"></span> Workout</span><span><span className="cal-dot m"></span> Measurements</span></div>
      <div className="section-h" style={{marginTop:6}}>{new Date(sel+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>
      {selWorkouts.length===0 && !selMeas &&
        <p style={{color:'var(--muted)',fontSize:13.5,padding:'4px 2px 12px'}}>Nothing logged this day.</p>}
      {selWorkouts.map((w,wi)=>(
        <div key={wi} className="cal-log">
          <div className="cal-log-h">{I.flame}<b>{w.name||'Workout'}</b></div>
          {w.entries.map((en,ei)=>{ const ex=exById[en.exerciseId]; const tk=trackOf(ex);
            const done=en.sets.filter(s=>setHasData(tk,s)); const n=done.length||en.sets.length;
            return <div key={ei} className="cal-ex">{ex?ex.name:'Exercise'} <span>· {n} set{n!==1?'s':''}</span></div>; })}
          {w.note && <div className="cal-note">🗒 {w.note}</div>}
        </div>
      ))}
      {selMeas ?
        <div className="cal-log">
          <div className="cal-log-h">{I.ruler}<b>Measurements</b><button className="rc-edit" style={{marginLeft:'auto'}} onClick={()=>onOpenMeasure(sel, selMeas)}>Edit</button></div>
          <div className="meas-readout">{MEAS_FIELDS.filter(f=>selMeas[f.k]!=null).map(f=>
            <div key={f.k}><span>{f.label}</span><b>{selMeas[f.k]}{f.u==='%'?'%':(' '+measUnitFor(f,unit))}</b></div>)}</div>
          {selMeas.note && <div className="cal-note">🗒 {selMeas.note}</div>}
        </div>
        :
        <button className="btn btn-ghost btn-sm" style={{marginBottom:14}} onClick={()=>onOpenMeasure(sel, null)}>{I.ruler}Log measurements for this day</button>}
    </div>
  );
}

function MeasurementsSheet({date, entry, last, unit, onClose, onSave}){
  const src = entry || last || {};
  const [vals,setVals]=useState(()=>{ const o={}; MEAS_FIELDS.forEach(f=>o[f.k]=src[f.k]!=null?String(src[f.k]):''); return o; });
  const [note,setNote]=useState(entry?entry.note||'':'');
  const set=(k,v)=>setVals(o=>({...o,[k]:v}));
  const anyVal = MEAS_FIELDS.some(f=>vals[f.k]!=='' && !isNaN(parseFloat(vals[f.k])));
  const save=()=>{ const m={ id: entry?entry.id:uid(), date };
    MEAS_FIELDS.forEach(f=>{ const v=parseFloat(vals[f.k]); if(!isNaN(v)) m[f.k]=v; });
    if(note.trim()) m.note=note.trim(); onSave(m); };
  const dlabel=new Date(date+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'90vh'}}>
        <div className="sheet-grip"></div>
        <div className="sheet-head"><h2>{entry?'Edit Measurements':'Log Measurements'}</h2><div style={{display:'flex',alignItems:'center',gap:8}}><button className="rc-edit" disabled={!anyVal} style={{opacity:anyVal?1:.45}} onClick={save}>{I.check}Save</button><button className="x-btn" onClick={onClose}>{I.x}</button></div></div>
        <div className="sheet-body">
          <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:12}}>{dlabel}{(!entry&&last)?' · pre-filled from your last entry':''}</div>
          <div className="meas-grid">
            {MEAS_FIELDS.map(f=>(
              <div key={f.k} className="meas-field">
                <label>{f.label}</label>
                <div className="meas-in"><input type="number" inputMode="decimal" placeholder="—" value={vals[f.k]} onChange={e=>set(f.k,e.target.value)} /><span>{measUnitFor(f,unit)}</span></div>
              </div>
            ))}
          </div>
          <div className="field" style={{marginTop:14}}><label>Note (optional)</label><input placeholder="e.g. morning, fasted" value={note} onChange={e=>setNote(e.target.value)} /></div>
        </div>
      </div>
    </div>
  );
}

function RecordsView({records, exById, logs, unit, onOpen, onOpenCalendar}){
  const ids=Object.keys(records);
  const totalWorkouts=logs.length;
  const totalVol=logs.reduce((n,s)=>n+s.entries.reduce((v,e)=>v+e.sets.reduce((vv,st)=>vv+(+st.weight||0)*(+st.reps||0),0),0),0);
  const weekAgo=new Date(Date.now()-6*864e5).toISOString().slice(0,10);
  const thisWeek=logs.filter(l=>l.date>=weekAgo).length;
  const lastDate=id=>{const s=records[id].sessions;return s[s.length-1].date;};
  const sorted=ids.sort((a,b)=>lastDate(b).localeCompare(lastDate(a)));
  return (
    <div>
      <div className="section-h" style={{marginTop:8}}><span>Overview</span><button className="mini-link" onClick={onOpenCalendar}>{I.calendar}Calendar</button></div>
      <div className="stat-grid">
        <div className="stat-card"><div className="v">{totalWorkouts}</div><div className="l">Workouts</div></div>
        <div className="stat-card"><div className="v">{thisWeek}</div><div className="l">This week</div></div>
        <div className="stat-card"><div className="v">{(totalVol/1000).toFixed(1)}k</div><div className="l">{unit} lifted</div></div>
      </div>
      <div className="section-h">Personal Records</div>
      {ids.length===0 ?
        <div className="empty"><div className="ic">{I.trophy}</div><h3>No records yet</h3>
          <p>Log a workout and your estimated 1RMs, heaviest sets, and volume PRs show up here automatically.</p></div>
        :
        sorted.map(id=>{ const ex=exById[id]; if(!ex) return null; const rec=records[id]; const mi=metricInfo(rec.track,unit);
          return (
            <div key={id} className="rec-row tap" onClick={()=>onOpen(ex)}>
              <Thumb ex={ex} />
              <div style={{flex:1,minWidth:0}}><div className="ex-name">{ex.name}</div>
                <div className="ex-sub">{rec.count} session{rec.count!==1?'s':''}{(rec.track==='ws'||rec.track==='wt')?<span> · heaviest <b>{rec.maxW}{unit}</b></span>:''}</div></div>
              <div className="rec-1rm"><div className="n">{rec.best}</div><div className="u">{mi.label}{mi.suffix?' ('+mi.suffix.trim()+')':''}</div></div>
            </div>
          ); })}
    </div>
  );
}

function ProgressionTool({rec, unit, track}){
  const base = rec && rec.best ? rec.best : 0;
  const [orm,setOrm]=useState(base?String(base):'');
  const [repsIn,setRepsIn]=useState('5');
  const [wIn,setWIn]=useState(base?String(Math.round(base*0.8/5)*5):'');
  const O=+orm||0;
  const r2=(x)=>{ const v=Math.round(x/2.5)*2.5; return v%1===0?String(v):v.toFixed(1); };
  const wForReps=(r)=> (O<=0||r<=0) ? '–' : (r<=1 ? String(Math.round(O)) : r2(O/(1+r/30)));
  const rForWeight=(w)=>{ if(O<=0||w<=0||w>O) return '–'; return String(Math.max(1, Math.round(30*(O/w-1)))); };
  const last = rec && rec.sessions && rec.sessions.length ? rec.sessions[rec.sessions.length-1] : null;
  const inc = unit==='kg'?2.5:5;
  const tblReps=[1,2,3,5,8,10,12];
  const work = last && last.sets ? last.sets : [];
  const allHit = work.length>0 && work.every(s=>s.r>=8);
  const below = work.filter(s=>s.r<8).length;
  return (
    <div>
      {track==='ws' && <div>
      <div className="section-h" style={{margin:'10px 0 8px'}}>Strength Calculator</div>
      <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:14}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <label style={{fontSize:12.5,color:'var(--muted)',fontWeight:700}}>Your 1RM</label>
          <input type="number" inputMode="decimal" value={orm} onChange={e=>setOrm(e.target.value)} placeholder="—"
            style={{width:92,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:9,padding:'8px 10px',color:'var(--text)',fontFamily:'var(--display)',fontWeight:800,fontSize:18,outline:'none'}} />
          <span style={{fontSize:12.5,color:'var(--muted)'}}>{unit}</span>
          {base>0 && +orm!==base && <button onClick={()=>setOrm(String(base))} style={{marginLeft:'auto',fontSize:11,color:'var(--accent)',fontWeight:700}}>reset to {base}</button>}
        </div>
        <div style={{fontSize:11,color:'var(--muted2)',margin:'7px 0 12px',lineHeight:1.4}}>
          {base>0?'Estimated from your best logged set (Epley). Edit it to model any max.':'No logged sets yet — type a 1RM to model targets.'}</div>
        <table className="calc-tbl"><thead><tr><th>Reps</th><th>Weight</th><th>% 1RM</th></tr></thead>
          <tbody>{tblReps.map(r=>{ const w=wForReps(r); const pct=(O>0&&w!=='–')?Math.round((+w/O)*100):'–';
            return <tr key={r}><td><b>{r}</b></td><td>{w==='–'?'–':w+' '+unit}</td><td style={{color:'var(--muted)'}}>{pct==='–'?'–':pct+'%'}</td></tr>; })}</tbody>
        </table>
        <div className="calc-row"><span>Lift</span>
          <input type="number" inputMode="numeric" value={repsIn} onChange={e=>setRepsIn(e.target.value)} className="calc-in" />
          <span>reps →</span><b style={{color:'var(--accent)'}}>{wForReps(+repsIn)}{wForReps(+repsIn)!=='–'?' '+unit:''}</b></div>
        <div className="calc-row"><span>At</span>
          <input type="number" inputMode="decimal" value={wIn} onChange={e=>setWIn(e.target.value)} className="calc-in" />
          <span>{unit} →</span><b style={{color:'var(--accent)'}}>{rForWeight(+wIn)}{rForWeight(+wIn)!=='–'?' reps':''}</b></div>
      </div></div>}
      {last && work.length>0 &&
        <div className="po-box">
          <div className="po-h">🎯 Progressive overload — 8-rep rule</div>
          {track==='ws' ? <>
            <div style={{fontSize:13,marginBottom:8}}>Last session at <b>{last.topW} {unit}</b>: {work.map(s=>s.r).join(', ')} rep{work.length!==1?'s':''} across {work.length} set{work.length!==1?'s':''}.</div>
            {allHit
              ? <><div className="po-opt"><span>✅ All sets hit 8+ — level up</span><b>{last.topW+inc} × 8</b></div>
                  <div style={{fontSize:11,color:'var(--muted2)',marginTop:8,lineHeight:1.45}}>Add {inc} {unit}, drop back to whatever reps you get, and build to 8×all-sets again.</div></>
              : <><div className="po-opt"><span>Stay at this weight</span><b>{last.topW} × 8</b></div>
                  <div style={{fontSize:11,color:'var(--muted2)',marginTop:8,lineHeight:1.45}}>{below} set{below!==1?'s':''} still under 8 reps. Hit <b>8 on every set</b>, then add {inc} {unit} next time.</div></>}
          </> : <>
            <div style={{fontSize:13,marginBottom:8}}>Last session: {work.map(s=>s.r).join(', ')} reps.</div>
            {allHit
              ? <div style={{fontSize:12.5}}>✅ All sets hit 8+ — progress the movement (harder variation, add load, or slow the tempo).</div>
              : <div style={{fontSize:12.5}}>Push every set to <b>8 reps</b> before making it harder.</div>}
          </>}
        </div>}
    </div>
  );
}

        <div className="sheet-head"><h2>{ed?'Edit Exercise':'New Exercise'}</h2><div style={{display:'flex',alignItems:'center',gap:8}}><button className="rc-edit" disabled={!valid} style={{opacity:valid?1:.45}} onClick={()=>valid&&onSave({name:finalName,eq,m,sec:sec||undefined,cue:cue.trim()||undefined,media:media.trim(),track,side})}>{I.check}{ed?'Save':'Create'}</button><button className="x-btn" onClick={onClose}>{I.x}</button></div></div>
        <div className="sheet-body">
          <div className="field"><label>Name</label>
            <input placeholder="e.g. Smith Machine Squat" value={name} onChange={e=>setName(e.target.value)} autoFocus={!ed} />
            <div style={{fontSize:11.5,color:'var(--muted2)',marginTop:6}}>Tip: name it <b style={{color:'var(--muted)'}}>Equipment + Movement</b> to match the library.</div></div>
          <div className="field"><label>Tracks</label><div className="seg">{Object.keys(TRACK).map(x=><button key={x} className={track===x?'on':''} onClick={()=>setTrack(x)}>{TRACK[x].label}</button>)}</div>
            <div style={{fontSize:11.5,color:'var(--muted2)',marginTop:6}}>What you log per set — weights, bodyweight reps, a hold/time, a run’s distance &amp; time, etc.</div></div>
          <div className="field"><label>Variation</label><div className="seg">
            <button className={side===''?'on':''} onClick={()=>setSide('')}>Standard</button>
            <button className={side==='arm'?'on':''} onClick={()=>setSide('arm')}>One Arm</button>
            <button className={side==='leg'?'on':''} onClick={()=>setSide('leg')}>One Leg</button>
          </div></div>
          <div className="field"><label>Equipment</label><div className="seg">{Object.keys(EQUIP).map(x=><button key={x} className={eq===x?'on':''} onClick={()=>setEq(x)}>{x}</button>)}</div></div>
          <div className="field"><label>Primary muscle</label><div className="seg">{Object.keys(MUSCLE).map(x=><button key={x} className={m===x?'on':''} onClick={()=>setM(x)}>{x}</button>)}</div></div>
          <div className="field"><label>Secondary muscle (optional)</label><div className="seg">
            <button className={sec===''?'on':''} onClick={()=>setSec('')}>None</button>
            {Object.keys(MUSCLE).filter(x=>x!==m).map(x=><button key={x} className={sec===x?'on':''} onClick={()=>setSec(x)}>{x}</button>)}</div></div>
          <div className="field"><label>Form cue / notes (optional)</label>
            <textarea rows="2" placeholder="Anything you want to remember…" value={cue} onChange={e=>setCue(e.target.value)}></textarea></div>
          <div className="field"><label>Image / video URL (optional)</label>
            <input placeholder="https://…/demo.gif, .jpg or .mp4" value={media} onChange={e=>setMedia(e.target.value)} />
            <div style={{fontSize:11.5,color:'var(--muted2)',marginTop:6}}>Paste a link to your own hosted media and it displays on the exercise.</div></div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================\n   ROUTINE EDITOR
   ============================================================ */
const WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const isAutoName=(nm)=> /^Day \d+$/i.test(nm||'') || WEEKDAYS.includes(nm);
const posLabel=(i,mode)=> mode==='week' ? WEEKDAYS[i%7] : ('Day '+(i+1));
const dayLabel=(day,i,mode)=> (day&&day.name) ? (posLabel(i,mode)+' · '+day.name) : posLabel(i,mode);
function RoutineEditor({routine, exById, exercises, logs, restDefault, onCreateExercise, onClose, onSave, onDelete}){
  const editing=!!routine;
  const [name,setName]=useState(routine?routine.name:'');
  const [note,setNote]=useState(routine?routine.note||'':'');
  const [labelMode,setLabelMode]=useState(routine?(routine.labelMode||'num'):'num');
  const [days,setDays]=useState(routine? clone(routine.days||[]) : [{id:uid(),name:'',exerciseIds:[]}]);
  const [dayIdx,setDayIdx]=useState(null);
  const valid = !!name.trim();
  const addDay=()=> setDays([...days, {id:uid(), name:'', exerciseIds:[]}]);
  const renameDay=(i,v)=>{ const a=clone(days); a[i].name=v; setDays(a); };
  const delDay=(i)=> setDays(days.filter((_,j)=>j!==i));
  const moveDay=(i,dir)=>{ const j=i+dir; if(j<0||j>=days.length) return; const a=clone(days); [a[i],a[j]]=[a[j],a[i]]; setDays(a); };
  const saveDay=(updated)=>{ const a=clone(days); a[dayIdx]=updated; setDays(a); setDayIdx(null); };
  const saveRoutineEdits=()=>valid&&onSave({id:routine?routine.id:uid(),name:name.trim(),note:note.trim(),labelMode,days});
  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-grip"></div>
        <div className="sheet-head"><h2>{editing?'Edit Routine':'New Routine'}</h2><div style={{display:'flex',alignItems:'center',gap:8}}><button className="rc-edit" disabled={!valid} style={{opacity:valid?1:.45}} onClick={saveRoutineEdits}>{I.check}{editing?'Save':'Create'}</button><button className="x-btn" onClick={onClose}>{I.x}</button></div></div>
        <div className="sheet-body">
          <div className="field"><label>Routine name</label><input placeholder="e.g. Injury Recovery Program" value={name} onChange={e=>setName(e.target.value)} autoFocus={!editing} /></div>
          <div className="field"><label>Note (optional)</label><input placeholder="e.g. 7-day split — rebuilding after the knee" value={note} onChange={e=>setNote(e.target.value)} /></div>
          <div className="field"><label>Day labels</label>
            <div className="unit-toggle" style={{display:'inline-flex'}}>
              <button className={labelMode==='num'?'on':''} onClick={()=>setLabelMode('num')}>Numbered</button>
              <button className={labelMode==='week'?'on':''} onClick={()=>setLabelMode('week')}>Weekday</button>
            </div>
            <div style={{fontSize:11.5,color:'var(--muted2)',marginTop:7,lineHeight:1.45}}>
              {labelMode==='week'?'Each slot is a weekday (Sunday → Saturday). ':'Each slot is numbered by order (Day 1, Day 2, …). '}Add an optional name like “Legs” — the position stays fixed, and reordering renumbers automatically.
            </div>
          </div>
          <div className="section-h" style={{margin:'4px 0 10px'}}><span>Days ({days.length})</span>
            <button onClick={addDay} style={{color:'var(--accent)',fontSize:12,fontFamily:'var(--display)',fontWeight:700}}>+ Add day</button></div>
          {days.map((d,i)=>(
            <div key={d.id} className="day-edit">
              <div className="day-edit-top">
                <div style={{display:'flex',flexDirection:'column',gap:2}}>
                  <button onClick={()=>moveDay(i,-1)} style={{color:i===0?'var(--muted2)':'var(--muted)',padding:'1px 5px',fontSize:11}}>▲</button>
                  <button onClick={()=>moveDay(i,1)} style={{color:i===days.length-1?'var(--muted2)':'var(--muted)',padding:'1px 5px',fontSize:11}}>▼</button>
                </div>
                <span className="day-pos">{posLabel(i,labelMode)}</span>
                <input className="day-name-input" placeholder="Optional name — e.g. Legs, Push" value={d.name||''} onChange={e=>renameDay(i,e.target.value)} />
                <button className="delset" onClick={()=>delDay(i)}>{I.trash}</button>
              </div>
              <div className="day-edit-meta">{d.exerciseIds.length} exercise{d.exerciseIds.length!==1?'s':''} · ~{estimateMinutes(d.exerciseIds, logs, restDefault)} min</div>
              <button className="btn btn-ghost btn-sm" onClick={()=>setDayIdx(i)}>{I.dumbbell}Edit exercises</button>
            </div>
          ))}
          <button className="btn btn-ghost btn-sm" onClick={addDay} style={{marginTop:4}}>{I.plus}Add a day</button>
          {!days.some(d=>d.exerciseIds.length>0) && <div style={{fontSize:11.5,color:'var(--muted2)',textAlign:'center',marginTop:8}}>Tip: you can save now with empty days and add exercises later.</div>}
          {editing && <button className="btn btn-danger btn-sm" style={{marginTop:10}} onClick={()=>onDelete(routine.id)}>{I.trash}Delete routine</button>}
        </div>
      </div>
      {dayIdx!==null &&
        <DayEditor day={days[dayIdx]} exById={exById} exercises={exercises} logs={logs} restDefault={restDefault} onCreate={onCreateExercise}
          onClose={()=>setDayIdx(null)} onSave={saveDay} />}
    </div>
  );
}

/* edits a single day inside a routine (name + its exercises) */
function DayEditor({day, exById, exercises, logs, restDefault, onCreate, onClose, onSave}){
  const [name,setName]=useState(day.name||'');
  const [ids,setIds]=useState(()=>asArray(day.exerciseIds));
  const [picking,setPicking]=useState(false);
  const [created,setCreated]=useState([]);
  const localExercises=useMemo(()=>{
    const map={};
    [...asArray(created), ...asArray(exercises)].forEach(ex=>{ if(ex&&ex.id&&!map[ex.id]) map[ex.id]=ex; });
    return Object.values(map);
  },[created, exercises]);
  const localExById=useMemo(()=>{
    const map={...exById};
    asArray(created).forEach(ex=>{ if(ex&&ex.id) map[ex.id]=ex; });
    return map;
  },[exById, created]);
  const {dragId, handleProps, rowProps}=useDragReorder({ids, onMove:reorderMove(setIds)});
  const stopButton=e=>e.stopPropagation();
  const remove=id=>{ setIds(ids.filter(x=>x!==id)); };
  const delBtnProps=(id)=>({ onClick:(e)=>{ e.stopPropagation(); remove(id); } });
  const saveDayEdits=()=>onSave({...day, name:(name.trim()||day.name||'Day'), exerciseIds:ids});
  const handleCreate=(payload)=>{
    const ex=onCreate&&onCreate(payload);
    if(ex&&ex.id) setCreated(curr=>[ex, ...asArray(curr).filter(x=>x&&x.id!==ex.id)]);
    return ex;
  };
  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-grip"></div>
        <div className="sheet-head"><h2>Edit Day</h2><div style={{display:'flex',alignItems:'center',gap:8}}><button className="rc-edit" onClick={saveDayEdits}>{I.check}Done</button><button className="x-btn" onClick={onClose}>{I.x}</button></div></div>
        <div className="sheet-body">
          <div className="field"><label>Day name</label><input placeholder="e.g. Push, Pull, Legs, Arms" value={name} onChange={e=>setName(e.target.value)} /></div>
          <div className="section-h" style={{margin:'4px 0 10px'}}><span>Exercises ({ids.length})</span>
            <button onClick={()=>setPicking(true)} style={{color:'var(--accent)',fontSize:12,fontFamily:'var(--display)',fontWeight:700}}>+ Add</button></div>
          {ids.length===0 ?
            <div style={{textAlign:'center',padding:'24px 10px',color:'var(--muted)',fontSize:13.5}}>No exercises yet. Tap <b style={{color:'var(--accent)'}}>+ Add</b> to pull from your library.</div>
            :
            ids.map((id,i)=>{ const ex=localExById[id]; if(!ex) return (
                <div key={id} className={'ex-row reorder-row'+(dragId===id?' dragging':'')} style={{marginBottom:8,opacity:.78}} {...rowProps(id)}>
                  <div className="reorder-handle" title="Drag to reorder" aria-hidden="true" {...handleProps(id)}>{I.grip}</div>
                  <div className="ex-info"><div className="ex-name">Missing exercise</div>
                    <div className="ex-sub">This slot points to an exercise that is no longer in your library.</div></div>
                  <button className="delset" {...delBtnProps(id)}>{I.trash}</button>
                </div>
              );
              const dragging=dragId===id;
              return (
                <div key={id} className={'ex-row reorder-row'+(dragging?' dragging':'')} style={{marginBottom:8}} {...rowProps(id)}>
                  <div className="reorder-handle" title="Drag to reorder" aria-hidden="true" {...handleProps(id)}>{I.grip}</div>
                  <Thumb ex={ex} cls="" />
                  <div className="ex-info"><div className="ex-name">{ex.name}</div>
                    <div className="ex-sub"><span style={{color:EQUIP[ex.eq]?EQUIP[ex.eq].c:'#888'}}>{ex.eq}</span>·<span style={{color:MUSCLE[ex.m]||'#888'}}>{ex.m}</span>{sideOf(ex)&&<span style={{color:'var(--accent)'}}>· {sideLabel(ex)}</span>}</div></div>
                  <button className="delset" {...delBtnProps(id)}>{I.trash}</button>
                </div>
              ); })}
          {ids.length>0 &&
            <div>
              <div className="section-h" style={{margin:'20px 0 10px'}}>Muscles Worked</div>
              <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:'11px 14px',marginBottom:14,fontSize:13.5}}>
                {I.timer}<span style={{color:'var(--muted)'}}>Estimated time</span>
                <b style={{marginLeft:'auto',fontFamily:'var(--display)',fontSize:16,color:'var(--accent)'}}>~{estimateMinutes(ids, logs, restDefault)} min</b>
              </div>
              <MuscleBreakdown exerciseIds={ids} exById={localExById} />
            </div>}
        </div>
      </div>
      {picking && <ExercisePicker exercises={localExercises} preselected={ids} onClose={()=>setPicking(false)} onCreate={handleCreate} onConfirm={(sel)=>{setIds([...new Set([...ids,...sel])]);setPicking(false);}} />}
    </div>
  );
}

/* ============================================================\n   EXERCISE PICKER
   ============================================================ */
function ExercisePicker({exercises, preselected, onClose, onConfirm, onCreate}){
  const safeExercises=asArray(exercises).filter(e=>e&&e.id&&e.name);
  const selectedIds=asArray(preselected);
  const [q,setQ]=useState(''); const [eq,setEq]=useState('All'); const [mus,setMus]=useState('All');
  const [sel,setSel]=useState(()=>new Set(selectedIds));
  const [creating,setCreating]=useState(false);
  const toggle=id=>{const s=new Set(sel);s.has(id)?s.delete(id):s.add(id);setSel(s);};
  const filtered=safeExercises.filter(e=>{
    if(q && !e.name.toLowerCase().includes(q.toLowerCase())) return false;
    if(eq!=='All' && e.eq!==eq) return false;
    if(mus!=='All' && e.m!==mus) return false;
    return true;
  });
  const addedCount=[...sel].filter(id=>!selectedIds.includes(id)).length;
  const handleCreated=(e)=>{ const ex=onCreate&&onCreate(e); if(ex&&ex.id){ const s=new Set(sel); s.add(ex.id); setSel(s); } setCreating(false); };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'90vh'}}>
        <div className="sheet-grip"></div>
        <div className="sheet-head"><h2>Add Exercises</h2><button className="x-btn" onClick={onClose}>{I.x}</button></div>
        <div className="sheet-body" style={{paddingTop:12}}>
          <div className="search-wrap" style={{marginTop:0}}>{I.search}<input className="search" placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)} /></div>
          {onCreate && <button className="create-ex-btn" onClick={()=>setCreating(true)}>{I.plus}<span>Can’t find it? Create a new exercise</span></button>}
          <div className="filter-scroll">{['All',...Object.keys(EQUIP)].map(x=><button key={x} className={'chip'+(eq===x?' on':'')} onClick={()=>setEq(x)}>{x}</button>)}</div>
          <div className="filter-scroll" style={{paddingTop:0,marginBottom:6}}>{['All',...Object.keys(MUSCLE)].map(x=><button key={x} className={'chip'+(mus===x?' on':'')} onClick={()=>setMus(x)} style={mus===x?{}:{color:MUSCLE[x]||'var(--muted)'}}>{x}</button>)}</div>
          {filtered.length===0 &&
            <div style={{textAlign:'center',padding:'22px 12px'}}>
              <div style={{color:'var(--muted)',fontSize:13.5,marginBottom:12}}>No exercises match{q?<span> “<b style={{color:'var(--text)'}}>{q}</b>”</span>:''}.</div>
              {onCreate && <button className="btn btn-accent" onClick={()=>setCreating(true)}>{I.plus}Create {q?'“'+q+'”':'a new exercise'}</button>}
            </div>}
          {filtered.map(e=>{ const on=sel.has(e.id), already=selectedIds.includes(e.id);
            return (
              <div key={e.id} className="ex-row tap" onClick={()=>toggle(e.id)} style={on?{borderColor:'var(--accent)',background:'rgba(168,85,247,.07)'}:{}}>
                <Thumb ex={e} />
                <div className="ex-info"><div className="ex-name">{e.name}</div>
                  <div className="ex-sub"><span style={{color:EQUIP[e.eq]?EQUIP[e.eq].c:'#888'}}>{e.eq}</span>·<span style={{color:MUSCLE[e.m]||'#888'}}>{e.m}</span>{sideOf(e)&&<span style={{color:'var(--accent)'}}>· {sideLabel(e)}</span>}{already&&on?<span style={{color:'var(--muted2)'}}>· in routine</span>:''}</div></div>
                {on ? <div className="added-badge">{I.check}</div> : <div className="add-circle">{I.plus}</div>}
              </div>
            ); })}
          <div className="selected-count">
            <button className="btn btn-accent" onClick={()=>onConfirm([...sel])}>{I.check}Add {addedCount>0?addedCount+' ':''}exercise{addedCount!==1?'s':''}</button>
          </div>
        </div>
      </div>
      {creating && <NewExerciseSheet initialName={q} onClose={()=>setCreating(false)} onSave={handleCreated} />}
    </div>
  );
}

/* ============================================================
   SETTINGS  (rest timer + cloud sync + data)
   ============================================================ */
function SettingsSheet({onClose, unit, setUnit, restDefault, setRestDefault,
  sbUrl, sbKey, session, syncStatus, setSyncStatus, lastSync, clientRef,
  onConnect, onDisconnect, onSyncNow, onResetData}){
  const configured = !!(sbUrl && sbKey);
  const [url,setUrl]=useState(sbUrl); const [key,setKey]=useState(sbKey);
  const [email,setEmail]=useState(''); const [pw,setPw]=useState('');
  const presets=[60,90,120,180];

  const sdkMissing = typeof supabase==='undefined' || !supabase.createClient;

  const signIn=async()=>{ try{ setSyncStatus('Signing in…'); const {error}=await clientRef.current.auth.signInWithPassword({email:email.trim(),password:pw}); if(error){setSyncStatus(error.message);return;} setSyncStatus('Signed in ✓'); }catch(e){ setSyncStatus('Error: '+(e.message||e)); } };
  const signUp=async()=>{ try{ setSyncStatus('Creating account…'); const {data,error}=await clientRef.current.auth.signUp({email:email.trim(),password:pw}); if(error){setSyncStatus(error.message);return;} if(data.session) setSyncStatus('Account created ✓'); else setSyncStatus('Account created — check your email to confirm, then sign in. (Or disable email confirmation in Supabase for instant login.)'); }catch(e){ setSyncStatus('Error: '+(e.message||e)); } };
  const signOut=async()=>{ try{ await clientRef.current.auth.signOut(); setSyncStatus('Signed out. Your data stays on this device.'); }catch(e){} };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-grip"></div>
        <div className="sheet-head"><h2>Settings</h2><button className="x-btn" onClick={onClose}>{I.x}</button></div>
        <div className="sheet-body">

          {/* REST TIMER */}
          <div className="set-block">
            <h3>{I.timer}Rest timer</h3>
            <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:12,lineHeight:1.5}}>Auto-starts when a set is completed. You can still tap <b style={{color:'var(--accent)'}}>Rest</b> on any exercise. Adjust the default below.</div>
            <div className="rest-stepper">
              <button onClick={()=>setRestDefault(Math.max(10, restDefault-15))}>−</button>
              <div className="val">{Math.floor(restDefault/60)}:{String(restDefault%60).padStart(2,'0')}</div>
              <button onClick={()=>setRestDefault(Math.min(600, restDefault+15))}>+</button>
            </div>
            <div className="preset-row">{presets.map(p=><button key={p} className={restDefault===p?'on':''} onClick={()=>setRestDefault(p)}>{p<120?p+'s':(p/60)+'m'+(p%60?' '+(p%60)+'s':'')}</button>)}</div>
          </div>

          {/* CLOUD SYNC */}
          <div className="set-block">
            <h3>{I.cloud}Cloud sync</h3>
            {sdkMissing &&
              <div className="status-msg">The sync library didn\u2019t load in this preview (it\u2019s often blocked here). It loads fine once you open the file in a normal browser or host it on GitHub Pages.</div>}

            {!configured ?
              <div>
                <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:12,lineHeight:1.5}}>Connect a free Supabase project to sync across devices. Paste your project URL and anon key:</div>
                <div className="field" style={{marginBottom:10}}><label>Project URL</label><input placeholder="https://xxxx.supabase.co" value={url} onChange={e=>setUrl(e.target.value)} /></div>
                <div className="field" style={{marginBottom:10}}><label>Anon public key</label><input placeholder="eyJhbGciOi…" value={key} onChange={e=>setKey(e.target.value)} /></div>
                <button className="btn btn-accent btn-sm" disabled={!url.trim()||!key.trim()} style={{opacity:url.trim()&&key.trim()?1:.45}} onClick={()=>onConnect(url.trim(),key.trim())}>{I.cloud}Connect</button>
                <details className="help"><summary>How do I get these? (2-min setup)</summary>
                  <ol>
                    <li>Create a free account at supabase.com and make a new project.</li>
                    <li>In the project: <b>Settings → API</b>. Copy the <b>Project URL</b> and the <b>anon public</b> key into the fields above.</li>
                    <li>Open <b>SQL Editor</b>, paste the snippet below, and hit Run. This creates your data table with row-level security so only you can read your data.</li>
                    <li>(Optional, for instant login) <b>Authentication → Providers → Email</b>: turn off "Confirm email".</li>
                    <li>Back here: connect, then create an account with any email + password.</li>
                  </ol>
                  <pre>{`create table if not exists ironlog_data (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table ironlog_data enable row level security;
create policy "own row read"   on ironlog_data for select using (auth.uid() = user_id);
create policy "own row insert" on ironlog_data for insert with check (auth.uid() = user_id);
create policy "own row update" on ironlog_data for update using (auth.uid() = user_id);`}</pre>
                </details>
              </div>
              :
              session ?
                <div>
                  <div className="acct-pill">
                    <div className="av">{(session.user.email||'U')[0].toUpperCase()}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13.5,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{session.user.email}</div>
                      <div style={{fontSize:11,color:'var(--good)',fontWeight:700}}>● Synced{lastSync?' · '+new Date(lastSync).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</div>
                    </div>
                  </div>
                  <button className="btn btn-ghost btn-sm" onClick={onSyncNow} style={{marginBottom:8}}>{I.refresh}Sync now</button>
                  <button className="btn btn-danger btn-sm" onClick={signOut}>Sign out</button>
                </div>
                :
                <div>
                  <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:10,lineHeight:1.5}}>Connected. Sign in, or create an account to back up & sync your data.</div>
                  <div className="field" style={{marginBottom:10}}><label>Email</label><input type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)} /></div>
                  <div className="field" style={{marginBottom:6}}><label>Password</label><input type="password" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)} /></div>
                  <div className="auth-row">
                    <button className="btn btn-accent btn-sm" disabled={!email.trim()||pw.length<6} style={{opacity:email.trim()&&pw.length>=6?1:.45}} onClick={signIn}>Sign in</button>
                    <button className="btn btn-ghost btn-sm" disabled={!email.trim()||pw.length<6} style={{opacity:email.trim()&&pw.length>=6?1:.45}} onClick={signUp}>Create account</button>
                  </div>
                  <button onClick={onDisconnect} style={{display:'block',margin:'12px auto 0',color:'var(--muted2)',fontSize:12,textDecoration:'underline'}}>Disconnect this project</button>
                </div>}
            {syncStatus && <div className="status-msg">{syncStatus}</div>}
          </div>

          {/* UNITS + DATA */}
          <div className="set-block">
            <h3>{I.gear}General</h3>
            <label style={{display:'block',fontSize:12,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>Weight unit</label>
            <div className="preset-row" style={{marginBottom:16}}>
              <button className={unit==='lb'?'on':''} onClick={()=>setUnit('lb')}>Pounds (lb)</button>
              <button className={unit==='kg'?'on':''} onClick={()=>setUnit('kg')}>Kilograms (kg)</button>
            </div>
            <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm('Reset all local data? This clears your routines and logged history on this device. If you\u2019re signed in to cloud sync, this also overwrites your cloud copy on next sync.')) onResetData(); }}>{I.trash}Reset all data</button>
          </div>

          <div className="attrib">IronLog · data stored locally + optional Supabase sync · exercise media: free-exercise-db (CC0)</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppErrorBoundary><App/></AppErrorBoundary>);
</script>

<!-- ============ Register the service worker (enables offline + install) ============ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js')
        .then(function (reg) { console.log('IronLog SW registered:', reg.scope); })
        .catch(function (err) { console.log('IronLog SW registration failed:', err); });
    });
  }
</script>
</body>
</html>
